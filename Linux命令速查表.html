如果对目录设置了粘滞位，则能够阻止用户删除或者重命名其中的文件**，除非用户是该目录的属主、或者是文件的属主、又或者是超级用户。粘滞位常用来控制对共享目录（如 `/tmp`）的访问                       |\n\n**本章要点速记**：\n\n1. `ls -l` 前 10 个字符：第 1 位是文件类型（`-` `d` `l` `c` `b`），后 9 位是\"属主/属组/其他\"各 3 位的 `rwx` 权限模式。\n2. `r`=4、`w`=2、`x`=1，三个八进制数位（如 `600`、`775`）就能描述完整模式。\n3. `chmod` 有两种写法：八进制（`chmod 600 file`）和符号（`chmod u+x,go=rx file`）；符号写法的优势是可以只改动某一类用户的权限。\n4. `umask` 是\"去除权限\"的掩码——掩码里为 1 的位，对应权限被去掉；默认常为 `0002` 或 `0022`，且只对当前 Shell 会话有效。\n5. 特殊权限：setuid（4000）、setgid（2000）、sticky（1000）；对**目录**设置 setgid 能让内部新建文件继承目录属组，这是共享目录的标准做法。\n6. `su` 起新 Shell 且加载对方环境（所以命令要加引号），`sudo` 不起新 Shell、不加载对方环境、只输自己的密码；`chown`/`chgrp` 需要超级用户权限，`passwd` 普通用户改自己、超级用户改别人。\n\n---\n\n---"],"relTips":[],"demo":[["cmd","passwd"],["out","Changing password for me.\nCurrent password: \nNew password: \nRetype new password: \npasswd: password updated successfully"],["err","BAD PASSWORD: it is too short"],["cmt","# 太短 / 太像旧密码 / 字典词一律被拒绝"]],"multi":false},{"id":68,"key":"su","cmd":"su","plain":"su","desc":"以其他用户身份启动 Shell","descShort":"以其他用户身份启动 Shell","detail":"在 Shell 会话中\"扮演\"其他用户，以该用户的 ID 启动新的 Shell 会话，或是以该用户的身份执行单个命令。","chapter":"第9章","cno":9,"chapterTitle":"权限","chapters":["第9章"],"part":"二·配置与环境","partNo":2,"cats":["⑪ 权限与用户"],"core":true,"idxChapters":"第9章","kind":"cmd","syntax":"su [-[l]] [user]","syntaxNote":"","options":[{"flag":"-l","desc":"启动的 Shell 会话将作为指定用户的**登录 Shell**：会加载用户环境并将工作目录更改为该用户的主目录。这是通常想要的结果。可以缩写为 `-`，而且这还是常用的写法。"},{"flag":"-c 'command'","desc":"执行单个命令。**一定记得将命令放进引号**，因为我们不希望扩展发生在当前 Shell 中，而是要留到新 Shell 中扩展。"}],"optTitle":"","examples":["  su -\n  # Password:\n  # [root@linuxbox ~]#            提示符末尾变为 #，工作目录变为超级用户主目录（通常 /root）\n  exit                            # 结束超级用户 Shell，返回之前的 Shell 环境\n\n  su -c 'ls -l /root/*'\n  # Password:\n  # -rw------- 1 root root     754 2007-08-11 03:19 /root/anaconda-ks.cfg"],"tip":"如果没有指定用户，那么假定其为超级用户。提示符末尾字符是 `#` 而不是 `$`，表明该 Shell 拥有超级用户权限。","tips":["如果没有指定用户，那么假定其为超级用户。提示符末尾字符是 `#` 而不是 `$`，表明该 Shell 拥有超级用户权限。"],"relTips":[],"demo":[["cm rs":"第10章","kind":"cmd","syntax":"fg [%作业号]","syntaxNote":"","options":[],"optTitle":"","examples":["  fg %1\n  # xlogo"],"tip":"`fg` 命令后面加上百分号和作业号（称为作业参数）。**如果只有一个后台作业，作业参数可选。** 返回前台后按 `Ctrl-C` 组合键就可以终止程序。","tips":["`fg` 命令后面加上百分号和作业号（称为作业参数）。**如果只有一个后台作业，作业参数可选。** 返回前台后按 `Ctrl-C` 组合键就可以终止程序。"],"relTips":[],"demo":[["cmd","jobs"],["out","[1]+  Stopped                 xlogo"],["cmd","fg %1"],["out","xlogo"],["cmt","# 之后按 Ctrl-C 就能终止它"]],"multi":false},{"id":73,"key":"halt / poweroff / reboot / shutdown","cmd":"halt / poweroff / reboot / shutdown","plain":"halt / poweroff / reboot / shutdown","desc":"关闭系统","descShort":"关闭系统","detail":"关闭系统涉及**有序地终止所有进程**，还要在断电之前执行重要的内务整理工作（如同步所有已挂载的文件系统）。","chapter":"第10章","cno":10,"chapterTitle":"进程","chapters":["第10章"],"part":"二·配置与环境","partNo":2,"cats":["⑫ 进程与作业"],"core":false,"idxChapters":"","kind":"cmd","syntax":"`halt` / `poweroff` / `reboot`（通常不加任何参数） / `shutdown [选项] 时间`","syntaxNote":"","options":[{"flag":"-h","desc":"挂起（关机）。常见用法：`shutdown -h now`。"},{"flag":"-r","desc":"重启。`shutdown -r now`。"}],"optTitle":"","examples":["  sudo reboot\n  sudo shutdown -h now          # 挂起系统\n  sudo shutdown -r now          # 重启系统"],"tip":"一旦执行了 `shutdown` 命令，就会向所有登录用户\"广播\"一条消息，警告他们即将发生的事件。\n\n**本章重要表格**：\n\n表 10-1 进程状态（`STAT` 列）\n\n| 状态  | 含义                                                                                                   |\n| --- | ---------------------------------------------------------------------------------------------------- |\n| `R` | 运行状态。该进程正在运行或准备运行                                                                                    |\n| `S` | 睡眠状态。该进程正在等待某个事件，例如按键或网络分组                                                                           |\n| `D` | 不可中断的睡眠状态。该进程正在等待 I/O，例如磁盘设备的 I/O                                                                    |\n| `T` | 已停止。该进程按照指示停止。本章随后会详述                                                                                |\n| `Z` | 已\"死\"的（defunct）或\"僵尸\"进程。这是已终止但未被其父进程清理的子进程                                                             |\n| `\u003c` | 高优先级进程。该进程可以被赋予更高的优先级，分配更多的 CPU。进程的这种属性称为友善度（niceness）。进程的优先级越高，友善度就越低，因为它会占用更多的 CPU 时间，而其他进程能得到的就少了 |\n| `N` | 低优先级进程。低优先级进程（友善进程）只能在更高优先级的进程被服务完毕之后才能得到 CPU 时间                                                     |\n\n表 10-2 BSD 风格的 `ps` 命令的列信息\n\n| 列名      | 含义                            |\n| ------- | ----------------------------- |\n| `USER`  | 用户 ID。该进程的属主                  |\n| `%CPU`  | CPU 占用率                       |\n| `%MEM`  | 内存占用率                         |\n| `VSZ`   | 虚拟内存大小                        |\n| `RSS`   | 驻留集大小。该进程占用的 RAM 数量（以 KB 为单位） |\n| `START` | 进程启动时间。如果数值超过 24h，则使用日期来显示    |\n\n表 10-3 `top` 命令信息字段（总体状态部分）\n\n| 行 | 字段              | 含义                                                                                                                                        |\n| - | --------------- | ----------------------------------------------------------------------------------------------------------------------------------------- |\n| 1 | `top`           | 程序名称                                                                                                                                      |\n| 1 | `14:59:20`      | 当前时刻                                                                                                                                      |\n| 1 | `up 6:30`       | 正常运行时间（uptime）。这是自上次重启之后的时间总和。在本例中，系统已经持续运行了 6.5h                                                                                         |\n| 1 | `2 users`       | 有两个登录用户                                                                                                                                   |\n| 1 | `load average:` | 平均负载，指的是等待运行的进程数量；也就是处于可运行状态且共享 CPU 的进程数量。其显示的 3 个值分别对应于不同的时间段。第 1 个是过去 60s 的平均值，第 2 个是过去 5min 的平均值，第 3 个是过去 15min 的平均值。低于 1.0 的值表明系统并不繁忙 |\n| 2 | `Tasks:`        | 统计了进程数量及其状态                                                                                                                               |\n| 3 | `Cpu(s):`       | 这一行描述了 CPU 正在运行的活动的特征                                                                                                                     |\n| 3 | `0.7%us`        | CPU 0.7% 的时间被用于用户进程（内核之外的进程）                                                                                                              |\n| 3 | `1.0%sy`        | CPU 1.0% 的时间被用于系统（内核）进程                                                                                                                   |\n| 3 | `0.0%ni`        | CPU 0.0% 的时间被用于\"友善\"（低优先级）进程                                                                                                               |\n| 3 | `98.3%id`       | CPU 98.3% 的时间是空闲的                                                                                                                         |\n| 3 | `0.0%wa`        | CPU 0.0% 的时间用于等待 I/O                                                                                                                      |\n| 4 | `Mem:`          | 使用了多少物理内存                                                                                                                                 |\n| 5 | `Swap:`         | 使用了多少交换空间（虚拟内存）                                                                                                                           |\n\n表 10-4 `kill` 命令的常用信号\n\n| 编号 | 名称     | 含义                                                                                                                                                                                                  |\n| -- | ------ | --------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |\n| 1  | `HUP`  | 挂起（hang up）信号。这是过去的\"美好时光\"留下的印记，当时终端是通过电话线和调制解调器与远程计算机连接的。该信号用于向程序表明控制终端已\"挂起\"。HUP 信号的效果可以通过关闭终端会话来演示。在终端运行的前台程序会接收到该信号并终止，很多守护进程也利用 HUP 信号进行二次初始化——这意味着如果守护进程接收到该信号，会重启并读取配置文件。Web 服务器 Apache 就是这么做的 |\n| 2  | `INT`  | 中断（interrupt）信号。效果和在终端按 `Ctrl-C` 组合键一样，通常用于终止程序                                                                                                                                                     |\n| 9  | `KILL` | \"杀死\"（kill）信号。该信号比较特别。尽管程序可以选择以不同的方式处理发送给它们的信号，包括完全将其忽略，但 KILL 信号其实从来不会被发送给目标进程。相反，内核会立即终止进程。如果进程是以这种方式终止的，则没有机会善后或保存已完成的工作。出于此原因，KILL 信号应该作为最后的手段，在其他终止信号均无效的情况下使用                                  |\n| 15 | `TERM` | 终止（terminate）信号。这是 `kill` 命令发送的默认信号。如果进程还有足够的\"活力\"（alive）接收信号，该进程会被终止                                                                                                                                |\n| 18 | `CONT` | 继续（continue）信号。该信号可以在 STOP 信号或 TSTP 信号之后恢复进程。`bg` 命令和 `fg` 命令会发送这个信号                                                                                                                                |\n| 19 | `STOP` | 停止（stop）信号。该信号并不终止进程，而只是将其暂停。和 KILL 信号一样，它不向目标进程发送，因此不能被忽略                                                                                                                                          |\n| 20 | `TSTP` | 终端停止（terminal stop）信号。该信号会在用户按 `Ctrl-Z` 组合键时由终端发送。和 STOP 信号不同，TSTP 信号由进程接收，不过进程可以选择将其忽略                                                                                                             |\n\n表 10-5 系统的常用信号\n\n| 编号 | 名称      | 含义                                                                                                    |\n| -- | ------- | ----------------------------------------------------------------------------------------------------- |\n| 3  | `QUIT`  | 退出（quit）信号                                                                                            |\n| 11 | `SEGV`  | 段错误（segmentation violation）信号。如果进程违规使用内存，就会收到该信号，例如，你试图在无写入权限的内存区域执行写入操作                              |\n| 28 | `WINCH` | 窗口变化（windows change）信号。如果窗口大小发生变化，系统会发送该信号。有些程序（如 `top` 程序和 `less` 程序）会通过重新绘制自身来响应 WINCH 信号，以适应新的窗口尺寸 |\n\n表 10-6 与进程相关的命令\n\n| 命令       | 描述                                                                                                           |\n| -------- | ------------------------------------------------------------------------------------------------------------ |\n| `pstree` | 以树状结构输出进程列表，显示进程之间的父子关系                                                                                      |\n| `vmstat` | 输出结果包括内存、交换空间、磁盘 I/O 在内的系统资源使用情况信息。如果想要查看持续的输出结果，可以在命令后面加上一个更新间隔时间（以秒为单位）。例如 `vmstat 5`。按 `Ctrl-C` 组合键可以终止输出 |\n| `xload`  | 图形化程序，随时间绘制显示系统负载的图形                                                                                         |\n| `tload`  | 和 `xload` 命令类似，不过是在终端中绘制图形。按 `Ctrl-C` 组合键可以终止输出                                                              |\n\n**本章要点速记**：\n\n1. 系统启动后内核运行 `init`，**init 的 PID 始终为 1**；一个程序能启动其他程序，即父进程生成子进程。\n2. 前台的程序会占住 Shell 提示符；命令后加 `\u0026` 可立即放到后台，Shell 返回 `[作业号] PID`。\n3. `Ctrl-C` = 中断（发 `INT`），`Ctrl-Z` = 暂停（发 `TSTP`）；`fg`/`bg` 加 `%作业号` 把作业切回前台/后台。\n4. `kill` 本质是**发信号**而非\"杀死\"；默认发 `TERM`（15），信号可用编号、名称或带 `SIG` 的名称指定，用 `kill -l` 可列出全部信号。\n5. `KILL`（9）和 `STOP`（19）特殊——不发给进程本身，由内核直接执行，所以不能被忽略；`KILL` 应作为最后手段。\n6. 关机命令有 `halt`、`poweroff`、`reboot`、`shutdown`；`shutdown -h now` 关机、`-r now` 重启，且会向所有登录用户广播消息。\n\n---\n\n---","tips":["一旦执行了 `shutdown` 命令，就会向所有登录用户\"广播\"一条消息，警告他们即将发生的事件。\n\n**本章重要表格**：\n\n表 10-1 进程状态（`STAT` 列）\n\n| 状态  | 含义                                                                                                   |\n| --- | ---------------------------------------------------------------------------------------------------- |\n| `R` | 运行状态。该进程正在运行或准备运行                                                                                    |\n| `S` | 睡眠状态。该进程正在等待某个事件，例如按键或网络分组                                                                           |\n| `D` | 不可中断的睡眠状态。该进程正在等待 I/O，例如磁盘设备的 I/O                                                                    |\n| `T` | 已停止。该进程按照指示停止。本章随后会详述   | 定义了字符集及其所使用语言的排序方式                                                                            |\n| `OLDPWD`  | 先前的工作目录                                                                                       |\n| `PAGER`   | 用于对输出结果进行分页的程序名称。通常设置为 `/usr/bin/less`                                                        |\n| `PATH`    | 由冒号分隔的目录列表，Shell 会在其中搜索用户输入的可执行程序名称                                                           |\n| `PS1`     | \"提示字符串 1\"（prompt string 1）的缩写。其中定义了 Shell 提示符的内容。该变量的可定制性很强                                   |\n| `PWD`     | 当前工作目录                                                                                        |\n| `TERM`    | 终端类型名称。类 UNIX 系统支持多种终端协议；该变量设置了用户所用的终端仿真器的协议                                                  |\n| `TZ`      | 指定时区。大多数类 UNIX 系统以世界标准时间（Coordinated Universal Time，UTC）来维护计算机的内部时钟，而显示的本地时间则是根据该变量指定的时差计算出来的 |\n| `USER`    | 用户名                                                                                           |\n\n表 11-2 登录 Shell 会话读取的启动文件\n\n| 文件                | 内容                                                                                        |\n| ----------------- | ----------------------------------------------------------------------------------------- |\n| `/etc/profile`    | 应用于所有用户的全局配置脚本                                                                            |\n| `~/.bash_profile` | 用户的个人启动文件。可用于扩展或覆盖全局配置脚本中的设置                                                              |\n| `~/.bash_login`   | 如果没有找到 `~/.bash_profile`，Bash 会尝试读取该脚本                                                    |\n| `~/.profile`      | 如果 `~/.bash_profile` 和 `~/.bash_login` 都没有找到，Bash 会尝试读取该文件。这是基于 Debian 发行版（如 Ubuntu）的默认文件 |\n\n表 11-3 非登录 Shell 会话读取的启动文件\n\n| 文件                 | 内容                           |\n| ------------------ | ---------------------------- |\n| `/etc/bash.bashrc` | 应用于所有用户的全局配置脚本               |\n| `~/.bashrc`        | 用户的个人启动文件。可用于扩展或覆盖全局配置脚本中的设置 |\n\n表 11-4 `.bashrc` 文件中添加的内容\n\n| 行                                  | 含义                                 |\n| ---------------------------------- | ---------------------------------- |\n| `umask 0002`                       | 设置掩码，解决第 9 章中讨论过的共享目录问题            |\n| `export HISTCONTROL=ignoredups`    | 使 Shell 的历史记录特性忽略已经记录过的相同命令        |\n| `export HISTSIZE=1000`             | 将命令历史记录的数量从默认的 500 行增加到 1000 行     |\n| `alias l.='ls -d .* --color=auto'` | 创建名为 `l.` 的新命令，该命令能够显示以点号开头的所有目录条目 |\n| `alias ll='ls -l --color=auto'`    | 创建名为 `ll` 的新命令，该命令能够以长格式显示目录条目     |\n\n**本章要点速记**：\n\n1. 环境里有两类变量（环境变量 / Shell 变量，Bash 中基本无区别）外加程序化数据（别名、Shell 函数）；`set` 显示全部并按字母排序，`printenv` 只显示环境变量，别名两者都看不到、只能用 `alias`。\n2. 登录 Shell 读 `/etc/profile` → `~/.bash_profile` →（找不到就）`~/.bash_login` →（再找不到就）`~/.profile`；非登录 Shell 读 `/etc/bash.bashrc` 和 `~/.bashrc`，并继承父进程环境。\n3. `~/.bashrc` 基本上总会被读取，是普通用户最该关心的启动文件。\n4. 命令的查找靠 `PATH`，它的设置通常是 `PATH=$PATH:$HOME/bin`（参数扩展，把新目录追加到尾部）。\n5. `export` 决定变量能否被**子进程**看到；改完启动文件用 `source ~/.bashrc` 立即生效，不必重开终端。\n6. 改 `PATH` 和额外环境变量放 `.bash_profile`（Ubuntu 用 `.profile`），其他改动放 `.bashrc`；动配置文件前先 `cp .bashrc .bashrc.bak` 做备份，并养成写 `#` 注释的习惯。\n\n---\n\n---","tips":["屏幕显示内容分为 3 个部分——顶部的标题、中间的可编辑文本和底部的命令菜单。使用下方向键或者下翻页键可以将光标移动到文件的末尾。\n\n**本章重要表格**：\n\n表 11-1 环境变量（原文说：虽然你所在系统的环境未必与这里显示的一样，还是可能看到这些）\n\n| 变量        | 内容                                                                                            |\n| --------- | --------------------------------------------------------------------------------------------- |\n| `DISPLAY` | 屏幕（display）名称（如果你启用了图形化环境）。这个值通常是 `:0`，代表 X 服务器生成的第一个屏幕                                       |\n| `EDITOR`  | 用于文本编辑的程序名称                                                                                   |\n| `SHELL`   | Shell 程序名称                                                                                    |\n| `HOME`    | 主目录的路径名                                                                                       |\n| `LANG`    | 定义了字符集及其所使用语言的排序方式 --------------- |\n| `x`    | 当前字符                |\n| `3x`   | 当前字符和接下来的两个字符       |\n| `dd`   | 当前行                 |\n| `5dd`  | 当前行和接下来的 4 行        |\n| `dW`   | 从光标所在处一直到下一个单词开头    |\n| `d$`   | 从光标所在处一直到行尾         |\n| `d0`   | 从光标所在处一直到行首         |\n| `d^`   | 从光标所在处一直到行中第一个非空白字符 |\n| `dG`   | 从当前行一直到文件末尾         |\n| `d20G` | 从当前行一直到第 20 行       |\n\n表 12-4 `y` 命令与各种光标移动命令配合使用的示例\n\n| 命令     | 复制内容                |\n| ------ | ------------------- |\n| `yy`   | 当前行                 |\n| `5yy`  | 当前行和接下来的 4 行        |\n| `yW`   | 从光标所在处一直到下一个单词开头    |\n| `y$`   | 从光标所在处一直到行尾         |\n| `y0`   | 从光标所在处一直到行首         |\n| `y^`   | 从光标所在处一直到行中第一个非空白字符 |\n| `yG`   | 从当前行一直到文件末尾         |\n| `y20G` | 从当前行一直到第 20 行       |\n\n表 12-5 全局搜索和替换的用法示例（各组成部分）\n\n| 组成            | 含义                                                                                                       |\n| ------------- | -------------------------------------------------------------------------------------------------------- |\n| `:`           | 冒号表示接下来是 ex 命令                                                                                           |\n| `%`           | 指定操作的行范围。`%` 是一种便捷写法，代表从第一行到最后一行。也可以将该范围写作 `1,5`（因为文件长度为 5 行）或者 `1,$`（表示从第 1 行到最后一行）。如果未指定行范围，则仅对当前行执行操作 |\n| `s`           | 指定操作。在这个示例中，指定替换（substitution）操作                                                                         |\n| `/Line/line/` | 指定搜索模式和替换文本                                                                                              |\n| `g`           | 代表全局（global），表示对行中所有搜索字符串执行替换操作。如果不指定，则仅替换每行搜索到的第一个字符串                                                   |\n\n表 12-6 确认替换按键\n\n| 按键                  | 操作                          |\n| ------------------- | --------------------------- |\n| `y`                 | 执行替换                        |\n| `n`                 | 跳过此次替换                      |\n| `a`                 | 执行所有替换                      |\n| `q` 或 `Esc`         | 退出替换                        |\n| `l`                 | 执行此次替换，然后退出。这是 last 的缩写     |\n| `Ctrl-E` / `Ctrl-Y` | 分别表示向下滚动和向上滚动。可用于查看被替换处的上下文 |\n\n**本章要点速记**：\n\n1. Vi 是**模式编辑器**：启动即命令模式（按键即命令）；`i`/`a`/`A`/`o`/`O` 进插入模式、`Esc` 回命令模式；`:` 进 ex 命令模式；迷路时连按两次 `Esc`。\n2. 移动靠 `h j k l`（配方向键）、`0 ^ $`、`w W b B`、`Ctrl-F`/`Ctrl-B`、`数字 G`/`G`，命令前可加数字前缀表示次数（如 `5j`）。\n3. 删除 `x`/`3x`/`dd`/`5dd`/`dW`/`d$`/`d0`/`d^`/`dG`/`d20G` 与复制 `yy`/`5yy`/`yW`/`y$`/`y0`/`y^`/`yG`/`y20G` 的\"命令 + 移动命令\"组合规律完全一致；`d` 会顺带剪切到粘贴缓冲区，用 `p`/`P` 粘贴。\n4. `u` 撤销（Vim 支持多级撤销，标准 Vi 仅单级）；`J` 合并当前行与下一行（别和 `j` 混）。\n5. 保存与退出：`:w`（可另存为）、`:q`、`:q!`（强退）、`:wq`、`ZZ`；原文未出现 `:x`。\n6. 多文件靠 `:e`（加入）、`:bn`/`:bp`（切换）、`:buffers`/`:buffer 编号`（查看与切换）、`:r 文件名`（插入整个文件）；切换前必须先保存，或加 `!` 强制。\n7. 搜索替换用 `/字符串` 配 `n` 重复、`:[范围]s/旧/新/[g]`，加 `c` 可逐个确认。\n\n---\n\n---","tips":["不同的 Linux 发行版自带的 Vim 也不尽相同，有些默认安装的是最小版本的 Vim，仅支持有限的 Vim 特性集。\n\n**本章重要表格**：\n\n表 12-1 光标移动命令\n\n| 命令             | 光标移动                          |\n| -------------- | ----------------------------- |\n| `l` 或右方向键      | 向右移动一个字符                      |\n| `h` 或左方向键      | 向左移动一个字符                      |\n| `j` 或下方向键      | 向下移动一行                        |\n| `k` 或上方向键      | 向上移动一行                        |\n| 数字 `0`         | 移动到当前行行首                      |\n| `^`            | 移动到当前行中第一个非空白字符处              |\n| `$`            | 移动到当前行行尾                      |\n| `w`            | 移动到下一个单词开头或标点符号               |\n| `W`            | 移动到下一个单词开头，忽略标点符号             |\n| `b`            | 移动到上一个单词开头或标点符号               |\n| `B`            | 移动到上一个单词开头，忽略标点符号             |\n| `Ctrl-F` 或下翻页键 | 移动到下一页                        |\n| `Ctrl-B` 或上翻页键 | 移动到上一页                        |\n| 数字键 `G`        | 移动到指定行。例如 `1G` 可以使光标移动到文件的第一行 |\n| `G`            | 移动到文件的最后一行                    |\n\n表 12-2 新建命令\n\n| 命令  | 新建内容       |\n| --- | ---------- |\n| `o` | 在当前行之下新建一行 |\n| `O` | 在当前行之上新建一行 |\n\n（进入插入模式的其他按键，原文以文字描述、未做成编号表格，整理如下）\n\n| 命令    | 作用                         |\n| ----- | -------------------------- |\n| `i`   | 进入插入模式，从光标 es"],"tip":"原文说明 `genisoimage` 与 `wodim` 是 `cdtools` 项目分叉后的替代品（分别替代 `mkisofs`、`cdrecord`）。","tips":["原文说明 `genisoimage` 与 `wodim` 是 `cdtools` 项目分叉后的替代品（分别替代 `mkisofs`、`cdrecord`）。"],"relTips":[],"demo":[["cmd","genisoimage -o cd.iso -R -J ~/myfiles"],["out","Total translation table size: 0\nDone with: Writing ISO9660 filesystem\nMax brk space used 0\n"],["cmt","# -R Rock Ridge 支持长文件名 -J 兼容 Windows Joliet"]],"multi":false},{"id":118,"key":"md5sum","cmd":"md5sum","plain":"md5sum","desc":"计算 MD5 校验和","descShort":"计算 MD5 校验和","detail":"产生代表目标文件内容的一串十六进制数（校验和），用于核对下载的 ISO 映像完整性、以及核实刻录好的光盘。","chapter":"第15章","cno":15,"chapterTitle":"存储介质","chapters":["第15章"],"part":"三·常见任务与工具","partNo":3,"cats":["⑭ 磁盘与存储"],"core":true,"idxChapters":"第15章","kind":"cmd","syntax":"md5sum 文件","syntaxNote":"","options":[],"optTitle":"","examples":["  md5sum image.iso\n  # 输出：34e354760f9bb7fbf85c96f6a3f94ece  image.iso\n  md5sum /dev/cdrom"],"tip":"校验和通过复杂数学运算得到，**即便文件内容只改变某一个位，结果也会大不相同**。下载后应自己算出校验和，与发行方提供的比对。核实光盘时要\"只计算光盘中包含该 ISO 映像文件数据的那部分\"，因为光盘总以 2KB 块为单位写入；以整盘刻录模式制作的 CD-R/CD-RW 可用 `md5sum /dev/cdrom` 直接检查，许多介质（如 DVD）则需精确计算块数量（原文给出的 DVD 示例结合了 `dd bs=2048 count=...` 和 `stat -c \"%s\"`）。\n\n**本章重要表格**：\n\n原文表 15-1 `/etc/fstab` 文件字段：\n\n| 字段 | 内容     | 描述                                                                                                                                       |\n| -- | ------ | ---------------------------------------------------------------------------------------------------------------------------------------- |\n| 1  | 设备     | 以前放与物理设备关联的设备文件名，如 `/dev/hda1`（被检测到的第一个硬盘的第一个分区）。因如今有大量可热插拔设备，很多现代发行版改用文本标签（设备格式化后添加）或随机生成的 UUID 来关联设备；挂载时系统读取标签，从而不管实际分配的是哪个设备文件都能被正确识别 |\n| 2  | 挂载点    | 设备被挂接在文件系统树上的位置（目录）                                                                                                                      |\n| 3  | 文件系统类型 | Linux 允许挂载多种类型。多数原生 Linux 文件系统用 ext4，也支持 FAT16（msdos）、FAT32（vfat）、NTFS（ntfs）、CD-ROM（ISO 9660）等                                           |\n| 4  | 选项     | 文件系统有各种挂载选项。例如可以只读挂载，或禁止执行其中的任何程序（对可移动设备很有用）                                                                                             |\n| 5  | 频率     | dump 命令用该数值决定是否对文件系统备份以及多久备份一次                                                                                                           |\n| 6  | 顺序     | fsck 命令用该数值决定文件系统的检查顺序                                                                                                                   |\n\n原文表 15-2 Linux 存储设备模式：\n\n| 模式         | 设备                                                                                                                                                                                                                                         |\n| ---------- | ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ |\n| `/dev/fd*` | 软盘驱动器                                                                                                                                                                                                                                      |\n| `/dev/hd*` | 旧式系统中的 IDE（PATA）磁盘。典型主板有两个 IDE 接口/通道，每条线缆上有两个驱动器插口：第一个称主设备（master device），第二个称从设备（slave device）。命名规则：`/dev/hda` 是第一个通道上的主设备，`/dev/hdb` 是第一个通道上的从设备，`/dev/hdc` 是第二个通道上的主设备，以此类推。末尾数字代表分区号，如 `/dev/hda1` 表示第一块硬盘的第一个分区，其中 `/dev/hda` 代表整个驱动器 |\n| `/dev/lp*` | 打印机                                                                                                                                                                                                                                        |\n| `/dev/sd*` | SCSI 磁盘。现代 Linux 内核将所有类似磁盘的设备（包括 PATA/SATA 硬盘、闪存驱动器、便携音乐播放器及数码相机等 USB 大容量存储设备）都视为 SCSI 磁盘。其余命名规则与 `/dev/hd*` 类似                                                                                                                            |\n| `/dev/sr*` | 光驱（CD/DVD 播放器和刻录机）                                                                                                                                                                                                                         |\n\n原文另说明：`/dev/cdrom`、`/dev/dvd`、`/dev/floppy` 这类是符号链接，各自指向实际设备文件，采用符号链接只是出于方便。\n\n**本章要点速记**：\n\n- 挂载 = 把设备接进单一文件系统树；`/etc/fstab` 列出引导时挂载的设备，每行 6 个字段。\n- 现代发行版多用 LABEL/UUID 关联设备，避免因设备文件变化而挂错。\n- 卸载会把缓冲区数据写回设备，不卸载就拔盘可能损坏文件系统；设备被占用时无法卸载。\n- `/dev/sd*` 是现代内核对所有类磁盘设备的统一命名，末尾数字是分区号。\n- 创建文件系统两步：先（可选）用 `fdisk` 分区，再用 `mkfs -t 类型` 格式化；`fsck` 负责检查修复。\n- `dd` 能按块复制设备，但极易因写错 `if`/`of` 造成毁盘；`md5sum` 用于校验 ISO 与光盘完整性。\n\n---\n\n---","tips":["校验和通过复杂数学运算得到，**即便文件内容只改变某一个位，结果也会大不相同**。下载后应自己算出校验和，与发行方提供的比对。核实光盘时要\"只计算光盘中包含该 ISO 映像文件数据的那部分\"，因为光盘总以 2KB 块为单位写入；以整盘刻录模式制作的 CD-R/CD-RW 可用 `md5sum /dev/cdrom` 直接检查，许多介质（如 DVD）则需精确计算块数量（原文给出的 DVD 示例结合了 `dd bs=2048 count=...` 和 `stat -c \"%s\"`）。\n\n**本章重要表格**：\n\n原文表 15-1 `/etc/fstab` 文件字段：\n\n| 字段 | 内容     | 描述                                                                                                                                       |\n| -- | ------ | ---------------------------------------------------------------------------------------------------------------------------------------- |\n| 1  | 设备     | 以前放与物理设备关联的设备文件名，如 `/dev/hda1`（被检测到的第一个硬盘的第一个分区）。因如今有大量可热插拔设备，很多现代发行版改用文本标签（设备格式化后添加）或随机生成的 UUID 来关联设备；挂载时系统读取标签，从而不管实际分配的是哪个设备文件都能被正确识别 |\n| 2  | 挂载点    | 设备被挂接在文件系统树上的位置（目录）                                                                                                                      |\n| 3  | 文件系统类型 | Linux 允许挂载多种类型。多数原生 Linux 文件系统用 ext4，也支持 FAT16（msdos）、FAT32（vfat）、NTFS（ntfs）、CD-ROM（ISO 9660）等                                           |\n| 4  | 选项     | 文件系统有各种挂载选项。例如可以只读挂载，或禁止执行其中的任何程序（对可移动设备很有用）                                                                                             |\n| 5  | 频率     | dump 命令用该数值决定是否对文件系统备份以及多久备份一次                                                                                                           |\n| 6  | 顺序     | fsck 命令用该数值决定文件系统的检查顺序                                                                                                                   |\n\n原文表 15-2 Linux 存储设备模式：\n\n| 模式         | 设备                                                                                                                                                                                                                                         |\n| ---------- | ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ |\n| `/dev/fd*` | 软盘驱动器                                                                                                                                                                                                                                      |\n| `/dev/hd*` | 旧式系统中的 IDE（PATA）磁盘。典型主板有两个 IDE 接口/通道，每条线缆上有两个驱动器插口：第一个称主设备（master device），第二个称从设备（slave device）。命名规则：`/dev/hda` 是第一个通道上的主设备，`/dev/hdb` 是第一个通道上的从设备，`/dev/hdc` 是第二个通道上的主设备，以此类推。末尾数字代表分区号，如 `/dev/hda1` 表示第一块硬盘的第一个分区，其中 `/dev/hda` 代表整个驱动器 |\n| `/dev/lp*` | 打印机                                                                                                                                                                                                                                        |\n| `/dev/sd*` | SCSI 磁盘。现代 Linux 内核将所有类似磁盘的设备（包括 PATA/SATA 硬盘、闪存驱动器、便携音乐播放器及数码相机等 USB 大容量存储设备）都视为 SCSI 磁盘。其余命名规则与 `/dev/hd*` 类似                                                                                                                            |\n| `/dev/sr*` | 光驱（CD/DVD 播放器和刻录机）                                                                                                                                                                                                                         |\n\n原文另说明：`/dev/cdrom`、`/dev/dvd`、`/dev/floppy` 这类是符号链接，各自指向实际设备文件，采用符号链接只是出于方便。\n\n**本章要点速记**：\n\n- 挂载 = 把设备接进单一文件系统树；`/etc/fstab` 列出引导时挂载的设备，每行 6 个字段。\n- 现代发行版多用 LABEL/UUID 关联设备，避免因设备文件变化而挂错。\n- 卸载会把缓冲区数据写回设备，不卸载就拔盘可能损坏文件系统；设备被占用时无法卸载。\n- `/dev/sd*` 是现代内核对所有类磁盘设备的统一命名，末尾数字是分区号。\n- 创建文件系统两步：先（可选）用 `fdisk` 分区，再用 `mkfs -t 类型` 格式化；`fsck` 负责检查修复。\n- `dd` 能按块复制设备，但极易因写错 `if`/`of` 造成毁盘；`md5sum` 用于校验 ISO 与光盘完整性。\n\n---\n\n---"],"relTips":[],"demo":[["cmd","md5sum ubuntu.iso"],["out","d8ab5d58f0d0b1a0c4b0e6d3f6e5a1b2  ubuntu.iso"],["cmd","md5sum ubuntu.iso \u003e ubuntu.md5"],["cmd","md5sum -c ubuntu.md5"],["out","ubuntu.iso: OK"],["cmt","# 校验下载文件是否损坏/被篡改"]],"multi":false},{"id":119,"key":"mkfs","cmd":"mkfs","plain":"mkfs","desc":"创建（格式化）新的文件系统","descShort":"创建（格式化）新的文件系统","detail":"在分区上创建各种格式的文件系统，命令名来自\"make filesystem\"。","chapter":"第15章","cno":15,"chapterTitle":"存储介质","chapters":["第15章"],"part":"三·常见任务与工具","partNo":3,"cats":["⑭ 磁盘与存储"],"core":true,"idxChapters":"第15章","kind":"cmd","syntax":"mkfs -t 文件系统类型 分区名","syntaxNote":"","options":[{"flag":"-t","desc":"指定文件系统类型（如 `ext4`、`vfat`）。"}],"optTitle":"","examples":["  sudo mkfs -t ext4 /dev/sdb1\n  sudo mkfs -t vfat /dev/sdb1"],"tip":"命令会输出大量信息；示例输出末尾提到该文件系统会每隔一定挂载次数或天数自动检查，可用 `tune2fs -c` 或 `-i` 覆盖（原文仅在 mkfs 输出信息中提及 `tune2fs`）。","tips":["命令会输出大量信息；示例输出末尾提到该文件系统会每隔一定挂载次数或天数自动检查，可用 `tune2fs -c` 或 `-i` 覆盖（原文仅在 mkfs 输出信息中提及 `tune2fs`）。"],"relTips":[],"demo":[["cmd","sudo mkfs -t ext4 /dev/sdb1"],["out","mke2fs 1.47.0 (5-Feb-2023)\nCreating filesystem with 262144 4k blocks and 65536 inodes"],["cmt","# 会清空该分区！确认设备名再回车"]],"multi":false},{"id":120,"key":"mount","cmd":"mount","plain":"mount","desc":"挂载文件系统（不加参数则列出已挂载的文件系统）","descShort":"挂载文件系统（不加参数则列出已挂载的文件系统）","detail":"挂载设备/映像到文件系统树；不带参数时显示当前已挂载的文件系统列表。","chapter":"第15章","cno":15,"chapterTitle":"存储介质","chapters":["第15章"],"part":"三·常见任务与工具","partNo":3,"cats":["⑭ 磁盘与存储"],"core":true,"idxChapters":"第15章","kind":"cmd","syntax":"moun ftp [用户@]远程主机`（进入 `sftp\u003e` 提示符下输入子命令）","syntaxNote":"","options":[],"optTitle":"","examples":["  sftp remote-sys\n  # 会话内：\n  ls\n  lcd Desktop\n  get ubuntu-8.04-desktop-i386.iso\n  bye"],"tip":"相较于 ftp 的一个重要优势是**不需要远程主机运行 FTP 服务器，只要有 SSH 服务器就够了**——任何能接受 SSH 客户端连接的远程主机都可当作 FTP 服务器使用。原文窍门：许多图形文件管理器（GNOME 或 KDE）可在地址栏输入以 `sftp://` 开头的 URI 操作远程文件。\n\n**本章重要表格**：\n\n原文表 16-1 交互式 ftp 命令：\n\n| 命令                                   | 含义                                                                           |\n| ------------------------------------ | ---------------------------------------------------------------------------- |\n| `ftp fileserver`                     | 启动 ftp 程序，连接到 FTP 服务器 fileserver                                             |\n| `anonymous`                          | 用户名。登录提示要求输入密码。有些服务器可接受空密码，有些则要求输入电子邮件地址形式的密码，此时不妨尝试 `user@example.com` 这种密码 |\n| `cd pub/cd_images/ubuntu-18.04`      | 更改远程系统目录。注意，多数匿名 FTP 服务器中可供公开下载的文件位于 `pub` 目录下的某个位置                          |\n| `ls`                                 | 列出远程系统目录中的内容                                                                 |\n| `lcd Desktop`                        | 将本地系统的目录更改为 `~/Desktop`。在本例中 ftp 程序是在工作目录 `~` 中调用的                           |\n| `get ubuntu-18.04-desktop-amd64.iso` | 告诉远程系统把该文件传至本地系统。因为本地工作目录已更改为 `~/Desktop`，所以文件会被下载到该目录                       |\n| `bye`                                | 登出远程服务器，结束 ftp 会话。也可以使用 `quite` 和 `exit` 命令（原文如此）                            |\n\n**本章要点速记**：\n\n- `ping` 验证连通性，`traceroute` 看路径，`ip`（取代 ifconfig）看接口/路由，`netstat` 看接口与路由表。\n- 诊断时看接口信息第一行有无 `UP`、第 3 行的 `inet` 字段有无有效 IP。\n- FTP 明文传账号密码，故多为匿名；`lftp` 是更好的替代品。\n- `wget` 非交互下载，支持递归、后台、断点续传。\n- SSH 端口 22，解决\"认证主机\"和\"加密通信\"两件事；`ssh remote-sys 'ls *'` 里的单引号是让扩展在远端发生。\n- `scp` 像 `cp` 但路径前可带\"主机名:\"；`sftp` 是 ftp 的加密版，只要远端有 SSH 服务器即可。\n\n---\n\n---","tips":["相较于 ftp 的一个重要优势是**不需要远程主机运行 FTP 服务器，只要有 SSH 服务器就够了**——任何能接受 SSH 客户端连接的远程主机都可当作 FTP 服务器使用。原文窍门：许多图形文件管理器（GNOME 或 KDE）可在地址栏输入以 `sftp://` 开头的 URI 操作远程文件。\n\n**本章重要表格**：\n\n原文表 16-1 交互式 ftp 命令：\n\n| 命令                                   | 含义                                                                           |\n| ------------------------------------ | ---------------------------------------------------------------------------- |\n| `ftp fileserver`                     | 启动 ftp 程序，连接到 FTP 服务器 fileserver                                             |\n| `anonymous`                          | 用户名。登录提示要求输入密码。有些服务器可接受空密码，有些则要求输入电子邮件地址形式的密码，此时不妨尝试 `user@example.com` 这种密码 |\n| `cd pub/cd_images/ubuntu-18.04`      | 更改远程系统目录。注意，多数匿名 FTP 服务器中可供公开下载的文件位于 `pub` 目录下的某个位置                          |\n| `ls`                                 | 列出远程系统目录中的内容                                                                 |\n| `lcd Desktop`                        | 将本地系统的目录更改为 `~/Desktop`。在本例中 ftp 程序是在工作目录 `~` 中调用的                           |\n| `get ubuntu-18.04-desktop-amd64.iso` | 告诉远程系统把该文件传至本地系统。因为本地工作目录已更改为 `~/Desktop`，所以文件会被下载到该目录                       |\n| `bye`                                | 登出远程服务器，结束 ftp 会话。也可以使用 `quite` 和 `exit` 命令（原文如此）                            |\n\n**本章要点速记**：\n\n- `ping` 验证连通性，`traceroute` 看路径，`ip`（取代 ifconfig）看接口/路由，`netstat` 看接口与路由表。\n- 诊断时看接口信息第一行有无 `UP`、第 3 行的 `inet` 字段有无有效 IP。\n- FTP 明文传账号密码，故多为匿名；`lftp` 是更好的替代品。\n- `wget` 非交互下载，支持递归、后台、断点续传。\n- SSH 端口 22，解决\"认证主机\"和\"加密通信\"两件事；`ssh remote-sys 'ls *'` 里的单引号是让扩展在远端发生。\n- `scp` 像 `cp` 但路径前可带\"主机名:\"；`sftp` 是 ftp 的加密版，只要远端有 SSH 服务器即可。\n\n---\n\n---"],"relTips":[],"demo":[["cmd","sftp remote-sys"],["out","Connected to remote-sys.\nsftp\u003e ls\nDocuments  Pictures  notes.txt\nsftp\u003e get notes.txt\nFetching /home/me/notes.txt to notes.txt\nsftp\u003e put report.pdf\nsftp\u003e bye"],["cmt","# FTP 的安全版，全程走 SSH 加密"]],"multi":false},{"id":130,"key":"ssh","cmd":"ssh","plain":"ssh","desc":"OpenSSH 客户端（远程登录程序）","descShort":"OpenSSH 客户端（远程登录程序）","detail":"连接远程 SSH 服务器，打开远程 Shell 会话；也可在远程主机上直接运行命令。","chapter":"第16章","cno":16,"chapterTitle":"联网","chapters":["第16章"],"part":"三·常见任务与工具","partNo":3,"cats":["⑮ 网络与远程"],"core":true,"idxChapters":"第16章","kind":"cmd","syntax":"ssh [选项] [用户@]远程主机 [命令]","syntaxNote":"","options":[{"flag":"-X","desc":"传输 X Window 系统流量（启用 X11 转发）。"},{"flag":"-Y","desc":"原文提示，对某些系统可能需要用 `-Y` 代替 `-X`。"}],"optTitle":"","examples":["  ssh remote-sys\n  ssh bob@remote-sys\n  ssh remote-sys free\n  ssh remote-sys 'ls *' \u003e dirlist.txt\n  ssh remote-sys 'ls * \u003e dirlist.txt'\n  ssh -X remote-sys"],"tip":"第一次连接时会出现\"无法认证远程主机\"的提示（因为 ssh 之前从未接触过该主机），要接受远程主机凭证就输入 `yes`；随后会提示输入密码。远程 Shell 会话持续到在远程提示符输入 `exit` 为止。若本地账号与远程账号不一致，可在主机名前加用户名（`bob@remote-sys`）。**关于单引号**：`ssh remote-sys 'ls *' \u003e dirlist.txt` 用单引号是为了**不让本地主机做路径名扩展**，而在远程主机上扩展；若想把输出重定向到远程主机文件，就把重定向操作符和文件名一起放进单引号。","tips":["第一次连接时会出现\"无法认证远程主机\"的提示（因为 ssh 之前从未接触过该主机），要接受远程主机凭证就输入 `yes`；随后会提示输入密码。远程 Shell 会话持续到在远程提示符输入 `exit` 为止。若本地账号与远程账号不一致，可在主机名前加用户名（`bob@remote-sys`）。**关于单引号**：`ssh remote-sys 'ls *' \u003e dirlist.txt` 用单引号是为了**不让本地主机做路径名扩展**，而在远程主机上扩展；若想把输出重定向到远程主机文件，就把重定向操作符和文件名一起放进单引号。"],"relTips":[],"demo":[["cmd","ssh remote-sys"],["out","The authenticity of host 'remote-sys (192.168.1.9)' can't be established.\nED25519 key fingerprint is SHA256:xY7...\nAre you sure you want to continue connecting (yes/no)? yes\nWarning: Permanently added 'remote-sys' to the list of known hosts.\nme@remote-sys's password: \n[me@remote-sys ~]$ "],["cmt","# 第一次连接必须输入 yes 接受主机凭证；会话持续到 exit"],["cmd","ssh bob@remote-sys"],["cmt","# 本地账号和远程不一致时，用 用户@主机"]],"multi":false},{"id":131,"key":"traceroute","cmd":"traceroute","plain":"traceroute","desc":"输出分组抵达网络主机所经历的路线（有些系统用 tracepath 代替）","descShort":"输出分组抵达网络主机所经历的路线（有些系统用 tracepath 代替）","detail":"列出网络流量从本地系统到指定主机经过的所有跳（hop）数。","chapter":"第16章","cno":16,"chapterTitle":"联网","chapters":["第16章"],"part":"三·常见任务与工具","partNo":3,"cats":["⑮ 网络与远程"],"core":true,"idxChapters":"第16章","kind":"cmd","syntax":"traceroute 主机","syntaxNote":"","options":[{"flag":"-T","desc":"原文提示，如果路由信息被阻塞，有时候可以用它来解决。"},{"flag":"-I"  脚本","partNo":4,"cats":["② 文件与目录操作","㉓ 其他卡片（书中项目脚本与专题）"],"core":true,"idxChapters":"第17章、第23章","kind":"cmd","syntax":"if touch \"$filename\" \u0026\u0026 [[ -f \"$filename\" ]]; then … fi","syntaxNote":"","options":[],"optTitle":"","examples":["  # 输出HTML页\n\n  if [[ -n \"$filename\" ]]; then\n        if touch \"$filename\" \u0026\u0026 [[ -f \"$filename\" ]]; then\n              write_html_page \u003e \"$filename\"\n        else\n              echo \"$PROGNAME: Cannot write file '$filename'\" \u003e\u00262\n              exit 1\n        fi\n  else\n        write_html_page\n  fi","  touch playground/dir-{001..100}/file-{A..Z}\n  touch playground/timestamp","  [me@linuxbox diction-1.11]$ touch getopt.c"],"tip":"原文解释，\"这两处测试分别考虑到了输入的路径是否无效（`touch` 会执行失败）以及如果文件已存在，其是否为普通文件\"。\n\n**本章重要表格**：\n\n表 32-1 特殊参数 `*` 和 `@`\n\n| 参数   | 描述                                                                                             |\n| ---- | ---------------------------------------------------------------------------------------------- |\n| `$*` | 扩展成从 1 开始的位置参数列表。如果它出现在双引号内部，则扩展成由双引号引用的字符串，其中包含了所有的位置参数，彼此之间以 Shell 变量 `IFS` 的第一个字符分隔（默认是空格符） |\n| `$@` | 扩展成从 1 开始的位置参数列表。如果它出现在双引号内部，则将每个位置参数扩展成独立的单词                                                  |\n\n**本章要点速记**：\n\n1. `$0` 是执行程序的路径，永远存在；`$1`～`$9` 是前 9 个参数；第 9 个之后要写 `${10}` 这种形式。\n2. `$#` 是参数个数，常与 `while [[ $# -gt 0 ]]` 搭配。\n3. `shift` 每次把参数整体左移一位并让 `$#` 减一，是遍历大量参数的标准手段。\n4. 位置参数对 Shell 函数同样有效；函数里要用 `$FUNCNAME` 而不是 `$0` 来取函数名。\n5. `$*`/`$@` 不加引号都按单词分割；`\"$*\"` 合成一个单词；`\"$@\"` 逐个保留参数整体性，最通用。\n6. `while [[ -n \"$1\" ]]` + `case` + `shift` 是解析命令行选项的经典骨架。\n\n---\n\n---","tips":["原文解释，\"这两处测试分别考虑到了输入的路径是否无效（`touch` 会执行失败）以及如果文件已存在，其是否为普通文件\"。\n\n**本章重要表格**：\n\n表 32-1 特殊参数 `*` 和 `@`\n\n| 参数   | 描述                                                                                             |\n| ---- | ---------------------------------------------------------------------------------------------- |\n| `$*` | 扩展成从 1 开始的位置参数列表。如果它出现在双引号内部，则扩展 /Pictures/photo1.jpg\n/home/me/Pictures/trip/beijing.jpg"],["cmd","find ~ -type d -name '.git'"],["cmt","# 只找目录"],["cmd","find . -name '*.html' -size +1M"],["cmt","# 组合条件：大于 1MB 的 HTML"],["cmd","find . -type f -exec ls -l {} \\;"],["out","-rw-r--r-- 1 me me 1024 Feb  2 15:50 ./a.txt"],["cmd","find . -type f | xargs grep -l 'main'"],["cmt","# find + xargs 经典组合"]],"multi":true},{"id":135,"key":"locate","cmd":"locate","plain":"locate","desc":"按照路径名查找文件","descShort":"按照路径名查找文件","detail":"对路径名数据库执行快速查找，输出与给定字符串匹配的名称。","chapter":"第17章","cno":17,"chapterTitle":"查找文件","chapters":["第17章","第19章"],"part":"三·常见任务与工具","partNo":3,"cats":["④ 查找文件"],"core":true,"idxChapters":"第17章、第19章","kind":"cmd","syntax":"locate 字符串","syntaxNote":"","options":[],"optTitle":"","examples":["  locate bin/zip\n  locate zip | grep bin","  locate --regex 'bin/(bz|gz|zip)'"],"tip":"数据库不持续更新，新文件查不到；切换超级用户手动运行 `updatedb` 可解决。","tips":["数据库不持续更新，新文件查不到；切换超级用户手动运行 `updatedb` 可解决。","借助多选结构，可一次搜索包含 bin/bz、bin/gz 或 bin/zip 的路径名。"],"relTips":[],"demo":[["cmd","locate bin/zip"],["out","/usr/bin/zip\n/usr/bin/zipgrep\n/usr/bin/zipinfo\n/usr/bin/zipnote\n/usr/bin/zipcloak"],["cmd","locate --regex 'bin/zip$'"],["out","/usr/bin/zip"],["cmd","locate zip | grep bin"],["cmt","# 结果来自数据库，可能过时；刚建的文件要先 updatedb"]],"multi":true},{"id":136,"key":"stat","cmd":"stat","plain":"stat","desc":"显示文件或文件系统状态（ls 的增强版）","descShort":"显示文件或文件系统状态（ls 的增强版）","detail":"显示文件的所有信息及其属性。","chapter":"第17章","cno":17,"chapterTitle":"查找文件","chapters":["第17章"],"part":"三·常见任务与工具","partNo":3,"cats":["④ 查找文件"],"core":true,"idxChapters":"第17章","kind":"cmd","syntax":"stat 文件","syntaxNote":"","options":[],"optTitle":"","examples":["  stat playground/timestamp"],"tip":"用 `touch` 后再 `stat`，会发现文件的时间更新了。\n\n**本章重要表格**：\n\n原文表 17-1 find 命令支持的常见文件类型：\n\n| 文件类型 | 描述     |\n| ---- | ------ |\n| `b`  | 块设备文件  |\n| `c`  | 字符设备文件 |\n| `d`  | 目录     |\n| `f`  | 普通文件   |\n| `l`  | 符号链接   |\n\n原文表 17-2 用于指定计量单位的字符：\n\n| 字符  | 单位                       |\n| --- | ------------------------ |\n| `b` | 512B 块。这是默认单位（如果未指定单位的话） |\n| `c` | B                        |\n| `w` | 字（2B）                    |\n| `k` | KB（Kilobyte，1024B）       |\n| `M` | MB（Megabyte，1048576B）    |\n| `G` | GB（Gigabyte，1073741824B） |\n\n原文表 17-3 常见测试条件：\n\n| 测试条件             | 描述                                                                               |\n| ---------------- | -------------------------------------------------------------------------------- |\n| `-cmin n`        | 匹配 n 分钟前内容或属性发生变化的文件或目录。不足 n 分钟用 `-n`；超过 n 分钟用 `+n`                              |\n| `-cnewer file`   | 匹配内容或属性发生变化的时间比 file 更晚的文件或目录                                                    |\n| `-ctime n`       | 匹配内容或属性在 n×24 小时之前发生变化的文件或目录                                                     |\n| `-empty`         | 匹配空文件或目录                                                                         |\n| `-group name`    | 匹配属于组 name 的文件或目录。name 可用组名或数值形式的组 ID                                            |\n| `-iname pattern` | 类似于 `-name`，但忽略大小写                                                               |\n| `-inum n`        | 匹配 i 节点号为 n 的文件。有助于找出特定 i 节点的所有硬链接                                               |\n| `-mmin n`        | 匹配内容在 n 分钟之前发生变化的文件或目录                                                           |\n| `-mtime n`       | 匹配内容在 n×24 小时之前发生变化的文件或目录                                                        |\n| `-name pattern`  | 匹配符合指定通配符模式 pattern 的文件或目录                                                       |\n| `-newer file`    | 匹配内容发生变化的时间比 file 更晚的文件或目录。编写执行文件备份的 Shell 脚本时很有帮助：每次备份时更新时间戳文件，再确定自上次更新后有哪些文件变化 |\n| `-nouser`        | 匹配不属于合法用户的文件或目录。可用于查找属于已删除用户的文件或检测攻击者活动                                          |\n| `-nogroup`       | 匹配不属于合法组的文件或目录                                                                   |\n| `-perm mode`     | 匹配指定权限 mode 的文件或目录。mode 可用八进制或符号表示法                                              |\n| `-samefile name` | 类似于 `-inum`。匹配 i 节点号与文件 name 相同的文件                                               |\n| `-size n`        | 匹配大小为 n 的文件                                                                      |\n| `-type c`        | 匹配类型为 c 的文件                                                                      |\n| `-user name`     | 匹配属于用户 name 的文件或目录。name 可用用户名或数值形式的用户 ID                                         |\n\n\u003e 原文说明：表 17-3 并不是完整列表，完整列表详见 `find` 命令的手册页。\n\n原文表 17-4 find 命令的操作符：\n\n| 操作符    | 描述                                                                                                                                     |\n| ------ | -------------------------------------------------------------------------------------------------------------------------------------- |\n| `-and` | 两侧测试结果均为真才匹配。可简写为 `-a`。注意：如果没有在命令行中写明操作符，则默认假定为 `-and`                                                                                 |\n| `-or`  | 任意一侧测试结果为真则匹配。可简写为 `-o`                                                                                                                |\n| `-not` | 操作符后的测试结果为假则匹配。可简写为 `!`                                                                                                                |\n| `()`   | 对测试条件和操作符分组，形成更大的表达式。可用于控制逻辑求值优先级。默认情况下 find 的求值顺序是从左到右，为获得想要的结果需要覆盖默认顺序；分组也有助于增强命令可读性。因为括号对 Shell 有特殊含义，在命令行中使用时必须用引号标注，常见做法是用反斜线转义括号 |\n\n原文表 17-5 工作方式（操作符短路）：\n\n| expr1 的结果 | 操作符    | expr2 |\n| --------- | ------ | ----- |\n| 真         | `-and` | 总是被求值 |\n| 假         | `-and` | 不会被求值 |\n| 真         | `-or`  | 不会被求值 |\n| 假         | `-or`  | 总是被求值 |\n\n原文表 17-6 find 命令的预定义操作：\n\n| 操作        | 描述                                        |\n| --------- | ----------------------------------------- |\n| `-delete` | 删除当前匹配的文件                                 |\n| `-ls`     | 对匹配的文件执行相当于 `ls -dils` 命令的操作。输出结果被发送至标准输出 |\n| `-print`  | 将匹配文件的完整路径名输出至标准输出。这是默认操作（如果没有指定其他操作的话）   |\n| `-quit`   | 一旦发现匹配就退出                                 |\n\n\u003e 原文说明：和测试条件一样，预定义操作还有很多，详见 `find` 命令的手册页。\n\n原文表 17-7 操作符如何影响命令执行（针对 `find ~ -type f -and -name '*.bak' -and -print`）：\n\n| 测试条件/操作         | 何时执行                            |\n| --------------- | ------------------------------- |\n| `-print`        | `-type f` 和 `-name '*.bak'` 均为真 |\n| `-name '*.bak'` | `-type f` 为真                    |\n| `-type f`       | 总是执行，因为它是 `-and` 逻辑关系中的第一部分     |\n\n原文表 17-8 常用的 find 命令选项：\n\n| 选项                 | 描述                                                                         |\n| ------------------ | -------------------------------------------------------------------------- |\n| `-depth`           | 要求 find 在处理目录本身之前先处理该目录中的文件。如果指定了 `-delete` 操作，则自动应用此选项                    |\n| `-maxdepth levels` | 设置 find 在执行测试和操作时，向下深入的最大目录层级数                                             |\n| `-mindepth levels` | 设置 find 在执行测试和操作之前，向下深入的最小目录层级数                                            |\n| `-mount`           | 要求 find 不遍历挂载在其他文件系统上的目录                                                   |\n| `-noleaf`          | 要求 find 不根据其查找类 UNIX 文件系统的假设来优化查找。在扫描 DOS/Windows 文件系统和 CD-ROM 的时候，需要使用该选项 |\n\n**用户自定义操作（原文正文，未列表格）**：\n\n- 传统实现方式是 `-exec`：用法为 `-exec command {} ;`，其中 `command` 是命令名，`{}` 是代表当前路径名的符号，`;` 作为分隔符表示命令结束。因为 `{}` 和 `;` 对 Shell 有特殊含义，必须标注或转义（原文示例 `-exec rm '{}' ';'`）。\n- 交互式执行用 `-ok` 代替 `-exec`，在执行指定命令之前都会提示用户（原文示例 `find ~ -type f -name 'foo*' -ok ls -l '{}' ';'`，提示形如 `\u003c ls ... /home/me/bin/foo \u003e ?`，输入 `y` 才执行）。\n- 把结尾分号改成加号即可让 find 将结果组合成参数列表一次性交给命令（原文示例 `find ~ -type f -name 'foo*' -exec ls -l '{}' +`，结果不变但只执行一次 `ls`）。\n\n**本章要点速记**：\n\n- `locate` 快但基于数据库、可能过时；`updatedb` 更新该数据库，新文件查不到时就手动跑一次。\n- `find` 靠\"选项 + 测试条件 + 操作\"组合，不排序结果。\n- 数值条件用 `+n`（大于）、`-n`（小于）、无符号（等于）。\n- 默认操作符是 `-and`；括号必须转义为 `\\(` `\\)`。\n- `-print` 是默认操作，删文件前先把它当\"预演\"替代 `-delete`（原文警告）。\n- 想只执行一次命令：把 `-exec` 的 `;` 换成 `+`，或用 `xargs`；文件名含空格时用 `-print0` + `xargs --null`。\n\n---\n\n---","tips":["用 `touch` 后再 `stat`，会发现文件的时间更新了。\n\n**本章重要表格**：\n\n原文表 17-1 find 命令支持的常见文件类型：\n\n| 文件类型 | 描述     |\n| ---- | ------ |\n| ` ,"desc":"解压缩 gzip 压缩的文件","descShort":"解压缩 gzip 压缩的文件","detail":"`gzip` 对应的解压程序。它假定文件扩展名为 `.gz`，所以没有必要明确写出扩展名，只要指定的文件名不会与现有的非压缩文件冲突即可。","chapter":"第18章","cno":18,"chapterTitle":"归档与备份","chapters":["第18章"],"part":"三·常见任务与工具","partNo":3,"cats":["⑯ 压缩、归档与备份"],"core":true,"idxChapters":"第18章","kind":"cmd","syntax":"gunzip [选项] 文件","syntaxNote":"","options":[{"flag":"-c","desc":"把结果写到标准输出（原文示例 `gunzip -c foo.txt | less`）。"}],"optTitle":"","examples":["  gunzip foo.txt\n  gunzip -c foo.txt | less"],"tip":"","tips":[],"relTips":[],"demo":[["cmd","gunzip notes.txt.gz"],["cmd","ls -l notes*"],["out","-rw-r--r-- 1 me me 480000 Feb  2 16:45 notes.txt"],["cmt","# 等于 gzip -d"]],"multi":false},{"id":143,"key":"rsync","cmd":"rsync","plain":"rsync","desc":"远程文件和目录同步","descShort":"远程文件和目录同步","detail":"同步本地目录和远程目录，快速检测差异并执行最少的复制操作。","chapter":"第18章","cno":18,"chapterTitle":"归档与备份","chapters":["第18章"],"part":"三·常见任务与工具","partNo":3,"cats":["⑯ 压缩、归档与备份"],"core":true,"idxChapters":"第18章","kind":"cmd","syntax":"rsync options source destination","syntaxNote":"","options":[{"flag":"-a","desc":"归档模式，执行递归操作并保留文件属性。"},{"flag":"-v","desc":"详细输出。"},{"flag":"--delete","desc":"删除存在于备份设备、但源设备中已经不存在的文件（首次备份时并不重要，后续复制中会发挥作用）。"},{"flag":"--rsh=ssh","desc":"指示 rsync 使用 ssh 程序作为其远程 Shell，从而用加密隧道安全传输数据。"}],"optTitle":"","examples":["  rsync -av playground foo\n  rsync source destination\n  rsync source/ destination\n  sudo rsync -av --delete /etc /home /usr/local /media/BigDisk/backup\n  sudo rsync -av --delete --rsh=ssh /etc /home /usr/local remote-sys:/backup\n  rsync -av –delete rsync://archive.linux.duke.edu/fedora/linux/development/rawhide/Everything/x86_64/os/ fedora-devel"],"tip":"① 源目录名后加 `/` 只会复制目录**内容**而非目录本身（相当于 `source/*`，但会包括隐藏文件）。② 远程复制有两种方法——用 rsync + 远程 Shell（如 ssh，需加 `--rsh=ssh` 并在目标路径前加主机名），或使用作为守护进程运行的 rsync 服务器（URI 含协议 `rsync://`、主机名和路径）。③ 可用别名简化备份命令（原文示例 `alias backup='sudo rsync -av --delete /etc /home /usr/local /media/BigDisk/backup'`，加入 `.bashrc`）。\n\n**本章重要表格**：\n\n原文表 18-1 常用的 gzip 选项：\n\n| 选项                               | 描述                                                                                       |\n| -------------------------------- | ---------------------------------------------------------------------------------------- |\n| `-c, --stdout, --to-stdout`      | 将输出结果写入标准输出，保留原文件                                                                        |\n| `-d, --decompress, --uncompress` | 解压缩。利用它可以把 gzip 当作 gunzip 使用                                                             |\n| `-f, --force`                    | 强制压缩，哪怕原文件的压缩文件已经存在                                                                      |\n| `-h, --help`                     | 显示用法信息                                                                                   |\n| `-l, --list`                     | 列出压缩文件的压缩统计信息                                                                            |\n| `-r, --recursive`                | 如果命令行参数是目录，则递归压缩目录中的文件                                                                   |\n| `-t, --test`                     | 测试压缩文件的完整性                                                                               |\n| `-v, --verbose`                  | 在压缩时显示详细信息                                                                               |\n| `-number`                        | 设置压缩级别。number 是 1（速度最快、压缩级别最低）～9（最慢、压缩级别最高）的整数。1 和 9 也可分别用 `--fast` 和 `--best` 表示。默认值是 6 |\n\n原文表 18-2 tar 模式（只包含部分模式，完整模式参见 tar 的手册页）：\n\n| 模式  | 描述               |\n| --- | ---------------- |\n| `c` | 根据指定的一组文件或目录创建归档 |\n| `x` | 提取归档内容           |\n| `r` | 将指定的路径名追加到归档末尾   |\n| `t` | 列出归档内容           |\n\nrsync 选项（原文本章**未提供表格**，以下由正文整理）：\n\n| 选项          | 描述                            |\n| ----------- | ----------------------------- |\n| `-a`        | 归档模式，执行递归操作并保留文件属性            |\n| `-v`        | 详细输出                          |\n| `--delete`  | 删除存在于备份设备、但源设备中已经不存在的文件       |\n| `--rsh=ssh` | 使用 ssh 程序作为远程 Shell，用加密隧道传输数据 |\n\n\u003e 文中用户提到的 rsync 选项 `-r -l -p -t -g -o -D` 等：原文**未逐项展开**（原文只说明了 `-a` 是归档模式、执行递归并保留文件属性，以及 `-v`、`--delete`、`--rsh=ssh`；`--dry-run` 原文**未提及**）。\n\n**本章要点速记**：\n\n- 压缩 = 删冗余省空间；归档 = 把多个文件打包成一个大文件；两者是不同的事。\n- 压缩算法分无损（保留全部数据）和有损（JPEG/MP3），本书只讲无损。\n- `gzip`/`bzip2` 压缩单文件并**替换原文件**；`gunzip`/`bunzip2` 解压；`zcat`/`bzcat` 直接查看；`bzip2` 牺牲速度换更高压缩率。\n- `tar` 的模式：`c` 创建、`x` 提取、`r` 追加、`t` 列出；`f` 指定归档名，`v` 详细，`z` 用 gzip、`j` 用 bzip2；常用组合 `cf`、`xf`、`tf`、`czf`、`cjf`；模式必须先于其他选项。\n- `tar` 用相对路径、去掉开头的 `/`，提取位置相对当前目录；提取后属主可能改变。\n- `zip` 与 `unzip` 主要用于与 Windows 交换文件；`zip` 对已存在归档是**更新**而非替换，`unzip` 不接受标准输入。\n- `rsync` 用远程更新协议只复制差异，`-a` 归档、`-v` 详细、`--delete` 删多余文件、`--rsh=ssh` 走加密隧道；源目录结尾加 `/` 只同步内容；不支持远程对远程复制。\n\n---","tips":["① 源目录名后加 `/` 只会复制目录**内容**而非目录本身（相当于 `source/*`，但会包括隐藏文件）。② 远程复制有两种方法——用 rsync + 远程 Shell（如 ssh，需加 `--rsh=ssh` 并在目标路径前加主机名），或使用作为守护进程运行的 rsync 服务器（URI 含协议 `rsync://`、主机名和路径）。③ 可用别名简化备份命令（原文示例 `alias backup='sudo rsync -av --delete /etc /home /usr/local /media/BigDisk/backup'`，加入 `.bashrc`）。\n\n**本章重要表格**：\n\n原文表 18-1 常用的 gzip 选项：\n\n| 选项                               | 描述                                                                                       |\n| -------------------------------- | ---------------------------------------------------------------------------------------- |\n| `-c, --stdout, --to-stdout`      | 将输出结果写入标准输出，保留原文件                                                                        |\n| `-d, --decompress, --uncompress` | 解压缩。利用它可以把 gzip 当作 gunzip 使用                                                             |\n| `-f, --force`                    | 强制压缩，哪怕原文件的压缩文件已经存在                                                                      |\n| `-h, --help`                     | 显示用法信息                                                                                   |\n| `-l, --list`                     | 列出压缩文件的压缩统计信息                                                                            |\n| `-r, --recursive`                | 如果命令行参数是目录，则递归压缩目录中的文件                                                                   |\n| `-t, --test`                     | 测试压缩文件的完整性                                                                               |\n| `-v, --verbose`                  | 在压缩时显示详细信息                                                                               |\n| `-number`                        | 设置压缩级别。number 是 1（速度最快、压缩级别最低）～9（最慢、压缩级别最高）的整数。1 和 9 也可分别用 `--fast` 和 `--best` 表示。默认值是 6 |\n\n原文表 18-2 tar 模式（只包含部分模式，完整模式参见 tar 的手册页）：\n\n| 模式  | 描述               |\n| --- | ---------------- |\n| `c` | 根据指定的一组文件或目录创建归档 |\n| `x` | 提取归档内容           |\n| `r` | 将指定的路径名追加到归档末尾   |\n| `t` | 列出归档内容           |\n\nrsync 选项（原文本章**未提供表格**，以下由正文整理）：\n\n| 选项          | 描述                            |\n| ----------- | ----------------------------- |\n| `-a`        | 归档模式，执行递归操作并保留文件属性            |\n| `-v`        | 详细输出                          |\n| `--delete`  | 删除存在于备份设备、但源设备中已经不存在的文件       |\n| `--rsh=ssh` | 使用 ssh 程序作为远程 Shell，用加密隧道传输数据 |\n\n\u003e 文中用户提到的 rsync 选项 `-r -l -p -t -g -o -D` 等：原文**未逐项展开**（原文只说明了 `-a` 是归档模式、执行递归并保留文件属性，以及 `-v`、`--delete`、`--rsh=ssh`；`--dry-run` 原文**未提及**）。\n\n**本章要点速记**：\n\n- 压缩 = 删冗余省空间；归档 = 把多个文件打包成一个大文件；两者是不同的事。\n- 压缩算法分无损（保留全部数据）和有损（JPEG/MP3），本书只讲无损。\n- `gzip`/`bzip2` 压缩单文件并**替换原文件**；`gunzip`/`bunzip2` 解压；`zcat`/`bzcat` 直接查看；`bzip2` 牺牲速度换更高压缩率。\n- `tar` 的模式：`c` 创建、`x` 提取、`r` 追加、`t` 列出；`f` 指定归档名，`v` 详细，`z` 用 gzip、`j` 用 bzip2；常用组合 `cf`、`xf`、`tf`、`czf`、`cjf`；模式必须先于其他选项。\n- `tar` 用相对路径、去掉开头的 `/`，提取位置相对当前目录；提取后属主可能改变。\n- `zip` 与 `unzip` 主要用于与 Windows 交换文件；`zip` 对已存在归档是**更新**而非替换，`unzip` 不接受标准输入。\n- `rsync` 用远程更新协议只复制差异，`-a` 归档、`-v` 详细、`--delete` 删多余文件、`--rsh=ssh` 走加密隧道；源目录结尾加 `/` 只同步内容；不支持远程对远程复制。\n\n---"],"relTips":[],"demo":[["cmd","rsync -av ~/Documents/ remote-sys:/backup/Documents/"],["out","sending incremental file list\n./\nnotes.txt\nreport.pdf\n\nsent 4,218,331 bytes  received 92 bytes  1,687,369.20 bytes/sec"],["cmt","# -a 保留权限时间等属性 -v 显示过程；注意源路径结尾的 / 会影响结果"],["cmd","rsync -av --delete ~/Documents/ /mnt/backup/"],["cmt","# --delete 让目标端删掉源端已删除的文件，做镜像"],["cmd","rsync -av --exclude '*.tmp' src/ dst/"]],"multi":false},{"id":144,"key":"tar","cmd":"tar","plain":"tar","desc":"磁带归档实用工具","descShort":"磁带归档实用工具","detail":"创建、列出、提取、追加归档；归档可由多个独立文件、一个或多个目录层次或两者组成。","chapter":"第18章","cno":18,"chapterTitle":"归档与备份","chapters":["第18章","第23章"],"part":"三·常见任务与工具","partNo":3,"cats":["⑯ 压缩、归档与备份"],"core":true,"idxChapters":"第18章、第23章","kind":"cmd","syntax":"`tar mode[options] pathname...`（模式和 f 选项可合并书写，前面也不需要添加连字符；**模式必须先于其他选项出现**）","syntaxNote":"","options":[{"flag":"c","desc":"根据指定的一组文件或目录创建归档。"},{"flag":"x","desc":"提取归档内容。"},{"flag":"r","desc":"将指定的路径名追加到归档末尾。"},{"flag":"t","desc":"列出归档内容。"},{"flag":"f","desc":"指定 tar 归档名称的文件。"},{"flag":"v","desc":"输出更详细的清单。"},{"flag":"z","desc":"直接支持 gzip 压缩（现代 GNU tar）。"},{"flag":"j","desc":"直接支持 bzip2 压缩（现代 GNU tar）。"},{"flag":"--files-from","desc":"使 tar 从文件中而不是从命令行中读取文件列表。"},{"flag":"--wildcards","desc":"GNU 版本的 tar 通过该选项加入对通配符的支持（指定路径名时一般不支持通配符）。"}],"optTitle":"","examples":["  tar cf playground.tar playground\n  tar tf playground.tar\n  tar tvf playground.tar\n  tar xf ../playground.tar\n  tar cf playground2.tar ~/playground\n  tar xf archive.tar pathname\n  tar xf ../playground2.tar --wildcards 'home/me/playground/dir-*/file-A'\n  find playground -name 'file-A' -exec tar rf playground.tar '{}' '+'\n  find playground -name 'file-A' | tar cf - --files-from=- | gzip \u003e playground.tgz\n  find playground -name 'file-A' | tar czf playground.tgz -T -\n  find playground -name 'file-A' | tar cjf playground.tbz -T -\n  ssh remote-sys 'tar cf - Documents' | tar xf -","  [me@linuxbox src]$ tar xzf diction-1.11.tar.gz\n  [me@linuxbox src]$ ls\n  diction-1.11        diction-1.11.tar.gz\n\n  # 解压前先检查源代码树的布局结构\n  tar tzvf tarfile | head"],"tip":"① 提取后属主可能变成执行提取的用户（除非用超级用户）。② 默认使用相对路径、去掉最前面的正斜线，提取时相对于当前工作目录，因此要恢复原位需先切换到 `/` 目录。③ 提取单个文件时结尾加 `pathname`，路径名必须和归档中保存的**相对路径名一模一样**，多个路径名也可。④ 把 `-` 指定为文件名时，按其位置代表标准输入或标准输出（这一惯例也被其他许多程序采用）。⑤ 经过 gzip 压缩的 tar 归档惯例用 `.tgz`，有时也用 `.tar.gz`；bzip2 压缩的归档用 `.tbz`。","tips":["① 提取后属主可能变成执行提取的用户（除非用超级用户）。② 默认使用相对路径、去掉最前面的正斜线，提取时相对于当前工作目录，因此要恢复原位需先切换到 `/` 目录。③ 提取单个文件时结尾加 `pathname`，路径名必须和归档中保存的**相对路径名一模一样**，多个路径名也可。④ 把 `-` 指定为文件名时，按其位置代表标准输入或标准输出（这一惯例也被其他许多程序采用）。⑤ 经过 gzip 压缩的 tar 归档惯例用 `.tgz`，有时也用 `.tar.gz`；bzip2 压缩的归档用 `.tbz`。","原文提到一条源代码压缩标准——解压 `.tar` 文件时会创建一个包含源代码树的目录，命名形式为 `project-x.xx`（项目名称加版本号），这便于安装同一程序的不同版本。**但在解压之前最好先检查源代码树的布局结构**：有些项目不会创建目录，而是把所有文件直接放进当前工作目录，这会把井然有序的 `src` 目录弄得一团糟，因此建议先用 `tar tzvf tarfile | head` 检查。"],"relTips":[],"demo":[["cmd","tar cf playground.tar playground"],["cmd","ls -l playground.tar"],["out","-rw-r--r-- 1 me me 1 024 000 Feb  2 16:50 playground.tar"],["cmt","# c=创建 f=指定文件名"],["cmd","tar tf playground.tar"],["out","playground/\nplayground/dir1/\nplayground/dir1/fun"],["cmt","# t 只列出内容，不真正解包"],["cmd","tar xf playground.tar"],["cmt","# x=解包"],["cmd","tar czf backup.tgz ~/Documents"],["cmd","tar cjf backup.tbz ~/Documents"],["cmt","# z=gzip j=bzip2，一步打包+压缩"],["cmd","tar xzf backup.tgz -C /tmp/"],["cmt","# -C 指定解到哪个目录"],["cmd","tar czf - ~/Documents | ssh remote-sys 'tar xzf - -C ~/'"],["cmt","# 经典骚操作：跨机器直接传输整棵目录树"]],"multi":true},{"id":145,"key":"unzip","cmd":"unzip","plain":"unzip","desc":"提取 .zip 文件内容","descShort":"提取 .zip 文件内容","detail":"提取 zip 归档内容；也可只列出而不提取。","chapter":"第18章","cno":18,"chapterTitle":"归档与备份","chapters":["第18章"],"part":"三·常见任务与工具","partNo":3,"cats":["⑯ 压缩、归档与备份"],"core":true,"idxChapters":"第18章","kind":"cmd","syntax":"unzip [选项] 归档 [文件...]","syntaxNote":"","options":[{"flag":"-l","desc":"只列出归档内容，但不从中提取文件。若没有指定任何文件，unzip 会列出归档中的所有文件。"},{"flag":"-v","desc":"显示更详细的信息。"},{"flag":"-p","desc":"将输出结果发送到标准输出。"}],"optTitle":"","examples":["  unzip ../playground.zip\n  unzip -l playground.zip playground/dir-087/file-Z\n  unzip ../playground.zip playground/dir-087/file-Z\n  unzip -p ls-etc.zip | less"],"tip":"如果提取的文件与现有文件冲突，unzip 会提示用户是否替换（`replace ...? [y]es, [n]o, [A]ll, [N]one, [r]ename:`）。**unzip 不接受标准输入**，这就使 zip 和 unzip 不能像 tar 那样配合进行网络文件复制。","tips":["如果提取的文件与现有文件冲突，unzip 会提示用户是否替换（`replace ...? [y]es, [n]o, [A]ll, [N]one, [r]ename:`）。**unzip 不接受标准输入**，这就使 zip 和 unzip 不能像 tar 那样配合进行网络文件复制。"],"relTips":[],"demo":[["cmd","unzip playground.zip"],["out","Archive:  playground.zip\n   creating: playground/\n   creating: playground/dir1/\n  inflating: playground/dir1/fun"],["cmd","unzip -l playground.zip"],["cmt","# -l 只看清单"]],"multi":false},{"id":146,"key":"zcat","cmd":"zcat","plain":"zcat","desc":"查看 gzip 压缩文件的内容","descShort":"查看 gzip 压缩文件的内容","detail":"功能等同于带有 `-c` 选项的 `gunzip`，可以像 `cat` 命令那样查看经过 gzip 压缩过的文件内容。","chapter":"第18章","cno":18,"chapterTitle":"归档与备份","chapters":["第18章"],"part":"三·常见任务与工具","partNo":3,"cats":["③ 查看文件内容"],"core":true,"idxChapters":"第18章","kind":"cmd","syntax":"zcat 文件.gz","syntaxNote":"","options":[],"optTitle":"","examples":["  zcat foo.txt.gz | less"],"tip":"原文窍门——还有一个 `zless` 程序，其功能等同于上面的管道操作符。","tips":["原文窍门——还有一个 `zless` 程序，其功能等同于上面的管道操作符。"],"relTips":[],"demo":[["cmd","zcat README.gz | head -5"],["out","这是被 gzip 压缩过的文档内容\n解压后直接在屏幕上显示，不落盘"],["cmd","zcat file.gz"]],"multi":false},{"id":147,"key":"zip","cmd":"zip","plain":"zip","desc":"压缩并归档","descShort":"压缩并归档","detail":"既能压缩也能归档，读写 Windows 用户很熟悉的 `.zip` 文件格式。","chapter":"第18章","cno":18,"chapterTitle":"归档与备份","chapters":["第18章"],"part":"三·常见任务与工具","partNo":3,"cats":["⑯ 压缩、归档与备份"],"core":true,"idxChapters":"第18章","kind":"cmd","syntax":"zip options zipfile file...","syntaxNote":"","options":[{"flag":"-r","desc":"递归操作；不加它只会保留目录（但不包含其内容）。"},{"flag":"-@","desc":"将文件名列表通过管道传给 zip。"}],"optTitle":"","examples":["  zip -r playground.zip playground\n  find playground -name \"file-A\" | zip -@ file-A.zip\n  ls -l /etc/ | zip ls-etc.zip -"],"tip":"zip 会自动添加扩展名 `.zip`，但为了清晰最好明确写出。创建时它会显示一系列消息（`adding: ... (stored 0%)`），行尾数值表示压缩率；zip 用两种方式加入文件——只存储不压缩、或压缩存储。**与 tar 相反**，若指定的归档已存在，zip 会**更新**而不是替换它。命令结尾的 `-` 被解释为\"使用标准输入作为输入文件\"。原文指出 zip/unzip 的主要用途是与 Windows 交换文件，Linux 中的首选还是 tar + gzip。","tips":["zip 会自动添加扩展名 `.zip`，但为了清 "第19章"],"part":"三·常见任务与工具","partNo":3,"cats":["㉓ 其他卡片（书中项目脚本与专题）"],"core":false,"idxChapters":"","kind":"cmd","syntax":"","syntaxNote":"","options":[],"optTitle":"","examples":["  echo $LANG                 # 查看当前语言环境，如 en_US.UTF-8\n  locale                     # 查看完整的语言环境变量列表\n  export LANG=POSIX          # 让系统采用传统的 ASCII 排序规则"],"tip":"把 `export LANG=POSIX` 写进 `.bashrc` 可以永久生效；但原文明确提醒，这样做会让系统使用美式英语（更准确说是 ASCII）作为字符集，**应三思而后行**。\n\n**本章重要表格**：\n\n（1）正则表达式元字符汇总（依据原文第 29 行列出的元字符及正文说明整理）：\n\n| 元字符           | 含义                                  | 属于      |     |\n| ------------- | ----------------------------------- | ------- | --- |\n| `.`           | 匹配任意一个字符（点号不能匹配换行符）                 | BRE     |     |\n| `^`           | 锚点：行首                               | BRE     |     |\n| `$`           | 锚点：行尾                               | BRE     |     |\n| `[ ]`         | 方括号表达式，匹配集合中的一个字符；集合内元字符失去特殊含义      | BRE     |     |\n| `[^ ]`        | 排除型集合，`^` 必须是首个字符才表示\"非\"             | BRE     |     |\n| `[[:class:]]` | POSIX 字符类                           | BRE     |     |\n| `-`           | 字符范围连接符（如 `A-Z`）；作为集合中第一个字符时表示普通连字符 | BRE     |     |\n| `*`           | 匹配之前的元素 0 次或多次                      | BRE     |     |\n| `?`           | 匹配之前的元素 0 次或 1 次                    | ERE     |     |\n| `+`           | 匹配之前的元素 1 次或多次                      | ERE     |     |\n| `{ }`         | 匹配之前的元素指定次数（见匹配次数表）                 | ERE     |     |\n| `( )`         | 分组/分隔，常用于组合多选结构或其他元素                | ERE     |     |\n| \\`\\\\          | \\`                                  | 多选结构（或） | ERE |\n| `\\`           | 创建元序列，或转义元字符使其成为普通字符                | 通用      |     |\n\n（2）表 19-2 POSIX 字符类：\n\n| 字符类          | 描述                                                    |         |\n| ------------ | ----------------------------------------------------- | ------- |\n| `[:alnum:]`  | 字母和数字（alphanumeric）字符。在 ASCII 中，等价于 `[A-Za-z0-9]`     |         |\n| `[:word:]`   | 和 `[:alnum:]` 一样，另外加入了下画线字符 `_`                       |         |\n| `[:alpha:]`  | 字母字符。在 ASCII 中，等价于 `[A-Za-z]`                         |         |\n| `[:blank:]`  | 包括空格符和制表符                                             |         |\n| `[:cntrl:]`  | ASCII 控制字符。包括 ASCII 编码值为 0～31 和 127 的字符               |         |\n| `[:digit:]`  | 数字 0～9                                                |         |\n| `[:graph:]`  | 可见字符。在 ASCII 中，包括编码值为 33～126 的字符                      |         |\n| `[:lower:]`  | 小写字母                                                  |         |\n| `[:punct:]`  | 标点符号字符。在 ASCII 中，等价于 `[-!\"#$%\u0026'()*+,./:;\u003c=\u003e?@[\\\\\\]_`{ | }~]\\` | |\n| `[:print:]`  | 可输出字符。包括 `[:graph:]` 中的所有字符加上空格符                      |         |\n| `[:space:]`  | 空白字符，包括空格符、制表符、回车符、换行符、垂直制表符、换页符                      |         |\n| `[:upper:]`  | 大写字母                                                  |         |\n| `[:xdigit:]` | 用于表示十六进制数值的字符。在 ASCII 中，等价于 `[0-9A-Fa-f]`             |         |\n\n（3）表 19-3 指定匹配次数：\n\n| 指定方式    | 含义                   |\n| ------- | -------------------- |\n| `{n}`   | 匹配之前的元素 n 次          |\n| `{n,m}` | 匹配之前的元素至少 n 次，最多 m 次 |\n| `{n,}`  | 匹配之前的元素至少 n 次，最多不限   |\n| `{,m}`  | 匹配之前的元素不超过 m 次       |\n\n（4）BRE 与 ERE 的元字符对比（依据原文第 280～286 行整理）：\n\n| 类别       | 识别的元字符                       | 说明                     |                           |\n| -------- | ---------------------------- | ---------------------- | ------------------------- |\n| BRE（基本型） | `^ $ . [ ] *`                | `grep` 默认使用；其余字符视为文字字符 |                           |\n| ERE（扩展型） | 在 BRE 基础上加入 \\`( ) { } ? + \\\\ | \\`                     | 可用 `grep -E` 或 `egrep` 使用 |\n\n**本章要点速记**：\n\n1. 正则表达式由**文字字符**与**元字符**组成，命令行上务必**加引号**。\n2. `grep` 默认按行匹配，只要行内含匹配串就输出整行；`find -regex` 则要求整个路径名严格匹配。\n3. 锚点 `^ $` 限定行首/行尾，`^$` 匹配空行；`.` 匹配任意一个字符。\n4. 方括号集合内的元字符失效；集合开头 `^` 表示排除，`-` 表示范围；范围的实际含义受**排序规则/locale** 影响，`[A-Z]` 在词典序下会包含小写字母。\n5. 量词 `? * + {}` 与多选结构 `|`、分组 `()` 属于 **ERE**，用 `grep -E`；BRE 需反斜线转义才把它们当元字符。\n6. POSIX 字符
