]],"multi":false},{"id":150,"key":"zgrep","cmd":"zgrep","plain":"zgrep","desc":"grep 的\"读压缩文件\"前端","descShort":"grep 的\"读压缩文件\"前端","detail":"让 `grep` 能直接读取（gzip 压缩的）文件。","chapter":"第19章","cno":19,"chapterTitle":"正则表达式","chapters":["第19章"],"part":"三·常见任务与工具","partNo":3,"cats":["⑤ 文本处理（重点）"],"core":true,"idxChapters":"第19章","kind":"cmd","syntax":"zgrep [选项] 正则 [*.gz ...]","syntaxNote":"","options":[],"optTitle":"","examples":["  cd /usr/share/man/man1\n  zgrep -El 'regex|regular expression' *.gz"],"tip":"用它在压缩手册页中查找哪些程序带正则表达式功能，可以看出正则表达式应用之广。","tips":["用它在压缩手册页中查找哪些程序带正则表达式功能，可以看出正则表达式应用之广。"],"relTips":[],"demo":[["cmd","zgrep -i error /var/log/syslog.2.gz"],["out","Feb  1 03:14:22 host kernel: [ 18.221] error: no such device"],["cmt","# 直接搜压缩文件里的内容，不用先解压"]],"multi":false},{"id":151,"key":"aspell","cmd":"aspell","plain":"aspell","desc":"交互式拼写检查器","descShort":"交互式拼写检查器","detail":"交互式拼写检查，能检查各种文本文件（HTML、C/C++ 程序、电子邮件等）。","chapter":"第20章","cno":20,"chapterTitle":"文本处理","chapters":["第20章"],"part":"三·常见任务与工具","partNo":3,"cats":["⑤ 文本处理（重点）"],"core":true,"idxChapters":"第20章","kind":"cmd","syntax":"aspell [选项] check 文件","syntaxNote":"","options":[{"flag":"-H","desc":"检查 HTML 文档：忽略 HTML 标签本身，只检查非标签部分的内容（标签属性如 ALT 的内容仍会检查）。"},{"flag":"--dont-backup","desc":"告知 aspell **不要创建备份文件**。"}],"optTitle":"","examples":["  aspell check foo.txt\n  aspell -H check foo.txt"],"tip":"检查模式下顶部高亮显示疑似拼错的单词，中间给出编号 0～9 的拼写建议和操作清单，底部是接受选择的提示符。**除非用 `--dont-backup` 事先告知，否则 aspell 会创建以原文件名加扩展名 `.bak` 的备份文件**。默认情况下，aspell 会忽略文本中的 URL 和电子邮件地址。\n\n**本章要点速记**：\n\n1. `sort` 的核心是**关键字段排序**：`-k` 可指定字段或字段范围，`1,1` 表示限定在字段 1；选项字母可放在关键字末尾（如 `2n`）；`-t` 定义分隔符，`-k 3.7` 这类偏移可切进字段内部。\n2. `uniq` 只能删**连续**重复行，必须先 `sort`；`sort -u` 也能去重。\n3. `cut` 按字段（`-f`/`-d`）或字符（`-c`）提取文本，适合规整文件；`paste` 反向把多列并排合并；`join` 依据共享关键字连接两个**已排序**文件。\n4. `comm` 输出三列（左独有 / 右独有 / 共有），`-n` 可屏蔽列；`diff` 生成补丁、`patch` 应用补丁，且**不需指定目标文件**（目标名在补丁头部）。\n5. `tr` 做字符转写/删除/挤压；DOS 转 UNIX 用 `tr -d '\\r'`；ROT13 用 `tr a-zA-Z n-za-mN-ZA-M`。\n6. `sed` 是流编辑器：`s///` 替换、`-n`+`p` 输出指定行、地址（行号/`$`/`/正则/`/`,`/`!`）、`\u0026` 与 `\\1～\\9` 反向引用、`y` 转写、`-i` 就地编辑；默认只吃 **BRE**，元字符需转义。\n\n---\n\n---","tips":["检查模式下顶部高亮显示疑似拼错的单词，中间给出编号 0～9 的拼写建议和操作清单，底部是接受选择的提示符。**除非用 `--dont-backup` 事先告知，否则 aspell 会创建以原文件名加扩展名 `.bak` 的备份文件**。默认情况下，aspell 会忽略文本中的 URL 和电子邮件地址。\n\n**本章要点速记**：\n\n1. `sort` 的核心是**关键字段排序**：`-k` 可指定字段或字段范围，`1,1` 表示限定在字段 1；选项字母可放在关键字末尾（如 `2n`）；`-t` 定义分隔符，`-k 3.7` 这类偏移可切进字段内部。\n2. `uniq` 只能删**连续**重复行，必须先 `sort`；`sort -u` 也能去重。\n3. `cut` 按字段（`-f`/`-d`）或字符（`-c`）提取文本，适合规整文件；`paste` 反向把多列并排合并；`join` 依据共享关键字连接两个**已排序**文件。\n4. `comm` 输出三列（左独有 / 右独有 / 共有），`-n` 可屏蔽列；`diff` 生成补丁、`patch` 应用补丁，且**不需指定目标文件**（目标名在补丁头部）。\n5. `tr` 做字符转写/删除/挤压；DOS 转 UNIX 用 `tr -d '\\r'`；ROT13 用 `tr a-zA-Z n-za-mN-ZA-M`。\n6. `sed` 是流编辑器：`s///` 替换、`-n`+`p` 输出指定行、地址（行号/`$`/`/正则/`/`,`/`!`）、`\u0026` 与 `\\1～\\9` 反向引用、`y` 转写、`-i` 就地编辑；默认只吃 **BRE**，元字符需转义。\n\n---\n\n---"],"relTips":[],"demo":[["cmd","aspell check letter.txt"],["cmt","# 交互式拼写检查，逐词给出候选拼写"],["out","1) linux   2) Linux   3) lynx\n? "],["cmd","aspell list \u003c letter.txt"],["out","recieve\nseperate"]],"multi":false},{"id":152,"key":"comm","cmd":"comm","plain":"comm","desc":"逐行比较两个已排序的文件","descShort":"逐行比较两个已排序的文件","detail":"比较两个文本文件，显示各自独有的行和共有的行。","chapter":"第20章","cno":20,"chapterTitle":"文本处理","chapters":["第20章"],"part":"三·常见任务与工具","partNo":3,"cats":["⑤ 文本处理（重点）"],"core":true,"idxChapters":"第20章","kind":"cmd","syntax":"comm [选项] 文件1 文件2","syntaxNote":"","options":[],"optTitle":"","examples":["  comm file1.txt file2.txt\n  # 只显示两个文件共有的行（禁止第 1、2 列）\n  comm -12 file1.txt file2.txt"],"tip":"`comm` 输出 3 列——第 1 列是第一个文件独有的行，第 2 列是第二个文件独有的行，第 3 列是两文件共有的行。","tips":["`comm` 输出 3 列——第 1 列是第一个文件独有的行，第 2 列是第二个文件独有的行，第 3 列是两文件共有的行。"],"relTips":[],"demo":[["cmd","comm f1 f2"],["out","\t\ta\na\t\tb\n\tb\tc\na\tb\td"],["cmt","# 第 1 列只在 f1、第 2 列只在 f2、第 3 列两边都有"],["cmd","comm -12 f1 f2"],["out","a\nb"],["cmt","# -12 隐藏前两列 = 只看共有行"]],"multi":false},{"id":153,"key":"cut","cmd":"cut","plain":"cut","desc":"从每行中删除部分内容","descShort":"从每行中删除部分内容","detail":"从每行提取部分文本并输出到标准输出；接受多个文件或标准输入。","chapter":"第20章","cno":20,"chapterTitle":"文本处理","chapters":["第20章"],"part":"三·常见任务与工具","partNo":3,"cats":["⑤ 文本处理（重点）"],"core":true,"idxChapters":"第20章","kind":"cmd","syntax":"cut [选项] [文件...]","syntaxNote":"","options":[{"flag":"-c list, --characters=list","desc":"提取由 `list` 定义的部分行（一个或多个逗号分隔的数值范围）。"},{"flag":"-f list, --fields=list","desc":"提取由 `list` 定义的一个或多个字段（可为逗号分隔的字段范围）。"},{"flag":"-d delim, --delimiter=delim","desc":"与 `-f` 配合，指定字段分隔符（默认为单个制表符）。"},{"flag":"--complement","desc":"提取除 `-c` 或 `-f` 指定部分之外的整行。"}],"optTitle":"","examples":["  # 先用 -A 确认文件是否以制表符分隔、是否\"干净\"\n  cat -A distros.txt\n  # 提取第 3 个字段\n  cut -f 3 distros.txt\n  # 再对日期字段提取第 7~10 个字符，得到年份\n  cut -f 3 distros.txt | cut -c 7-10\n  # 用 -d 指定冒号作分隔符，提取 /etc/passwd 第 1 字段\n  cut -d ':' -f 1 /etc/passwd | head"],"tip":"`cut` 提取文本的方式\"相当死板\"，适合处理其他程序产生的规整文件，而不适合直接处理用户输入。对制表符分隔的文件，最好用 `-f` 提取字段而不是 `-c` 提取字符——因为每行字符数通常不一致，难以计算字符位置。原文还介绍了 `expand`（把制表符换成相应数量的空格，便于用 `cut -c`）和 `unexpand`（用制表符替换空格）：","tips":["`cut` 提取文本的方式\"相当死板\"，适合处理其他程序产生的规整文件，而不适合直接处理用户输入。对制表符分隔的文件，最好用 `-f` 提取字段而不是 `-c` 提取字符——因为每行字符数通常不一致，难以计算字符位置。原文还介绍了 `expand`（把制表符换成相应数量的空格，便于用 `cut -c`）和 `unexpand`（用制表符替换空格）："],"relTips":[],"demo":[["cmd","cut -f 1,3 -d ':' /etc/passwd"],["out","root:0\ndaemon:1\nbin:2"],["cmt","# -d 定分隔符 -f 取字段"],["cmd","cut -c 1-8 /etc/passwd"],["out","root:x:0\ndaemon:x\nbin:x:2"],["cmd","ls -l | cut -c 1-10"],["out","total 28\ndrwxr-xr-x\n-rw-r--r--"],["cmt","# 只留权限那一段"]],"multi":false},{"id":154,"key":"diff","cmd":"diff","plain":"diff","desc":"逐行比较文件","descShort":"逐行比较文件","detail":"检测文件之间的差异，支持多种输出格式，可一次处理大量文本文件；常见用途是生成供 `patch` 使用的 diff 文件（补丁）。","chapter":"第20章","cno":20,"chapterTitle":"文本处理","chapters":["第20章"],"part":"三·常见任务与工具","partNo":3,"cats":["⑤ 文本处理（重点）"],"core":true,"idxChapters":"第20章","kind":"cmd","syntax":"diff [选项] 文件1 文件2","syntaxNote":"","options":[{"flag":"-c","desc":"输出**上下文格式（context format）**。"},{"flag":"-u","desc":"输出**合并格式（unified format）**，比上下文格式更精简。"}],"optTitle":"","examples":["  diff file1.txt file2.txt        # 默认格式\n  diff -c file1.txt file2.txt     # 上下文格式\n  diff -u file1.txt file2.txt     # 合并格式\n  # 生成供 patch 使用的 diff 文件\n  diff -Naur file1.txt file2.txt \u003e patchfile.txt"],"tip":"默认格式每组变动前有\"范围 操作 范围\"形式的**变动命令**（见下表 20-4），这种格式主要用于 POSIX 合规与向后兼容，不如上下文格式、合并格式常用。合并格式与上下文格式最明显的区别是**去除了重复的上下文行**。","tips":["默认格式每组变动前有\"范围 操作 范围\"形式的**变动命令**（见下表 20-4），这种格式主要用于 POSIX 合规与向后兼容，不如上下文格式、合并格式常用。合并格式与上下文格式最明显的区别是**去除了重复的上下文行**。"],"relTips":[],"demo":[["cmd","diff file1.txt file2.txt"],["out","2c2\n\u003c 第二行 A\n---\n\u003e 第二行 B\n4d3\n\u003c 多出来的一行"],["cmt","# c=改变 a=新增 d=删除  \u003c 是前一个文件  \u003e 是后一个文件"],["cmd","diff -u file1.txt file2.txt"],["out","--- file1.txt\t2026-02-02 15:00:00\n+++ file2.txt\t2026-02-02 15:05:00\n@@ -1,4 +1,3 @@\n 第一行\n-第二行 A\n+第二行 B\n 第三行"],["cmd","diff -u file1.txt file2.txt \u003e patch.diff"],["cmt","# 生成补丁文件"]],"multi":false},{"id":155,"key":"join","cmd":"join","plain":"join","desc":"连接两个文件中具有公共字段的行","descShort":"连接两个文件中具有公共字段的行","detail":"按共享关键字字段连接两个文件的数据（类似关系数据库的连接操作）。","chapter":"第20章","cno":20,"chapterTitle":"文本处理","chapters":["第20章"],"part":"三·常见任务与工具","partNo":3,"cats":["⑤ 文本处理（重点）"],"core":true,"idxChapters":"第20章","kind":"cmd","syntax":"join [文件1] [文件2]","syntaxNote":"","options":[],"optTitle":"","examples":["  # 构造两个共享关键字（发行日期）的文件\n  cut -f 1,1 distros-by-date.txt \u003e distros-names.txt\n  paste distros-dates.txt distros-names.txt \u003e distros-key-names.txt\n  cut -f 2,2 distros-by-date.txt \u003e distros-vernums.txt\n  paste distros-dates.txt distros-vernums.txt \u003e distros-key-vernums.txt\n  # 依据共享关键字（日期）做连接\n  join distros-key-names.txt distros-key-vernums.txt | head"],"tip":"**两个文件必须依据关键字字段排好序**，`join` 才能正常工作。默认 `join` 用空白字符作输入字段分隔符、单个空格作输出字段分隔符；可用选项修改（详见手册页）。","tips":["**两个文件必须依据关键字字段排好序**，`join` 才能正常工作。默认 `join` 用空白字符作输入字段分隔符、单个空格作输出字段分隔符；可用选项修改（详见手册页）。"],"relTips":[],"demo":[["cmd","cat class.txt"],["out","1 Alice\n2 Bob\n3 Carol"],["cmd","cat score.txt"],["out","1 90\n2 85\n3 100"],["cmd","join class.txt score.txt"],["out","1 Alice 90\n2 Bob 85\n3 Carol 100"],["cmt","# 两文件必须都按公共字段排好序"]],"multi":false},{"id":156,"key":"paste","cmd":"paste","plain":"paste","desc":"合并行","descShort":"合并行","detail":"把多个文件的文本列**并排合并**（与 `cut` 正好相反）；读取多个文件，把每个文件中的字段合并起来。","chapter":"第20章","cno":20,"chapterTitle":"文本处理","chapters":["第20章"],"part":"三·常见任务与工具","partNo":3,"cats":["⑤ 文本处理（重点）"],"core":true,"idxChapters":"第20章","kind":"cmd","syntax":"paste [文件...]","syntaxNote":"","options":[],"optTitle":"","examples":["  # 先把按日期排序的结果保存下来\n  sort -k 3.7nbr -k 3.1nbr -k 3.4nbr distros.txt \u003e distros-by-date.txt\n  # 提取前两个字段（发行版名 + 版本号）\n  cut -f 1,2 distros-by-date.txt \u003e distros-versions.txt\n  # 提取日期字段\n  cut -f 3 distros-by-date.txt \u003e distros-dates.txt\n  # 把日期列放到发行版列之前：按想要的排列顺序调整参数顺序即可\n  paste distros-dates.txt distros-versions.txt"],"tip":"排列顺序由 `paste` 的**参数顺序**决定。","tips":["排列顺序由 `paste` 的**参数顺序**决定。"],"relTips":[],"demo":[["cmd","cat f1"],["out","a\nb\nc"],["cmd","cat f2"],["out","1\n2\n3"],["cmd","paste f1 f2"],["out","a\t1\nb\t2\nc\t3"],["cmd","paste -d, f1 f2"],["out","a,1\nb,2\nc,3"]],"multi":false},{"id":157,"key":"patch","cmd":"patch","plain":"patch","desc":"对原文件应用 diff 文件","descShort":"对原文件应用 diff 文件","detail":"把 `diff` 的输出（补丁）应用到文本文件上，一般用于把旧版本文件转换为新版本。","chapter":"第20章","cno":20,"chapterTitle":"文本处理","chapters":["第20章"],"part":"三·常见任务与工具","partNo":3,"cats":["⑤ 文本处理（重点）"],"core":true,"idxChapters":"第20章","kind":"cmd","syntax":"patch \u003c diff_file","syntaxNote":"","options":[],"optTitle":"","examples":["  diff -Naur file1.txt file2.txt \u003e patchfile.txt\n  patch \u003c patchfile.txt\n  # patching file file1.txt\n  cat file1.txt     # 内容已与 file2.txt 一致"],"tip":"**无需指定目标文件**——采用合并格式的 diff 文件已在文件头部包含了目标文件名。原文强调 `diff`/`patch` 的两个优势：diff 文件比整个源代码树小得多；diff 文件简洁地描述了改动，便于审阅。它同样适用于配置文件或其他文本。","tips":["**无需指定目标文件**——采用合并格式的 diff 文件已在文件头部包含了目标文件名。原文强调 `diff`/`patch` 的两个优势：diff 文件比整个源代码树小得多；diff 文件简洁地描述了改动，便于审阅。它同样适用于配置文件或其他文本。"],"relTips":[],"demo":[["cmd","patch \u003c patch.diff"],["out","patching file file1.txt"],["cmd","patch -R \u003c patch.diff"],["cmt","# -R 撤销补丁，把文件变回去"]],"multi":false},{"id":158,"key":"sed","cmd":"sed","plain":"sed","desc":"用于文本过滤和转换的流编辑器","descShort":"用于文本过滤和转换的流编辑器","detail":"对文本流（指定的一组文件或标准输入）执行编辑命令；可指定单个命令行命令，或含多个命令的脚本文件，然后对文本流的每行执行。","chapter":"第20章","cno":20,"chapterTitle":"文本处理","chapters":["第20章"],"part":"三·常见任务与工具","partNo":3,"cats":["⑤ 文本处理（重点）"],"core":true,"idxChapters":"第20章","kind":"cmd","syntax":"`sed [选项] '命令' [文件...]` / `sed -f 脚本文件 [文件...]`","syntaxNote":"","options":[{"flag":"-n","desc":"no auto-print，**不默认输出所有行**（需配合 `p` 命令才有输出）。"},{"flag":"-e","desc":"在同一命令行给出多条编辑命令（原文示例使用分号分隔多条命令，如 `sed -i 's/lazy/laxy/; s/jumped/jimped/' foo.txt`）。"},{"flag":"-f 脚本文件","desc":"从脚本文件读取 sed 命令。"},{"flag":"-i","desc":"**就地（in-place）编辑**指定文件：不再把结果送到标准输出，而是直接写回文件。"}],"optTitle":"","examples":["  # 最简单的替换：s/front/back/\n  echo \"front\" | sed 's/front/back/'\n  # 分隔符可自定义：命令之后的任意字符都能当分隔符\n  echo \"front\" | sed 's_front_back_'\n  # 地址：只对第 1 行执行替换；地址 2 则因输入只有一行而不生效\n  echo \"front\" | sed '1s/front/back/'\n  echo \"front\" | sed '2s/front/back/'\n  # -n + p：只输出第 1~5 行\n  sed -n '1,5p' distros.txt\n  # 正则地址 /SUSE/\n  sed -n '/SUSE/p' distros.txt\n  # 地址加 ! 表示排除\n  sed -n '/SUSE/!p' distros.txt\n  # 把 月/日/年 改成 年-月-日（BRE 需转义 ( )、{ }、/）\n  sed 's/\\([0-9]\\{2\\}\\)\\/\\([0-9]\\{2\\}\\)\\/\\([0-9]\\{4\\}\\)$/\\3-\\1-\\2/' distros.txt\n  # g 标志：全局替换而不是只替换首个匹配\n  echo \"aaabbbccc\" | sed 's/b/B/'      # aaaBbbccc\n  echo \"aaabbbccc\" | sed 's/b/B/g'     # aaaBBBccc\n  # 用脚本文件\n  sed -f distros.sed distros.txt\n  # -i 就地编辑，一行内用分号分隔多条命令\n  sed -i 's/lazy/laxy/; s/jumped/jimped/' foo.txt"],"tip":"- sed 命令以**单字母**开头；替换命令是 `s`，其后紧跟\"查找—替换\"字符串，之间用分隔符（惯例是正斜线，但可用命令之后的任意字符）。自由选择分隔符能提高可读性（如处理含 `/` 的日期时可改用别的分隔符）。\n  - 大多数 sed 命令之前可加**地址**，指定要编辑哪些行；省略地址则对**所有行**执行。\n  - 正则表达式由正斜线分隔，也可写成 `\\cregexpc` 用其他字符 `c` 作分隔符。\n  - **sed 默认只接受 BRE**，所以本应作元字符的 `(` `)` `{` `}` 需用反斜线转义才会被当作元字符；日期里的 `/` 也要转义，否则与 `s` 命令的分隔符冲突。","tips":["- sed 命令以**单字母**开头；替换命令是 `s`，其后紧跟\"查找—替换\"字符串，之间用分隔符（惯例是正斜线，但可用命令之后的任意字符）。自由选择分隔符能提高可读性（如处理含 `/` 的日期时可改用别的分隔符）。\n  - 大多数 sed 命令之前可加**地址**，指定要编辑哪些行；省略地址则对**所有行**执行。\n  - 正则表达式由正斜线分隔，也可写成 `\\cregexpc` 用其他字符 `c` 作分隔符。\n  - **sed 默认只接受 BRE**，所以本应作元字符的 `(` `)` `{` `}` 需用反斜线转义才会被当作元字符；日期里的 `/` 也要转义，否则与 `s` 命令的分隔符冲突。"],"relTips":[],"demo":[["cmd","echo 'hello world' | sed 's/world/linux/'"],["out","hello linux"],["cmd","sed -n '1,3p' notes.txt"],["out","第一行\n第二行\n第三行"],["cmd","sed '2d' notes.txt"],["cmt","# 删掉第 2 行"],["cmd","sed -i.bak 's/foo/bar/g' config.txt"],["cmt","# 原地替换，同时留 config.txt.bak 备份"]],"multi":false},{"id":159,"key":"tr","cmd":"tr","plain":"tr","desc":"转写或删除字符","descShort":"转写或删除字符","detail":"基于字符的\"搜索—替换\"操作：转写（如小写改大写）或删除字符。","chapter":"第20章","cno":20,"chapterTitle":"文本处理","chapters":["第20章"],"part":"三·常见任务与工具","partNo":3,"cats":["⑤ 文本处理（重点）"],"core":true,"idxChapters":"第20章","kind":"cmd","syntax":"tr [选项] 集合1 [集合2]","syntaxNote":"","options":[{"flag":"-d","desc":"从输入流中**删除**指定字符。"},{"flag":"-s","desc":"\"挤压\"（删除）**重复**出现的字符。"}],"optTitle":"","examples":["  # 转写：小写改大写\n  echo \"lowercase letters\" | tr a-z A-Z\n  # 第一个集合可长于第二个，把多个字符转成单个字符\n  echo \"lowercase letters\" | tr [:lower:] A\n  # 删除回车符：把 MS-DOS 文本转为 UNIX 文本（\\r 表示回车符）\n  tr -d '\\r' \u003c dos_file \u003e unix_file\n  # 挤压连续重复字符\n  echo \"aaabbbccc\" | tr -s ab        # 结果 abccc\n  echo \"abcabcabc\" | tr -s ab        # 不连续，无效果，结果 abcabcabc\n  # 查看转义字符与字符类的完整清单\n  tr --help\n  # ROT13：把字母向前移动 13 位\n  echo \"secret text\" | tr a-zA-Z n-za-mN-ZA-M     # 结果 frperg grkg\n  echo \"frperg grkg\" | tr a-zA-Z n-za-mN-ZA-M     # 再执行一次即还原为 secret text"],"tip":"大多数情况下两个字符集合长度应相同，但**第一个集合可以更长**。`-s` 挤压时，重复字符必须是**连续的**，否则不会有挤压效果。`tr` 只对标准输入操作、结果送到标准输出。","tips":["大多数情况下两个字符集合长度应相同，但**第一个集合可以更长**。`-s` 挤压时，重复字符必须是**连续的**，否则不会有挤压效果。`tr` 只对标准输入操作、结果送到标准输出。"],"relTips":[],"demo":[["cmd","echo 'HELLO World' | tr 'A-Z' 'a-z'"],["out","hello world"],["cmd","echo 'hello' | tr -d 'l'"],["out","heo"],["cmt","# -d 删除字符"],["cmd","echo 'a  b   c' | tr -s ' '"],["out","a b c"],["cmt","# -s 压缩重复字符"]],"multi":false},{"id":160,"key":"fmt","cmd":"fmt","plain":"fmt","desc":"一个简单的文本格式化工具","descShort":"一个简单的文本格式化工具","detail":"对文本流执行**段落格式化**；在保留空行和缩进的同时对文本进行填充和连接。","chapter":"第21章","cno":21,"chapterTitle":"格式化输出","chapters":["第21章"],"part":"三·常见任务与工具","partNo":3,"cats":["⑥ 格式化输出"],"core":true,"idxChapters":"第21章","kind":"cmd","syntax":"fmt [选项] [文件...]","syntaxNote":"","options":[{"flag":"-c","desc":"冠边距（crown margin）模式：保留段落前两行的缩进、后续行对第二行的缩进。"},{"flag":"-p string","desc":"仅格式化以 `string` 开头的行，并把 `string` 作为重新格式化后各行的开头；可用于格式化源代码注释（如 `-p '# '`）。"},{"flag":"-s","desc":"纯分割（split only）模式：仅分割行以适应指定列宽，不连接短行填充。"},{"flag":"-u","desc":"均匀间隔（uniform spacing）：传统\"打字机样式\"格式，单词间一个空格、句子间两个空格，并清除对齐（去掉用空格填充的强制对齐）。"},{"flag":"-w width","desc":"格式化到 width 个字符列宽，默认 75。注意为实现行平衡，实际格式化行长会略小于指定列宽。"}],"optTitle":"","examples":["  fmt -w 50 fmt-info.txt | head\n  # 加 -c 纠正第一行缩进被保留的问题\n  fmt -cw 50 fmt-info.txt\n  # 仅格式化以 \"# \" 开头的注释行\n  fmt -w 50 -p '# ' fmt-code.txt"],"tip":"默认情况下空行、单词间空格、缩进都会保留；具有不同缩进的连续输入行**不会**被连接；制表符在输入时扩展、并在输出中出现。因此 `fmt -w 50` 会保留第一行缩进导致输出难看，加 `-c` 即可纠正。使用 `-p` 时，相邻的注释行会被连接，而空行和不以指定内容开头的行则保留。`fmt` 倾向于在**句末**断行，并尽量避免在句子首词之后或末词之前断行。","tips":["默认情况下空行、单词间空格、缩进都会保留；具有不同缩进的连续输入行**不会**被连接；制表符在输入时扩展、并在输出中出现。因此 `fmt -w 50` 会保留第一行缩进导致输出难看，加 `-c` 即可纠正。使用 `-p` 时，相邻的注释行会被连接，而空行和不以指定内容开头的行则保留。`fmt` 倾向于在**句末**断行，并尽量避免在句子首词之后或末词之前断行。"],"relTips":[],"demo":[["cmd","fmt -w 50 long.txt"],["out","这是一段很长的文字，会在第 50 个字符附近\n按单词边界重新排版成规整的多行段落。"],["cmt","# fmt 会智能地按单词换行，fold 只管硬切"]],"multi":false},{"id":161,"key":"fold","cmd":"fold","plain":"fold","desc":"在指定长度处折行","descShort":"在指定长度处折行","detail":"把文本行在指定宽度处断开。","chapter":"第21章","cno":21,"chapterTitle":"格式化输出","chapters":["第21章"],"part":"三·常见任务与工具","partNo":3,"cats":["⑥ 格式化输出"],"core":true,"idxChapters":"第21章","kind":"cmd","syntax":"fold [选项] [文件...]","syntaxNote":"","options":[{"flag":"-w 宽度","desc":"指定折行宽度（默认 80 个字符）。"},{"flag":"-s","desc":"在指定行宽之前的**最后一个可用空格**处断开（考虑单词边界）。"}],"optTitle":"","examples":["  echo \"The quick brown fox jumped over the lazy dog.\" | fold -w 12\n  echo \"The quick brown fox jumped over the lazy dog.\" | fold -w 12 -s"],"tip":"不加 `-s` 时，折行**不考虑单词边界**，会把单词从中间截断。","tips":["不加 `-s` 时，折行**不考虑单词边界**，会把单词从中间截断。"],"relTips":[],"demo":[["cmd","fold -w 40 long.txt"],["out","这是一段很长的文字，会在第 40 个\n字符处被折成新的一行，但不会按\n单词断开。"],["cmt","# -s 会尽量在空格处折行"]],"multi":false},{"id":162,"key":"groff","cmd":"groff","plain":"groff","desc":"文档格式化系统","descShort":"文档格式化系统","detail":"`groff` 是包含 `troff` 的 GNU 实现在内的一组程序，另含仿真 `nroff`/`roff` 其他功能的脚本；用于把带标记的文本渲染为多种格式的输出。","chapter":"第21章","cno":21,"chapterTitle":"格式化输出","chapters":["第21章"],"part":"三·常见任务与工具","partNo":3,"cats":["⑥ 格式化输出"],"core":true,"idxChapters":"第21章","kind":"cmd","syntax":"groff [选项] [文件...]","syntaxNote":"","options":[{"flag":"-mandoc","desc":"指定使用 `mandoc` 宏软件包（渲染手册页）。"},{"flag":"-T ascii","desc":"指定输出 ASCII 格式（否则默认输出 PostScript）。"},{"flag":"-t","desc":"让 groff 使用 `tbl` 对文本流进行**预处理**（渲染表格）。"}],"optTitle":"","examples":["  # 用管道模拟 man 命令\n  zcat /usr/share/man/man1/ls.1.gz | groff -mandoc -T ascii | head\n  # 未指定格式则默认输出 PostScript\n  zcat /usr/share/man/man1/ls.1.gz | groff -mandoc | head\n  # 保存为 PostScript 文件\n  zcat /usr/share/man/man1/ls.1.gz | groff -mandoc \u003e ~/Desktop/ls.ps\n  # PostScript 转 PDF（ps2pdf 属于 ghostscript 软件包）\n  ps2pdf ~/Desktop/ls.ps ~/Desktop/ls.pdf\n  # 用 tbl 把 distros.txt 排成表格（ASCII 输出）\n  sort -k 1,1 -k 2n distros.txt | sed -f distros-tbl.sed | groff -t -T ascii\n  # 输出为 PostScript 文件\n  sort -k 1,1 -k 2n distros.txt | sed -f distros-tbl.sed | groff -t \u003e ~/Desktop/distros.ps"],"tip":"手册页是经 gzip 压缩的文本文件，位于 `/usr/share/man` 目录，由 groff 用 `mandoc` 宏软件包渲染。原文\"窍门\"：UNIX 系统常用 `format2format` 形式命名格式转换程序，可用 `ls /usr/bin/*[[:alpha:]]2[[:alpha:]]*` 找出它们，也可搜索名为 `formattoformat` 的程序（安装 TEX 可查看 `texlive` 软件包与 LyX 编辑器）。","tips":["手册页是经 gzip 压缩的文本文件，位于 `/usr/share/man` 目录，由 groff 用 `mandoc` 宏软件包渲染。原文\"窍门\"：UNIX 系统常用 `format2format` 形式命名格式转换程序，可用 `ls /usr/bin/*[[:alpha:]]2[[:alpha:]]*` 找出它们，也可搜索名为 `formattoformat` 的程序（安装 TEX 可查看 `texlive` 软件包与 LyX 编辑器）。"],"relTips":[],"demo":[["cmd","groff -Tascii -man manpage.1"],["out","NAME\n       foo - 一个示例程序的说明\n\nSYNOPSIS\n       foo [-a] file"],["cmt","# -Tascii 输出纯文本 -Tps 输出 PostScript 交给打印机"]],"multi":false},{"id":163,"key":"nl","cmd":"nl","plain":"nl","desc":"对行进行编号","descShort":"对行进行编号","detail":"对行编号，简单用法类似 `cat -n`，但支持\"逻辑页\"等更复杂的编号能力。","chapter":"第21章","cno":21,"chapterTitle":"格式化输出","chapters":["第21章"],"part":"三·常见任务与工具","partNo":3,"cats":["③ 查看文件内容"],"core":true,"idxChapters":"第21章","kind":"cmd","syntax":"nl [选项] [文件...]","syntaxNote":"","options":[{"flag":"-b style","desc":"将**正文**编号设置为 style：`a` 编号所有行；`t` 仅编号非空行（默认）；`n` 不编号；`pregexp` 仅编号匹配 BRE `regexp` 的行。"},{"flag":"-f style","desc":"将**页脚**编号设置为 style，默认值为 `n`（无）。"},{"flag":"-h style","desc":"将**页眉**编号设置为 style，默认值为 `n`（无）。"},{"flag":"-i number","desc":"页面编号增量，默认值 1。"},{"flag":"-n format","desc":"页面编号格式：`ln` 左对齐不填充 0；`rn` 右对齐不填充 0（默认）；`rz` 右对齐并进行 0 填充。"},{"flag":"-p","desc":"不在每个逻辑页开头处重置页面编号。"},{"flag":"-s string","desc":"在每行行号之后添加 `string` 作为分隔符，默认值是单个制表符。"},{"flag":"-v number","desc":"将每个逻辑页中第一行的编号设置为 number，默认值 1。"},{"flag":"-w width","desc":"将行号字段的宽度设置为 width，默认值 6。"}],"optTitle":"","examples":["  nl distros.txt | head\n  # 尝试不同编号格式与宽度\n  nl -n rz\n  nl -w 3 -s ' '\n  # 生成\"增强版报告\"：排序 → sed 加逻辑页标记/页脚 → nl 编号\n  sort -k 1,1 -k 2n distros.txt | sed -f distros-nl.sed | nl"],"tip":"`nl` 支持**逻辑页（logical pages）**，能把编号重置，指定起始编号和编号格式；逻辑页又分为页眉、正文、页脚三部分，每部分可重置行号或设置不同样式。若指定多个文件参数，`nl` 会把它们视为**单个文本流**。默认情况下，`nl` 只对属于逻辑页**正文**部分的文本流进行行编号。","tips":["`nl` 支持**逻辑页（logical pages）**，能把编号重置，指定起始编号和编号格式；逻辑页又分为页眉、正文、页脚三部分，每部分可重置行号或设置不同样式。若指定多个文件参数，`nl` 会把它们视为**单个文本流**。默认情况下，`nl` 只对属于逻辑页**正文**部分的文本流进行行编号。"],"relTips":[],"demo":[["cmd","nl notes.txt"],["out","     1\t第一行\n     2\t第二行\n     3\t第三行"],["cmd","nl -ba notes.txt"],["cmt","# -ba = 所有行都编号，包括空行"]],"multi":false},{"id":164,"key":"pr","cmd":"pr","plain":"pr","desc":"格式化要输出的文本","descShort":"格式化要输出的文本","detail":"调整文本以适应特定纸张大小，包括可选的页眉和页边距；常用于把内容格式化成多列、分页的打印版式。第 21 章已简单介绍过 `pr`，本章研究其用于打印的选项。","chapter":"第21章","cno":21,"chapterTitle":"格式化输出","chapters":["第21章","第22章"],"part":"三·常见任务与工具","partNo":3,"cats":["⑥ 格式化输出"],"core":true,"idxChapters":"第21章、第22章","kind":"cmd","syntax":"pr [选项] [文件...]","syntaxNote":"","options":[{"flag":"-l 长度","desc":"页面长度（行数）。"},{"flag":"-w 宽度","desc":"页面宽度（列数）。"}],"optTitle":"","examples":["  # 生成 /usr/bin 的内容列表并格式化为分页的 3 列打印内容\n  ls /usr/bin | pr -3 -w 65 | head\n\n  # 忽略页眉页脚后送给 a2ps\n  ls /usr/bin | pr -3 -t | a2ps -o ~/Desktop/ls.ps -L 66\n\n  # 按 12CPI、8LPI、1.5 英寸左页边距打印，必须调整 pr 选项以适应新页面大小\n  ls /usr/bin | pr -4 -w 90 -l 88 | lp -o page-left=36 -o cpi=12 -o lpi=8","  pr -l 15 -w 65 distros.txt"],"tip":"这里把页面定义为长 15 行、宽 65 列；`pr` 会生成包含**文件修改时间、文件名、页码**的默认页眉。第 22 章还会讲到更多控制页码布局的选项。","tips":["这里把页面定义为长 15 行、宽 65 列；`pr` 会生成包含**文件修改时间、文件名、页码**的默认页眉。第 22 章还会讲到更多控制页码布局的选项。","原文强调，改用与默认不同的字号/页宽时，**必须同步调整 `pr` 的选项**来适应新的页面大小（例如示例中把列数改成 `-4`、宽度改成 `-w 90`、长度改成 `-l 88`）。"],"relTips":[],"demo":[["cmd","pr notes.txt"],["out","\n\n2026-02-02 15:50                     notes.txt                     Page 1\n\n\n第一行\n第二行\n第三行"],["cmd","pr -h '我的报告' -l 60 notes.txt"],["cmt","# 加页眉、每页 60 行，用于打印"]],"multi":true},{"id":165,"key":"printf","cmd":"printf","plain":"printf","desc":"格式化并输出数据","descShort":"格式化并输出数据","detail":"把格式描述字符串应用于参数列表，格式化结果输出至标准输出。最初为 C 语言开发，现被包括 Shell 在内的大量语言使用；**printf 是 Bash 的内建命令**。","chapter":"第21章","cno":21,"chapterTitle":"格式化输出","chapters":["第21章"],"part":"三·常见任务与工具","partNo":3,"cats":["⑥ 格式化输出"],"core":true,"idxChapters":"第21章","kind":"cmd","syntax":"printf \"format\" arguments","syntaxNote":"","options":[],"optTitle":"","examples":["  printf \"I formatted the string: %s\\n\" foo\n  # I formatted the string: foo\n  printf \"I formatted '%s' as a string.\\n\" foo\n  # I formatted 'foo' as a string.\n  # 一次演示多种说明符（6 个说明符对应 6 个参数）\n  printf \"%d, %f, %o, %s, %x, %X\\n\" 380 380 380 380 380 380\n  # 380, 380.000000, 574, 380, 17c, 17C\n  # 制表符分隔的字段\n  printf \"%s\\t%s\\t%s\\n\" str1 str2 str3\n  # 字段宽度与精度\n  printf \"Line: %05d %15.3f Result: %+15d\\n\" 1071 3.14156295 32589\n  # Line: 01071           3.142 Result:          +32589\n  # 格式化一个简单网页\n  printf \"\u003chtml\u003e\\n\\t\u003chead\u003e\\n\\t\\t\u003ctitle\u003e%s\u003c/title\u003e\\n\\t\u003c/head\u003e\\n\\t\u003cbody\u003e\\n\\t\\t\u003cp\u003e%s\u003c/p\u003e\\n\\t\u003c/body\u003e\\n\u003c/html\u003e\\n\" \"Page Title\" \"Page Content\""],"tip":"与本章其他命令不同，`printf` **不适用于管道（不接受标准输入）**，也较少直接在命令行使用（多用于脚本），但它应用范围很广。格式化字符串里可以包含普通文本、转义序列（如 `\\n`、`\\t`）以及以 `%` 开头的**转换说明**。","tips":["与本章其他命令不同，`printf` **不适用于管道（不接受标准输入）**，也较少直接在命令行使用（多用于脚本），但它应用范围很广。格式化字符串里可以包含普通文本、转义序列（如 `\\n`、`\\t`）以及以 `%` 开头的**转换说明**。"],"relTips":[],"demo":[["cmd","printf 'Hello %s, you are %d years old\\n' Bob 42"],["out","Hello Bob, you are 42 years old"],["cmd","printf '%5.2f\\n' 3.14159"],["out"," 3.14"],["cmd","printf '%s\\n' a b c"],["out","a\nb\nc"]],"multi":false},{"id":166,"key":"tbl","cmd":"tbl（groff 的表格预处理程序）","plain":"tbl（groff 的表格预处理程序）","desc":"把文本排成表格","descShort":"把文本排成表格","detail":"作为 groff 的伙伴程序，把带 `.TS`/`.TE` 请求的文本流排成表格版式。","chapter":"第21章","cno":21,"chapterTitle":"格式化输出","chapters":["第21章"],"part":"三·常见任务与工具","partNo":3,"cats":["⑥ 格式化输出"],"core":false,"idxChapters":"","kind":"cmd","syntax":"","syntaxNote":"","options":[],"optTitle":"","examples":["  # sed脚本生成Linux发行版报告\n\n  1 i\\\n  .TS\\\n  center box;\\\n  cb s s\\\n  cb cb cb\\\n  l n c.\\\n  Linux Distributions Report\\\n  =\\\n  Name\tVersion\tReleased\\\n\n  _\n  s/\\([0-9]\\{2\\}\\)\\/\\([0-9]\\{2\\}\\)\\/\\([0-9]\\{4\\}\\)$/\\3-\\1-\\2/\n  $ a\\\n  .TE"],"tip":"`.TS` 和 `.TE` 请求分别作为表格的开始与结束；`.TS` 之后的行定义表格全局属性（本例为内容水平居中并用框线环绕），其余部分定义每行布局。原文特别提醒：**要确保 `Name`、`Version`、`Released` 三个单词之间用制表符分隔，绝不能用空格符**。\n\n**本章重要表格**：\n\n（1）表 21-1 nl 标记：\n\n| 标记       | 含义       |\n| -------- | -------- |\n| `\\:\\:\\:` | 逻辑页页眉的开始 |\n| `\\:\\:`   | 逻辑页正文的开始 |\n| `\\:`     | 逻辑页页脚的开始 |\n\n（2）表 21-2 常用的 nl 选项：\n\n| 选项          | 含义                                                                            |\n| ----------- | ----------------------------------------------------------------------------- |\n| `-b style`  | 将正文编号设置为 style：`a` 编号所有行；`t` 仅编号非空行（默认）；`n` 不编号；`pregexp` 仅编号匹配 BRE regexp 的行 |\n| `-f style`  | 将页脚编号设置为 style，默认值为 `n`（无）                                                    |\n| `-h style`  | 将页眉编号设置为 style，默认值为 `n`（无）                                                    |\n| `-i number` | 将页面编号增量设置为 number，默认值 1                                                       |\n| `-n format` | 将页面编号格式设置为 format：`ln` 左对齐不填充 0；`rn` 右对齐不填充 0（默认）；`rz` 右对齐并 0 填充              |\n| `-p`        | 不在每个逻辑页开头处重置页面编号                                                              |\n| `-s string` | 在每行行号之后添加 string 作为分隔符，默认值是单个制表符                                              |\n| `-v number` | 将每个逻辑页中第一行的编号设置为 number，默认值是 1                                                |\n| `-w width`  | 将行号字段的宽度设置为 width，默认值是 6                                                      |\n\n（3）表 21-3 fmt 选项：\n\n| 选项          | 描述                                                                    |\n| ----------- | --------------------------------------------------------------------- |\n| `-c`        | 在冠边距（crown margin）模式下操作：保留段落前两行缩进、后续行对第二行的缩进                          |\n| `-p string` | 仅格式化以 string 开头的行；格式化后 string 被作为重新格式化后各行的开头。可用于格式化源代码注释（如 `-p '# '`） |\n| `-s`        | 纯分割（split only）模式：仅分割行以适应指定列宽，不连接短行进行填充，适合格式化源代码等不适合连接的文本             |\n| `-u`        | 均匀间隔（uniform spacing）：传统\"打字机样式\"格式，单词间一个空格、句子间两个空格；有助于删除用空格强制对齐的效果     |\n| `-w width`  | 格式化文本以适应 width 个字符的列宽，默认 75；为实现行平衡，实际格式化行长会略微小于指定列宽                   |\n\n（4）表 21-4 常用的 printf 数据类型说明符：\n\n| 说明符 | 描述                          |\n| --- | --------------------------- |\n| `d` | 将数字格式化为有符号十进制整数             |\n| `f` | 格式化并输出浮点数                   |\n| `o` | 将整数格式化为八进制数                 |\n| `s` | 格式化字符串                      |\n| `x` | 将整数格式化为十六进制数，根据需要使用小写字母 a～f |\n| `X` | 和 x 功能一样，只不过使用大写字母 A～F      |\n| `%` | 输出普通的 `%`（指定 `%%`）          |\n\n（5）表 21-5 printf 转换说明的组件：\n\n| 组件           | 描述                                                                            |\n| ------------ | ----------------------------------------------------------------------------- |\n| `#`          | 使用替代格式输出。对于 `o`（八进制）转换，输出结果加前缀 `0`；对于 `x` 和 `X`（十六进制）转换，输出结果分别加前缀 `0x` 和 `0X` |\n| `0`          | 使用 0 填充输出结果（在字段前添加 0，例如 `000380`）                                             |\n| `-`          | 左对齐输出。默认 printf 右对齐输出                                                         |\n| `' '`（空格符）   | 为正数生成一个前导空格符                                                                  |\n| `+`          | 正数符号。默认 printf 只输出负数的符号                                                       |\n| `width`      | 一个指定字段最小宽度的数字                                                                 |\n| `.precision` | 对于浮点数，指定小数点后输出的精度位数；对于字符串转换，指定输出字符个数                                          |\n\n（6）表 21-6 printf 转换说明示例：\n\n| 参数          | 格式          | 结果          | 说明                                                          |\n| ----------- | ----------- | ----------- | ----------------------------------------------------------- |\n| 380         | `\"%d\"`      | 380         | 简单的整数格式化                                                    |\n| 380         | `\"%#x\"`     | 0x17c       | 使用\"替代格式\"标志将整数格式化为十六进制数                                      |\n| 380         | `\"%05d\"`    | 00380       | 使用前导数字 0（填充）并指定字段最小宽度为 5 个字符                                |\n| 380         | `\"%05.5f\"`  | 380.00000   | 格式化为精确到小数点后 5 位的浮点数，不足用 0 填充；由于指定字段最小宽度（5）少于格式化后实际宽度，此处并未填充 |\n| 380         | `\"%010.5f\"` | 0380.00000  | 将字段最小宽度增至 10，现在就能看到填充效果                                     |\n| 380         | `\"%+d\"`     | +380        | `+` 标志表示为正数                                                 |\n| 380         | `\"%-d\"`     | 380         | `-` 标志表示左对齐                                                 |\n| abcdefghijk | `\"%5s\"`     | abcdefghijk | 以字段最小宽度格式化字符串                                               |\n| abcdefghijk | `\"%.5s\"`    | abcde       | 对字符串设置精度，导致其被截断                                             |\n\n**本章要点速记**：\n\n1. `nl` 对行编号并支持\"逻辑页\"（页眉/正文/页脚可分别设置编号样式），`\\:\\:\\:`、`\\:\\:`、`\\:` 三个标记必须各占一行且会从输出中删除；编号默认只作用于正文。\n2. `fold` 按宽度硬折行（`-w`），加 `-s` 才在边界处的空格断开；`fmt` 做段落格式化，`-c`/`-p`/`-s`/`-u`/`-w` 各有用途。\n3. `pr` 负责分页，`-l`/`-w` 定义页面长宽，默认生成含时间、文件名、页码的页眉。\n4. `printf` 是 Bash 内建命令、不吃标准输入，核心是 `%[flags][width][.precision]转换符` 与 `\\n \\t` 等转义序列；`%s %d %f %o %x %X %%` 是最常用的说明符。\n5. `groff` 用 `-mandoc` 渲染手册页、`-T ascii` 指定 ASCII 输出（默认 PostScript）、`-t` 调用 `tbl` 排表格；`ps2pdf` 可把 PostScript 转成 PDF。\n6. 格式命令以标记语言嵌入正文，再由 groff 渲染——这与\"HTML 描述布局 + 浏览器渲染\"的思路一致。\n\n---","tips":["`.TS` 和 `.TE` 请求分别作为表格的开始与结束；`.TS` 之后的行定义表格全局属性（本例为内容水平居中并用框线环绕），其余部分定义每行布局。原文特别提醒：**要确保 `Name`、`Version`、`Released` 三个单词之间用制表符分隔，绝不能用空格符**。\n\n**本章重要表格**：\n\n（1）表 21-1 nl 标记：\n\n| 标记       | 含义       |\n| -------- | -------- |\n| `\\:\\:\\:` | 逻辑页页眉的开始 |\n| `\\:\\:`   | 逻辑页正文的开始 |\n| `\\:`     | 逻辑页页脚的开始 |\n\n（2）表 21-2 常用的 nl 选项：\n\n| 选项          | 含义                                                                            |\n| ----------- | ----------------------------------------------------------------------------- |\n| `-b style`  | 将正文编号设置为 style：`a` 编号所有行；`t` 仅编号非空行（默认）；`n` 不编号；`pregexp` 仅编号匹配 BRE regexp 的行 |\n| `-f style`  | 将页脚编号设置为 style，默认值为 `n`（无）                                                    |\n| `-h style`  | 将页眉编号设置为 style，默认值为 `n`（无）                                                    |\n| `-i number` | 将页面编号增量设置为 number，默认值 1                                                       |\n| `-n format` | 将页面编号格式设置为 format：`ln` 左对齐不填充 0；`rn` 右对齐不填充 0（默认）；`rz` 右对齐并 0 填充              |\n| `-p`        | 不在每个逻辑页开头处重置页面编号 N^HNA^HAM^HME^HE$\n         ls - list directory contents$\n  S^HSY^HYN^HNO^HOP^HPS^HSI^HIS^HS$\n         l^Hls^Hs [_^HO_^HP_^HT_^HI_^HO_^HN]... [_^HF_^HI_^HL_^HE]...$"],"tip":"原文说明 `^H`（Ctrl-H）代表退格符，用于产生粗体效果；类似地也能看到退格符/下画线序列形成的下画线效果。\n\n**本章重要表格**：\n\n表 22-1 常用的 `pr` 选项\n\n| 选项              | 描述                                             |\n| --------------- | ---------------------------------------------- |\n| `+first[:last]` | 打印从 first 至 last（可选）范围的页面                      |\n| `-columns`      | 将页面的内容按 columns 指定的列数进行组织                      |\n| `-a`            | 在默认情况下，多列输出是垂直列出的。加入 `-a`（across）选项后，则按照水平列出   |\n| `-d`            | 输出双倍间距                                         |\n| `-D format`     | 使用 format 格式化页眉显示的日期。查看 `date` 命令的手册页，了解格式化字符串 |\n| `-f`            | 使用回车符代替换页符来分隔页面                                |\n| `-h header`     | 在页眉的中间部分，使用 header 来代替被处理文件的名称                 |\n| `-l length`     | 将页面长度（垂直方向）设置为 length。默认是 66 行（每英寸 6 行字母）      |\n| `-n`            | 对行进行编号                                         |\n| `-o offset`     | 创建宽度为 offset 个字符的左边距                           |\n| `-w width`      | 将页面宽度（水平方向）设置为 width。默认值为 72 列                 |\n\n表 22-2 常用的 `lpr` 选项\n\n| 选项           | 描述                                                           |\n| ------------ | ------------------------------------------------------------ |\n| `-# number`  | 将副本数量设置为 number                                              |\n| `-p`         | 使用包含日期、时间、作业名称、页码的深色页眉打印。在打印文本文件时，可以选择这种优质打印（pretty-print）选项 |\n| `-P printer` | 指定用于打印的打印机名称。如果不指定打印机，则使用系统默认的打印机                            |\n| `-r`         | 打印后删除文件。该选项对产生临时打印文件的程序有帮助                                   |\n\n表 22-3 常用的 `lp` 选项\n\n| 选项                                                                                              | 描述                                                            |\n| ----------------------------------------------------------------------------------------------- | ------------------------------------------------------------- |\n| `-d printer`                                                                                    | 将目标打印机设置为 printer。如果未指定该选项，则使用系统默认的打印机                        |\n| `-n number`                                                                                     | 将副本数量设置为 number                                               |\n| `-o landscape`                                                                                  | 将打印方向设置为横向                                                    |\n| `-o fitplot`                                                                                    | 缩放打印内容以适合页面大小。在打印图像（如 JPEG 文件）时，该选项很有用                        |\n| `-o scaling=number`                                                                             | 缩放打印内容至 number 表示的大小。100 表示填满页面；小于 100 表示缩小；大于 100，则会在多页纸张上打印 |\n| `-o cpi=number`                                                                                 | 将水平方向上每英寸的打印字符数设置为 number。默认值是 10                             |\n| `-o lpi=number`                                                                                 | 将垂直方向上每英寸的打印行数设置为 number。默认值是 6                               |\n| `-o page-bottom=points`  \n`-o page-left=points`  \n`-o page-right=points`  \n`-o page-top=points` | 设置页边距。值以点（point）来表示，点是排版计量单位。每英寸有 72 个点                       |\n| `-P pages`                                                                                      | 指定打印页列表。pages 可以表示为逗号分隔的列表，也可以表示为范围，例如 `1,3,5,7-10`           |\n\n表 22-4 `a2ps` 选项\n\n| 选项                        | 描述                                                              |\n| ------------------------- | --------------------------------------------------------------- |\n| `--center-title=text`     | 将居中的页眉设置为 text                                                  |\n| `--columns=number`        | 将页面排成 number 列。默认值为 2                                           |\n| `--footer=text`           | 将页脚设置为 text                                                     |\n| `--guess`                 | 报告作为参数给出的文件类型。由于 a2ps 尝试转换并格式化所有类型的数据，该选项对预测 a2ps 处理特定文件时的行为很有用 |\n| `--left-footer=text`      | 将左边页面的页脚设置为 text                                                |\n| `--left-title=text`       | 将左边页面的页眉设置为 text                                                |\n| `--line-numbers=interval` | 每隔 interval 行输出行号                                               |\n| `--list=defaults`         | 显示默认设置                                                          |\n| `--pages=range`           | 打印 range 范围内的页面                                                 |\n| `--right-footer=text`     | 将右边页面的页脚设置为 text                                                |\n| `--right-title=text`      | 将右边页面的页眉设置为 text                                                |\n| `--rows=number`           | 将页面排成 number 行。默认值为 1                                           |\n| `-B`                      | 不设页眉                                                            |\n| `-b text`                 | 将页眉设置为 text                                                     |\n| `-f size`                 | 使用 size 点大小的字体                                                  |\n| `-l number`               | 设置每行打印 number 个字符。该选项和 `-L` 选项可用于将其他程序（如 pr）分页过的文件正确地显示于页面上     |\n| `-L number`               | 将每页行数设置为 number                                                 |\n| `-M name`                 | 使用名为 name 的纸张，例如 A4                                             |\n| `-n number`               | 每页打印 number 份副本                                                 |\n| `-o file`                 | 将打印内容发送至 file。如果 file 指定为 `-`，则打印内容发送至标准输出                      |\n| `-P printer`              | 使用打印机 printer。如果未指定打印机，则使用系统默认的打印机                              |\n| `-R`                      | 纵向排版                                                            |\n| `-r`                      | 横向排版                                                            |\n| `-T number` cal/bin`，普通用户无写入权限，必须用超级用户执行安装。\n\n---\n\n---","tips":["原文总结为「使用 3 个简单的命令（`./configure`、`make`、`make install`）来构建源代码软件包」；构建过程中如果 `configure` 或 `make` 报错，必须先纠正错误才能得到可执行文件。\n\n**本章重要表格**：无（原文本章未给出表格；makefile 的关键片段已在上文以代码块还原）。\n\n**本章要点速记**：\n\n1. 编译 = 把人类可读的源代码翻译成处理器原生机器语言；链接器负责把编译器输出与所需库链接成可执行文件。\n2. 典型源码包的构建三步曲：`./configure` → `make` → `sudo make install`；`./` 前缀不能省，因为 `configure` 不在 Shell 的搜索目录里。\n3. `.tar` / tarball 装的是源代码树；解压前建议先用 `tar tzvf tarfile | head` 检查布局，避免文件直接散落到当前目录。\n4. 动手之前先读 **README** 和 **INSTALL**（另有 NEWS、COPYING），它们包含程序描述、构建与安装步骤、许可条款。\n5. `make` 的看家本领是「只构建需要构建的部分」，依据是「目标文件必须比依赖文件新」，适合大型项目（例如百万行级别的 Linux 内核）。\n6. 安装位置默认是 `/usr/local/bin`，普通用户无写入权限，必须用超级用户执行安装。\n\n---\n\n---"],"relTips":[],"demo":[],"multi":false},{"id":180,"key":"Vim 配置选项","cmd":"Vim 配置选项","plain":"Vim 配置选项","desc":"为编写脚本提供方便（本章专题框）","descShort":"为编写脚本提供方便（本章专题框）","detail":"配置 Vim，使编写脚本更轻松、更易发现错误。","chapter":"第24章","cno":24,"chapterTitle":"编写第一个脚本","chapters":["第24章"],"part":"四·Shell 脚本","partNo":4,"cats":["㉓ 其他卡片（书中项目脚本与专题）"],"core":false,"idxChapters":"","kind":"cmd","syntax":"- `:syntax on` — 启用语法高亮，不同的 Shell 语法元素会以不同颜色显示，有助于识别某些编程错误。要求安装完整版的 Vim，且所编辑的文件必须含有 shebang；如果设置该命令有困难，可以试一试 `set syntax=sh`。\n  - `:set hlsearch` — 启用查找结果高亮（例如查找单词 `echo` 时，该单词的所有实例都会高亮显示）。\n  - `:set tabstop=4` — 设置制表符占用的列数，**默认值是 8 列**，设置为 4（常见做法）便于较长的行适应屏幕。\n  - `:set autoindent` — 启用「自动缩进」，使 Vim 缩进新行时与上一行保持一致，能加快很多编程构建的输入速度；按 **Ctrl-D** 组合键可以停止缩进。","syntaxNote":"","options":[{"flag":":syntax on","desc":"启用语法高亮，不同的 Shell 语法元素会以不同颜色显示，有助于识别某些编程错误。要求安装完整版的 Vim，且所编辑的文件必须含有 shebang；如果设置该命令有困难，可以试一试 `set syntax=sh`。"},{"flag":":set hlsearch","desc":"启用查找结果高亮（例如查找单词 `echo` 时，该单词的所有实例都会高亮显示）。"},{"flag":":set tabstop=4","desc":"设置制表符占用的列数，**默认值是 8 列**，设置为 4（常见做法）便于较长的行适应屏幕。"},{"flag":":set autoindent","desc":"启用「自动缩进」，使 Vim 缩进新行时与上一行保持一致，能加快很多编程构建的输入速度；按 **Ctrl-D** 组合键可以停止缩进。"}],"optTitle":"","examples":["  :syntax on\n  :set hlsearch\n  :set tabstop=4\n  :set autoindent"],"tip":"把这些命令（**不包括开头的冒号**）加入你的 `~/.vimrc` 文件，就能使改动永久有效。\n\n**本章重要表格**：无。\n\n**本章要点速记**：\n\n1. Shell 脚本就是装着「一系列命令」的普通文本文件；Shell 既是命令行接口又是脚本解释器。\n2. 跑起来只需三步：写文件 → `chmod` 加可执行权限（常见 755 / 700）→ 放到 `PATH` 覆盖的目录里（个人脚本放 `~/bin`）。\n3. `#!/bin/bash` 是要写在**第一行**的 shebang，用来告诉内核用哪个解释器执行脚本。\n4. 不指定路径直接敲脚本名会报 `command not found`，因为该目录不在 `PATH` 中；`PATH` 是用冒号分隔的目录列表。\n5. 本地软件（脚本或程序）应放 `/usr/local` 系目录，`/bin`、`/usr/bin` 只放发行商提供和维护的文件。\n6. 脚本要写给「未来的自己和别人」看：长选项、续行加缩进都是为了提高可维护性。\n\n---\n\n---","tips":["把这些命令（**不包括开头的冒号**）加入你的 `~/.vimrc` 文件，就能使改动永久有效。\n\n**本章重要表格**：无。\n\n**本章要点速记**：\n\n1. Shell 脚本就是装着「一系列命令」的普通文本文件；Shell 既是命令行接口又是脚本解释器。\n2. 跑起来只需三步：写文件 → `chmod` 加可执行权限（常见 755 / 700）→ 放到 `PATH` 覆盖的目录里（个人脚本放 `~/bin`）。\n3. `#!/bin/bash` 是要写在**第一行**的 shebang，用来告诉内核用哪个解释器执行脚本。\n4. 不指定路径直接敲脚本名会报 `command not found`，因为该目录不在 `PATH` 中；`PATH` 是用冒号分隔的目录列表。\n5. 本地软件（脚本或程序）应放 `/usr/local` 系目录，`/bin`、`/usr/bin` 只放发行商提供和维护的文件。\n6. 脚本要写给「未来的自己和别人」看：长选项、续行加缩进都是为了提高可维护性。\n\n---\n\n---"],"relTips":[],"demo":[["cmd",":syntax on"],["cmd",":set hlsearch"],["cmd",":set tabstop=4"],["cmd",":set autoindent"]],"multi":false},{"id":181,"key":"#","cmd":"`#` 注释","plain":"# 注释","desc":"让脚本可读","descShort":"让脚本可读","detail":"在脚本（和命令行）中写说明，`#` 之后的所有内容都会被忽略。","chapter":"第24章","cno":24,"chapterTitle":"编写第一个脚本","chapters":["第24章"],"part":"四·Shell 脚本","partNo":4,"cats":[],"core":false,"idxChapters":"","kind":"cmd","syntax":"整行注释 `# 注释内容`；行尾注释 `命令 # 注释内容`（`#` 之前至少有一个空白字符）","syntaxNote":"","options":[],"optTitle":"","examples":["  echo 'Hello World!' # 这也是注释\n\n  [me@linuxbox ~]$ echo 'Hello World!' # 这也是注释\n  Hello World!"],"tip":"原文说明，尽管很少会在命令行中这样使用注释，但这个规则确实可行。","tips":["原文说明，尽管很少会在命令行中这样使用注释，但这个规则确实可行。"],"relTips":[],"demo":[["cmd","echo 'Hello World!' # 这也是注释"],["gap",""],["cmd","[me@linuxbox ~]$ echo 'Hello World!' # 这也是注释"],["cmd","Hello World!"]],"multi":false},{"id":182,"key":"./脚本名","cmd":"`./脚本名`","plain":"./脚本名","desc":"用路径执行脚本","descShort":"用路径执行脚本","detail":"执行当前目录下的脚本。","chapter":"第24章","cno":24,"chapterTitle":"编写第一个脚本","chapters":["第24章"],"part" `、值之间不能有空白；值可以是任何能扩展成字符串的东西（含变量扩展、命令替换 `$(...)`、算术扩展 `$((...))`、转义序列）。\n4. 变量名有歧义时用 `${变量名}` 划清边界（如 `\"${filename}1\"`）；变量和命令替换放进双引号可避免单词分割。\n5. 常量与变量在 Shell 中不作区分，只是惯例用大写表示常量；`declare -r` 可强制只读，但很少用。\n6. here document（`command \u003c\u003c token ... token`）是在脚本里嵌入文本块送到标准输入的方式，引号在其中失去特殊含义；`\u003c\u003c-` 可忽略行首制表符，但**不忽略空格**。\n\n---\n\n---"],"relTips":[],"demo":[["cmd","[me@linuxbox ~]$ vim ~/bin/sys_info_page"],["cmd","[me@linuxbox ~]$ chmod 755 ~/bin/sys_info_page"],["cmd","[me@linuxbox ~]$ sys_info_page"],["gap",""],["cmt","# 把输出重定向到 HTML 文件，用浏览器查看"],["cmd","[me@linuxbox ~]$ sys_info_page \u003e sys_info_page.html"],["cmd","[me@linuxbox ~]$ firefox sys_info_page.html"]],"multi":false},{"id":200,"key":"\u003c\u003c","cmd":"here document（`\u003c\u003c`）","plain":"here document（\u003c\u003c）","desc":"在脚本中嵌入文本块","descShort":"在脚本中嵌入文本块","detail":"另一种 I/O 重定向形式，用来在脚本内嵌入文本块并将其送至命令的标准输入。","chapter":"第25章","cno":25,"chapterTitle":"启动项目","chapters":["第25章","第34章"],"part":"四·Shell 脚本","partNo":4,"cats":["㉓ 其他卡片（书中项目脚本与专题）"],"core":false,"idxChapters":"","kind":"cmd","syntax":"command \u003c\u003c token\n  text\n  token","syntaxNote":"","options":[{"flag":"command","desc":"能够接受标准输入的命令名称（示例中用 `cat`，也用 `ftp -n`）。"},{"flag":"token","desc":"一个字符串，用于标示嵌入文本的起止（命名惯例是 `_EOF_`，即文件起止 end of file 的缩写）。**该字符串必须单独出现，所在行的末尾绝不能有空白字符。**"}],"optTitle":"","examples":["  #!/bin/bash\n\n  # 程序输出一个系统信息页\n\n  TITLE=\"System Information Report For $HOSTNAME\"\n  CURRENT_TIME=\"$(date +\"%x %r %Z\")\"\n  TIMESTAMP=\"Generated $CURRENT_TIME, by $USER\"\n\n  cat \u003c\u003c _EOF_\n  \u003chtml\u003e\n          \u003chead\u003e\n                  \u003ctitle\u003e$TITLE\u003c/title\u003e\n          \u003c/head\u003e\n          \u003cbody\u003e\n                  \u003ch1\u003e$TITLE\u003c/h1\u003e\n                  \u003cp\u003e$TIMESTAMP\u003c/p\u003e\n          \u003c/body\u003e\n  \u003c/html\u003e\n  _EOF_","  #!/bin/bash\n\n  # 通过 FTP 检索文件的脚本\n\n  FTP_SERVER=ftp.nl.debian.org\n  FTP_PATH=/debian 桩代码」（空函数 + 反馈输出），可以让脚本始终保持在可执行状态，尽早发现错误、便于定位最近的改动。\n6. `report_uptime`/`report_disk_space`/`report_home_space` 分别用 `uptime`、`df -h`、`du -sh /home/*` 取数；主目录空间这一项受权限影响，需要按用户权限调整脚本行为（第 27 章解决）。\n\n---\n\n---"],"relTips":[],"demo":[["cmd","ds () {"],["cmd","echo \"Disk Space Utilization For $HOSTNAME\""],["cmd","df –h"],["cmd","}"]],"multi":false},{"id":204,"key":"local","cmd":"`local`","plain":"local","desc":"定义局部变量","descShort":"定义局部变量","detail":"在函数内部创建只在该函数中有效的变量。","chapter":"第26章","cno":26,"chapterTitle":"自顶向下设计","chapters":["第26章"],"part":"四·Shell 脚本","partNo":4,"cats":["⑳ Shell 脚本：流程控制与函数"],"core":true,"idxChapters":"第26章","kind":"cmd","syntax":"`local 变量名`（或 `local 变量名=值`）","syntaxNote":"","options":[],"optTitle":"","examples":["  #!/bin/bash\n\n  # local-vars: 演示本地变量的脚本\n\n  foo=0  # global variable foo\n\n  funct_1 () {\n\n        local foo    # funct_1 局部变量 foo\n        foo=1\n        echo \"funct_1: foo = $foo\"\n  }\n\n  funct_2 () {\n\n        local foo    # funct_2 局部变量 foo\n\n        foo=2\n        echo \"funct_2: foo = $foo\"\n  }\n\n  echo \"global: foo = $foo\"\n  funct_1\n  echo \"global: foo = $foo\"\n  funct_2\n  echo \"global: foo = $foo\"","  [me@linuxbox ~]$ local-vars\n  global: foo = 0\n  funct_1: foo = 1\n  global: foo = 0\n  funct_2: foo = 2\n  global: foo = 0"],"tip":"两个函数中对局部变量 `foo` 的赋值也不影响函数外定义的 `foo`。该特性有助于阻止程序各部分相互干扰，并使函数可移植。","tips":["两个函数中对局部变量 `foo` 的赋值也不影响函数外定义的 `foo`。该特性有助于阻止程序各部分相互干扰，并使函数可移植。"],"relTips":[],"demo":[["cmd","cat local-demo.sh"],["out","#!/bin/bash\nfoo=global\nshow() {\n  local foo=local\n  echo $foo\n}\nshow\necho $foo"],["cmd","./local-demo.sh"],["out","local\nglobal"],["cmt","# local 让变量只在函数内部有效，不污染全局"]],"multi":false},{"id":205,"key":"df -h","cmd":"df -h","plain":"df -h","desc":"查看磁盘空间使用总量","descShort":"查看磁盘空间使用总量","detail":"确定磁盘空间总量，生成「Disk Space Utilization」小节。","chapter":"第26章","cno":26,"chapterTitle":"自顶向下设计","chapters":["第26章"],"part":"四·Shell 脚本","partNo":4,"cats":["㉓ 其他卡片（书中项目脚本与专题）"],"core":false,"idxCh "第27章","cno":27,"chapterTitle":"流程控制：if 分支","chapters":["第27章"],"part":"四·Shell 脚本","partNo":4,"cats":["㉓ 其他卡片（书中项目脚本与专题）"],"core":false,"idxChapters":"","kind":"cmd","syntax":"`(( 算术表达式 ))`，常用于 `if ((INT == 0)); then ... fi`","syntaxNote":"","options":[],"optTitle":"","examples":["  [me@linuxbox ~]$ if ((1)); then echo \"It is true.\"; fi\n  It is true.\n  [me@linuxbox ~]$ if ((0)); then echo \"It is true.\"; fi\n  [me@linuxbox ~]$\n\n  # 简化后的 test-integer2a 脚本\n  #!/bin/bash\n\n  # test-integer2a: 计算整数的值\n\n  INT=-5\n\n  if [[ \"$INT\" =~ ^-?[0-9]+$ ]]; then\n        if ((INT == 0)); then\n              echo \"INT is zero.\"\n        else\n              if ((INT \u003c 0)); then\n                    echo \"INT is negative.\"\n              else\n                    echo \"INT is positive.\"\n              fi\n              if (( ((INT % 2)) == 0)); then\n                    echo \"INT is even.\"\n              else\n                    echo \"INT is odd.\"\n              fi\n        fi\n  else\n        echo \"INT is not an integer.\" \u003e\u00262\n        exit 1\n  fi"],"tip":"这里使用了 `\u003c` 和 `\u003e`，`==` 则用于测试相等性，**这种语法在处理整数时看起来更自然**。由于 `(())` 复合命令是 Shell 语法的一部分而非普通命令，并且只能处理整数，因此它能够**通过名称来识别变量，不需要执行扩展操作**。","tips":["这里使用了 `\u003c` 和 `\u003e`，`==` 则用于测试相等性，**这种语法在处理整数时看起来更自然**。由于 `(())` 复合命令是 Shell 语法的一部分而非普通命令，并且只能处理整数，因此它能够**通过名称来识别变量，不需要执行扩展操作**。"],"relTips":[],"demo":[["cmd","[me@linuxbox ~]$ if ((1)); then echo \"It is true.\"; fi"],["cmd","It is true."],["cmd","[me@linuxbox ~]$ if ((0)); then echo \"It is true.\"; fi"],["cmd","[me@linuxbox ~]$"],["gap",""],["cmt","# 简化后的 test-integer2a 脚本"],["cmt","# !/bin/bash"],["gap",""],["cmt","# test-integer2a: 计算整数的值"],["gap",""],["cmd","INT=-5"],["gap",""],["cmd","if [[ \"$INT\" =~ ^-?[0-9]+$ ]]; then"],["cmd","if ((INT == 0)); then"],["cmd","echo \"INT is zero.\""],["cmd","else"],["cmd","if ((INT \u003c 0)); then"],["cmd","echo \"INT is negative.\""],["cmd","else"],["cmd","echo \"INT is positive.\""],["cmd","fi"],["cmd","if (( ((INT % 2)) == 0)); then"],["cmd","echo \"INT is even.\""],["cmd","else"],["cmd","echo \"INT is odd.\""],["cmd","fi"],["cmd","fi"],["cmd","else"],["cmd","echo \"INT is not an integer.\" \u003e\u00262"],["cmd","exit 1"],["cmd","fi"]],"multi":false},{"id":212,"key":"\u003e\u00262","cmd":"`\u003e\u00262`","plain":"\u003e\u00262","desc":"把错误消息重定向到标准错误","descShort":"把错误消息重定向到标准错误","detail":"输出错误消息时的正确做法。","chapter":"第27章","cno":27,"chapterTitle":"流程控制：if 分支","chapters":["第27章"],"part":"四·Shell 脚本","partNo":4,"cats":["㉓ 其他卡片（书中项目脚本与专题）"],"core":false,"idxChapters":"","kind":"cmd","syntax":"echo \"错误消息\" \u003e\u00262","syntaxNote":"","options":[],"optTitle":"","examples":["  if [ -z \"$ANSWER\" ]; then\n        echo \"There is no answer.\" \u003e\u00262\n        exit 1\n  fi\n\n  if [[ \"$INT\" =~ ^-?[0-9]+$ ]]; then\n        ...\n  else\n        echo \"INT is not an integer.\" \u003e\u00262\n        exit 1\n  fi"],"tip":"原文明确指出：`echo` 命令使用了重定向，将错误消息重定向到标准错误，**这是处理错误消息的正确方式**。\n\n**本章重要表格**：\n\n表 27-1 `test` 的文件表达式\n\n| 表达式               | 什么情况下为真                                       |\n| ----------------- | --------------------------------------------- |\n| `file1 -ef file2` | file1 和 file2 具有相同的 i 节点编号（两个文件名通过硬链接指向同一个文件） |\n| `file1 -nt file2` | file1 比 file2 新                               |\n| `file1 -ot file2` | file1 比 file2 旧                               |\n| `-b file`         | file 存在且为块设备文件                                |\n| `-c file`         | file 存在且为字符设备文件                               |\n| `-d file`         | file 存在且为目录                                   |\n| `-e file`         | file 存在                                       |\n| `-f file`         | file 存在且为普通文件                                 |\n| `-g file`         | file 存在且设置了 SGID 位                            |\n| `-G file`         | file 存在且为有效组 ID 所有                            |\n| `-k file`         | file 存在且设置了「粘滞位」                              |\n| `-L file`         | file 存在且为符号链接                                 |\n| `-O file`         | file 存在且为有效用户 ID 所有                           |\n| `-p file`         | file 存在且为具名管道                                 |\n| `-r file`         | file 存在且可读（有效用户具有可读权限）                        |\n| `-s file`         | file 存在且不为空                                   |\n| `-S file`         | file 存在且为网络套接字                                |\n| `-t fd`           | fd 是与终端关联的文件描述符。该表达式可用于判断标准输入/输出/错误是否被重定向     |\n| `-u file`         | 文件存在且设置了 SUID 位                               |\n| `-w file`         | file 存在且可写（有效用户具有写权限）                         |\n| `-x file`         | file 存在且可执行（有效用户具有执行/搜索权限）                    |\n\n表 27-2 `test` 的字符串表达式\n\n| 表达式                                        | 什么情况下为真                                               |\n| ------------------------------------------ | ----------------------------------------------------- |\n| `string`                                   | string 不为空                                            |\n| `-n string`                                | string 的长度大于 0                                        |\n| `-z string`                                | string 的长度为 0                                         |\n| `string1 = string2`  \n`string1 == string2` | string1 和 string2 相同。单等号和双等号都可以使用。最好使用双等号，但其不符合 POSIX |\n| `string1 != string2`                       | string1 和 string2 不相同                                 |\n| `string1 \u003e string2`                        | string1 的排序位于 string2 之后                              |\n| `string1 \u003c string2`                        | string1 的排序位于 string2 之前                              |\n\n\u003e 原文注意：在使用 `test` 时，**必须将表达式操作符 `\u003e` 和 `\u003c` 引用起来（或者通过反斜线转义）**。如果不这么做，两者会被 Shell 解释为重定向操作符，有可能会造成破坏性后果。另外还要注意，尽管 Bash 文档中说过排序遵从当前语言环境的排序规则，但事实并非如此——一直到 4.0 版本，Bash 一直使用的是 ASCII（POSIX）排序，这个问题在 4.1 版本中才纠正过来。\n\n表 27-3 `test` 的整数表达式\n\n| 表达式                     | 什么情况下为真                 |\n| ----------------------- | ----------------------- |\n| `integer1 -eq integer2` | integer1 等于 integer2    |\n| `integer1 -ne integer2` | integer1 不等于 integer2   |\n| `integer1 -le integer2` | integer1 小于或等于 integer2 |\n| `integer1 -lt integer2` | integer1 小于 integer2    |\n| `integer1 -ge integer2` | integer1 大于或等于 integer2 |\n| `integer1 -gt integer2` | integer1 大于 integer2    |\n\n表 27-4 逻辑操作符\n\n| 操作  | `test` | `[[]]` 和 `(())` |    |    |\n| --- | ------ | --------------- | -- | -- |\n| AND | `-a`   | `\u0026\u0026`            |    |    |\n| OR  | `-o`   | \\`\\\\            | \\\\ | \\` |\n| NOT | `!`    | `!`             |    |    |\n\n**本章要点速记**：\n\n1. 退出状态是 0～255 的整数：**0 总表示成功**，其他值表示失败；用 `echo $?` 读取上一条命令的退出状态。\n2. `if` 判断的本质是「命令成功与否」，条件是命令列表时**只看最后一个命令**的退出状态。\n3. `test` 与 `[ ]` 完全等价，`[` 是命令、`]` 必须是最后一个参数，因此 `\u003c`、`\u003e`、`(`、`)` 要引用或转义；判断文件状态、字符串、整数分别用表 27-1、27-2、27-3 的表达式。\n4. `[[ ]]` 是 test 的增强版，支持所有 test 表达式，额外提供 `=~` 正则匹配和 `==` 路径名模式匹配，是现代 Shell 脚本的首选；`(())` 只处理整数，把非 0 结果视为真，且按名称识别变量、不需要扩展。\n5. 三类判断里的参数建议加引号，防止参数扩展为空时操作符被当成普通字符串。\n6. 组合与分支有两种写法：`test` 内部用 `-a` / `-o` / `!`；`[[ ]]`、`(())` 以及命令之间用 `\u0026\u0026`（前一个成功才执行后一个）和 `||`（前一个失败才执行后一个），例如 `[ -d temp ] || exit 1`。\n7. 本章末尾用 `if [[ \"$(id -u)\" -eq 0 ]]` 解决第 26 章遗留的问题：按用户权限分别输出「所有用户」或「当前用户」的主目录空间报告。\n\n---","tips":["原文明确指出：`echo` 命令使用了重定向，将错误消息重定向到标准错误，**这是处理错误消息的正确方式**。\n\n**本章重要表格**：\n\n表 27-1 `test` 的文件表达式\n\n| 表达式               | 什么情况下为真                                       |\n| ----------------- | --------------------------------------------- |\n| `file1 -ef file2` | file1 和 file2 具有相同的 i 节点编号（两个文件名通过硬链接指向同一个文件） |\n| `file1 -nt file2` | file1 比 file2 新                               |\n| `file1 -ot file2` | file1 比 file2 旧                               |\n| `-b file`         | file 存在且为块设备文件                                |\n| `-c file`         | file 存在且为字符设备文件                               |\n| `-d file`         | file 存在且为目录                                   |\n| `-e file`         | file 存在                                       |\n|            echo \"Hostname: $HOSTNAME\"\n                    uptime\n                    sleep \"$DELAY\"\n                    continue\n              fi\n              if [[ \"$REPLY\" == 2 ]]; then\n                    df -h\n                    sleep \"$DELAY\"\n                    continue\n              fi\n              if [[ \"$REPLY\" == 3 ]]; then\n                    if [[ \"$(id -u)\" -eq 0 ]]; then\n                          echo \"Home Space Utilization (All Users)\"\n                          du -sh /home/*\n                    else\n                          echo \"Home Space Utilization ($USER)\"\n                          du -sh \"$HOME\"\n                    fi\n                    sleep \"$DELAY\"\n                    continue\n              fi\n              if [[ \"$REPLY\" == 0 ]]; then\n                    break\n              fi\n        else\n              echo \"Invalid entry.\"\n              sleep \"$DELAY\"\n        fi\n  done\n  echo \"Program terminated.\"","  [me@linuxbox ~]$ true\n  [me@linuxbox ~]$ echo $?\n  0"],"tip":"原文写道，“这是一种几乎人人皆知的脚本技术”。因为循环不会自己结束，所以需要程序员提供某种方式使其在恰当的时刻跳出循环。","tips":["原文写道，“这是一种几乎人人皆知的脚本技术”。因为循环不会自己结束，所以需要程序员提供某种方式使其在恰当的时刻跳出循环。"],"relTips":[],"demo":[["cmd","true \u0026\u0026 echo 总是成功"],["out","总是成功"],["cmt","# 退出状态永远是 0，写死循环 while true 靠它"]],"multi":true},{"id":222,"key":"\u003c\u003c\u003c","cmd":"\u003c\u003c\u003c","plain":"\u003c\u003c\u003c","desc":"here string（把单个字符串送进命令的标准输入）","descShort":"here string（把单个字符串送进命令的标准输入）","detail":"`\u003c\u003c\u003c` 表示 here string。here string 类似于 here document，但是更简短，仅由单个字符串组成。","chapter":"第28章","cno":28,"chapterTitle":"读取键盘输入","chapters":["第28章"],"part":"四·Shell 脚本","partNo":4,"cats":["㉓ 其他卡片（书中项目脚本与专题）"],"core":false,"idxChapters":"","kind":"cmd","syntax":"command \u003c\u003c\u003c \"string\"","syntaxNote":"","options":[],"optTitle":"","examples":["  IFS=\":\" read user pw uid gid name home shell \u003c\u003c\u003c \"$file_info\""],"tip":"原文点出了它相对管道的优势——不能用下面这种写法，因为管道会创建子 Shell：\n  \n  原文对此写道：“还是有原因的……”，并在“别把 read 放入管道”的提示中解释了子 Shell 导致赋值丢失的原因。","tips":["原文点出了它相对管道的优势——不能用下面这种写法，因为管道会创建子 Shell：\n  \n  原文对此写道：“还是有原因的……”，并在“别把 read 放入管道”的提示中解释了子 Shell 导致赋值丢失的原因。"],"relTips":[],"demo":[["cmd","IFS=\":\" read user pw uid gid name home shell \u003c\u003c\u003c \"$file_info\""]],"multi":false},{"id":223,"key":"IFS","cmd":"IFS","plain":"IFS","desc":"内部字段分隔符（控制 read 的字段划分）","descShort":"内部字段分隔符（控制 read 的字段划分）","detail":"Shell 通常会对提供给 `read` 的输入进行单词分割——输入行中被一个或多个空白字符分隔的多个单词会变成若干个独立项，再由 `read` 分配给各个变量。Shell 变量“内部字段分隔符”（Internal Field Separator，IFS）控制着此行为。","chapter":"第28章","cno":28,"chapterTitle":"读取键盘输入","chapters":["第28章"],"part":"四·Shell 脚本","partNo":4,"cats":["㉒ 交互输入、管道与系统信息"],"core":false,"idxChapters":"","kind":"cmd","syntax":"- 可以通过调整 `IFS` 的值来控制 `read` 的输入字段。原文举例：`/etc/passwd` 文件中的数据行采用**冒号**作为字段分隔符，把 `IFS` 的值改成冒号，就可以用 `read` 读入 `/etc/passwd` 的内容并顺利将字段分隔存入各个变量。","syntaxNote":"","options":[],"optTitle":"","examples":["  #!/bin/bash\n\n  # read-ifs: 从文件中读取字段\n\n  FILE=/etc/passwd\n\n  read -p \"Enter a username \u003e \" user_name\n\n  file_info=\"$(grep \"^$user_name:\" $FILE)\"\n\n  if [ -n \"$file_info\" ]; then\n        IFS=\":\" read user pw uid gid name home shell \u003c\u003c\u003c \"$file_info\"\n        echo \"User =      '$user'\"\n        echo \"UID =       '$uid'\"\n        echo \"GID =       '$gid'\"\n        echo \"Full Name = '$name'\"\n        echo \"Home Dir. = '$home'\"\n        echo \"Shell =     '$shell'\"\n  else\n        echo \"No such user '$user_name'\" \u003e\u00262\n        exit 1\n  fi","  OLD_IFS=\"$IFS\"\n  IFS=\":\"\n  read user pw uid gid name home shell \u003c\u003c\u003c \"$file_info\"\n  IFS=\"$OLD_IFS\"","  IFS=\":\" read user pw uid gid name home shell \u003c\u003c\u003c \"$file_info\"","  file_info=$(grep \"^$user_name:\" $FILE)"],"tip":"原文强调，把变量赋值放在命令之前显然是一种更为简洁的实现方式（相比上面的保存/恢复写法）。","tips":["原文强调，把变量赋值放在命令之前显然是一种更为简洁的实现方式（相比上面的保存/恢复写法）。"],"relTips":[],"demo":[["cmt","# !/bin/bash"],["gap",""],[ `echo` 多行菜单文本（列出 1、2、3、0 各选项）；\n  - `read -p \"Enter selection [0-3] \u003e \"`：读取用户选择，结果进入 `REPLY`；\n  - `if [[ \"$REPLY\" =~ ^[0-3]$ ]]`：用正则限定取值范围，只接受 0～3；\n  - 内层逐个 `if [[ \"$REPLY\" == n ]]` 分发到各菜单项功能；\n  - 每个分支末尾用 `exit` 结束程序，**防止继续执行不必要的代码**；\n  - 无效输入时向标准错误输出并 `exit 1`。","syntaxNote":"","options":[{"flag":"clear","desc":"清屏；"},{"flag":"read -p \"Enter selection [0-3] \u003e \"","desc":"读取用户选择，结果进入 `REPLY`；"},{"flag":"if [[ \"$REPLY\" =~ ^[0-3]$ ]]","desc":"用正则限定取值范围，只接受 0～3；"}],"optTitle":"","examples":["  #!/bin/bash\n\n  # read-menu: 菜单驱动的系统信息程序\n\n  clear\n  echo \"\n  Please Select:\n\n  1. Display System Information\n  2. Display Disk Space\n  3. Display Home Space Utilization\n  0. Quit\n  \"\n  read -p \"Enter selection [0-3] \u003e \"\n\n  if [[ \"$REPLY\" =~ ^[0-3]$ ]]; then\n        if [[ \"$REPLY\" == 0 ]]; then\n              echo \"Program terminated.\"\n              exit\n        fi\n        if [[ \"$REPLY\" == 1 ]]; then\n              echo \"Hostname: $HOSTNAME\"\n              uptime\n              exit\n        fi\n        if [[ \"$REPLY\" == 2 ]]; then\n              df -h\n              exit\n        fi\n        if [[ \"$REPLY\" == 3 ]]; then\n              if [[ \"$(id -u)\" -eq 0 ]]; then\n                    echo \"Home Space Utilization (All Users)\"\n                    du -sh /home/*\n              else\n                    echo \"Home Space Utilization ($USER)\"\n                    du -sh \"$HOME\"\n              fi\n              exit\n        fi\n  else\n        echo \"Invalid entry.\" \u003e\u00262\n        exit 1\n  fi","  Please Select:\n\n  1. Display System Information\n  2. Display Disk Space\n  3. Display Home Space Utilization\n  0. Quit\n\n  Enter selection [0-3] \u003e"],"tip":"原文指出该脚本在逻辑上分为两部分：第一部分展示菜单并获取用户输入，第二部分识别输入并执行相应的菜单项功能。关于脚本中多处 `exit` 的用法，原文写道：程序中存在多个出口通常不是什么好事（这会导致程序逻辑难以理解），但是在这个脚本中倒没什么问题。\n\n**本章重要表格**：表 28-1 read 选项（按原文还原）\n\n| 选项             | 描述                                               |\n| -------------- | ------------------------------------------------ |\n| `-a array`     | 将输入分配给数组（从索引 0 开始）。我们会在第 35 章介绍数组                |\n| `-d delimiter` | 将字符串 `delimiter` 中的第一个字符（而非换行符）作为输入的结束           |\n| `-e`           | 使用 Readline 处理输入。这允许使用和命令行相同的方式编辑输入              |\n| `-i string`    | 如果用户直接按 Enter 键，使用 `string` 作为默认值。需要配合 `-e` 选项使用 |\n| `-n num`       | 从输入中读取 `num` 个字符，而非读取一整行                         |\n| `-p prompt`    | 将字符串 `prompt` 作为输入提示来显示                          |\n| `-r`           | 原始模式（raw mode）。不将反斜线符解释为转义                       |\n| `-s`           | 静默模式。在用户输入字符时不回显。该模式适用于输入密码或其他机密信息               |\n| `-t seconds`   | 超时。`seconds` 秒之后终止输入。如果输入超时，`read` 返回非 0 退出状态值   |\n| `-u fd`        | 从文件描述符 `fd`（而非标准输入）中读取输入                         |\n\n**本章要点速记**：\n\n1. `read [-options] [variable...]` 从标准输入读一行，按字段分配给变量；不指定变量时存进 `REPLY`。\n2. 值少于变量数 → 多出的变量为空；值多于变量数 → 多余的输入全部在最后一个变量里。\n3. 常用选项：`-p` 提示、`-s` 静默、`-t` 超时、`-n num` 读固定字符数、`-e`/`-i` 提供可编辑默认值、`-r` 原始模式、`-a` 数组、`-d` 结束符、`-u` 指定文件描述符。\n4. `IFS` 控制 `read` 的单词分割，默认是空格/制表/换行；把它临时改成 `:` 就能读 `/etc/passwd` 这类冒号分隔的行。\n5. 放在命令前的变量赋值只对该次命令有效，等价于“保存原值 → 改值 → 执行 → 恢复原值”，但更简洁。\n6. **不要把 `read` 放进管道**：管道会创建子 Shell，赋值后会随子 Shell 销毁而丢失；`\u003c\u003c\u003c` here string 是绕开该问题的一种方法。\n7. 输入验证与菜单驱动是本章的落地场景：先限定输入范围（如 `^[0-3]$`），再分发处理，无效输入向标准错误报告并退出。\n\n---\n\n---","tips":["原文指出该脚本在逻辑上分为两部分：第一部分展示菜单并获取用户输入，第二部分识别输入并执行相应的菜单项功能。关于脚本中多处 `exit` 的用法，原文写道：程序中存在多个出口通常不是什么好事（这会导致程序逻辑难以理解），但是在这个脚本中倒没什么问题。\n\n**本章重要表格**：表 28-1 read 选项（按原文还原）\n\n| 选项             | 描述                                               |\n| -------------- | ------------------------------------------------ |\n| `-a array`     | 将输入分配给数组（从索引 0 开始）。我们会在第 35 章介绍数组                |\n| `-d delimiter` | 将字符串 `delimiter` 中的第一个字符（而非换行符）作为输入的结束           |\n| `-e`           | 使用 Readline 处理输入。这允许使用和命令行相同的方式编辑输入              |\n| `-i string`    | 如果用户直接按 Enter 键，使用 `string` 作为默认值。需要配合 `-e` 选项使用 |\n| `-n num`       | 从输入中读取 `num` 个字符，而非读取一整行                         |\n y.\" \u003e\u00262"],["cmd","exit 1"],["cmd","fi"]],"multi":false},{"id":228,"key":"语法卡片：输入验证","cmd":"语法卡片：输入验证（read-validate）","plain":"语法卡片：输入验证（read-validate）","desc":"","descShort":"","detail":"在程序接收到输入之后逐项检查，过滤掉空值、多项输入、非法文件名、非法数值，只对有效输入做进一步处理。","chapter":"第28章","cno":28,"chapterTitle":"读取键盘输入","chapters":["第28章"],"part":"四·Shell 脚本","partNo":4,"cats":["㉓ 其他卡片（书中项目脚本与专题）"],"core":false,"idxChapters":"","kind":"cmd","syntax":"invalid_input () {\n          echo \"Invalid input '$REPLY'\" \u003e\u00262\n          exit 1\n    }","syntaxNote":"- 定义无效处理函数：\n    \n  - 读入一行：`read -p \"Enter a single item \u003e \"`\n  - 输入为空（无效）：`[[ -z \"$REPLY\" ]] \u0026\u0026 invalid_input`\n  - 输入是多个项目（无效）：`(( \"$(echo \"$REPLY\" | wc -w)\" \u003e 1 )) \u0026\u0026 invalid_input`\n  - 文件名是否有效：`[[ \"$REPLY\" =~ ^[-[:alnum:]\\._]+$ ]]`\n  - 是否浮点数：`[[ \"$REPLY\" =~ ^-?[[:digit:]]*\\.[[:digit:]]+$ ]]`\n  - 是否整数：`[[ \"$REPLY\" =~ ^-?[[:digit:]]+$ ]]`","options":[],"optTitle":"","examples":["  #!/bin/bash\n\n  # read-validate: 验证输入\n\n  invalid_input () {\n        echo \"Invalid input '$REPLY'\" \u003e\u00262\n        exit 1\n  }\n\n  read -p \"Enter a single item \u003e \"\n\n  # 输入为空（无效）\n  [[ -z \"$REPLY\" ]] \u0026\u0026 invalid_input\n\n  # 输入是多个项目（无效）\n  (( \"$(echo \"$REPLY\" | wc -w)\" \u003e 1 )) \u0026\u0026 invalid_input\n\n  # 输入的文件名是否有效\n  if [[ \"$REPLY\" =~ ^[-[:alnum:]\\._]+$ ]]; then\n        echo \"'$REPLY' is a valid filename.\"\n        if [[ -e \"$REPLY\" ]]; then\n              echo \"And file '$REPLY' exists.\"\n        else\n              echo \"However, file '$REPLY' does not exist.\"\n        fi\n\n        # 输入是否为浮点数\n        if [[ \"$REPLY\" =~ ^-?[[:digit:]]*\\.[[:digit:]]+$ ]]; then\n              echo \"'$REPLY' is a floating point number.\"\n        else\n              echo \"'$REPLY' is not a floating point number.\"\n        fi\n\n        # 输入是否为整数\n        if [[ \"$REPLY\" =~ ^-?[[:digit:]]+$ ]]; then\n              echo \"'$REPLY' is an integer.\"\n
