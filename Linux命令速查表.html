<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linux 命令速查表 · 《Linux 命令行大全（第2版）》新手精编</title>
<style>
:root{
  --bg:#f1f4f8; --panel:#ffffff; --panel2:#f8fafc; --line:#e2e8f0; --line2:#eef2f7;
  --text:#131a24; --text2:#3d4a5c; --muted:#6b7a8f; --faint:#9aa8b9;
  --accent:#1465d8; --accent-bg:#eaf2fe; --accent-line:#c3dafb;
  --teal:#0d8a76; --amber:#a2620a; --red:#c2293a;
  --term-bg:#fbfcfe; --term-line:#eaeff5; --term-text:#1b2430;
  --term-prompt:#0d8a76; --term-path:#1465d8; --term-cmt:#94a3b5; --term-err:#c2293a;
  --shadow:0 1px 2px rgba(16,32,64,.05),0 8px 24px -12px rgba(16,32,64,.18);
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
html[data-term="dark"]{
  --term-bg:#0f1419; --term-line:#1d2530; --term-text:#dfe7ef;
  --term-prompt:#4ec9a0; --term-path:#6cb6ff; --term-cmt:#6b7a8c; --term-err:#ff7b72;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);
  font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:8px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#a9b7c8;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
code,kbd{font-family:var(--mono);font-size:.92em}
mark{background:#ffe9a8;color:inherit;border-radius:3px;padding:0 2px}

/* ---------- 布局 ---------- */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);height:100vh}
.top{grid-column:1/-1;display:flex;align-items:center;gap:18px;padding:12px 20px;
  background:var(--panel);border-bottom:1px solid var(--line);z-index:20}
.brand{display:flex;align-items:center;gap:11px;flex-shrink:0}
.brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(140deg,#1f7ae0,#0d8a76);
  display:grid;place-items:center;color:#fff;font-size:17px;font-weight:700;font-family:var(--mono)}
.brand h1{margin:0;font-size:15px;font-weight:650;letter-spacing:-.2px;white-space:nowrap}
.brand p{margin:1px 0 0;font-size:11.5px;color:var(--muted)}
.searchwrap{flex:1;max-width:520px;position:relative}
.searchwrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--faint)}
#q{width:100%;padding:9px 78px 9px 34px;border:1px solid var(--line);border-radius:9px;
  background:var(--panel2);color:var(--text);font-size:13.5px;font-family:var(--sans);outline:none;transition:.15s}
#q:focus{background:#fff;border-color:var(--accent-line);box-shadow:0 0 0 3px rgba(20,101,216,.09)}
#q::placeholder{color:var(--faint)}
.kbd-hint{position:absolute;right:9px;top:50%;transform:translateY(-50%);display:flex;gap:4px;pointer-events:none}
.kbd-hint span{font-family:var(--mono);font-size:10.5px;color:var(--muted);background:#fff;
  border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 5px}
.stats{display:flex;gap:6px;flex-shrink:0;margin-left:auto}
.stat{text-align:right;padding:0 12px;border-left:1px solid var(--line2)}
.stat b{display:block;font-size:15px;font-weight:650;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.stat i{font-style:normal;font-size:10.5px;color:var(--muted)}

/* ---------- 侧栏 ---------- */
.side{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:14px 12px 40px}
.side h3{margin:16px 8px 7px;font-size:10.5px;font-weight:650;letter-spacing:.09em;
  text-transform:uppercase;color:var(--faint)}
.side h3:first-child{margin-top:2px}
.nav{display:flex;flex-direction:column;gap:1px}
.nav button{display:flex;align-items:center;gap:8px;width:100%;padding:6px 9px;border:0;border-radius:7px;
  background:transparent;color:var(--text2);font:inherit;font-size:12.5px;text-align:left;cursor:pointer;transition:.12s}
.nav button:hover{background:var(--panel2);color:var(--text)}
.nav button.on{background:var(--accent-bg);color:var(--accent);font-weight:600}
.nav button .n{margin-left:auto;font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.nav button.on .n{color:var(--accent);opacity:.75}
.nav button .ic{width:16px;text-align:center;font-size:12px;flex-shrink:0}
.side .divider{height:1px;background:var(--line2);margin:12px 8px}
.chgroup{margin-bottom:3px}
.chgroup>span{display:block;margin:9px 8px 4px;font-size:10.5px;color:var(--faint);letter-spacing:.03em}

/* ---------- 主区 ---------- */
.main{overflow-y:auto;position:relative}
.toolbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  padding:11px 20px;background:rgba(241,244,248,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.chip{padding:5px 11px;border:1px solid var(--line);border-radius:999px;background:var(--panel);
  color:var(--text2);font:inherit;font-size:12px;cursor:pointer;transition:.13s;white-space:nowrap}
.chip:hover{border-color:#c6d3e2;color:var(--text)}
.chip.on{background:var(--text);border-color:var(--text);color:#fff;font-weight:550}
.chip .n{opacity:.6;margin-left:3px;font-variant-numeric:tabular-nums}
.sel{padding:5px 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel);
  color:var(--text2);font:inherit;font-size:12px;cursor:pointer;outline:none}
.count{margin-left:auto;font-size:12px;color:var(--muted)}
.count b{color:var(--text);font-variant-numeric:tabular-nums}

.tblwrap{padding:14px 20px 60px}
table{width:100%;border-collapse:separate;border-spacing:0;background:var(--panel);
  border:1px solid var(--line);border-radius:11px;overflow:hidden;box-shadow:var(--shadow)}
thead th{position:sticky;top:0;z-index:5;background:var(--panel2);padding:9px 12px;text-align:left;
  font-size:11px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);
  border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr{cursor:pointer;transition:background .1s}
tbody tr:hover{background:#f6faff}
tbody tr.sel{background:var(--accent-bg)}
tbody tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
tbody td{padding:8px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
td.c-cmd{width:1%;white-space:nowrap}
td.c-cmd code{display:inline-block;padding:2px 8px;border-radius:6px;background:#eef3f9;
  border:1px solid #e0e8f2;color:#0b57a4;font-weight:600;font-size:13px}
tr.sel td.c-cmd code{background:#fff;border-color:var(--accent-line)}
td.c-desc{color:var(--text2);font-size:13px}
td.c-cat{width:1%;white-space:nowrap}
.tag{display:inline-block;padding:1.5px 8px;border-radius:6px;background:var(--panel2);
  border:1px solid var(--line2);color:var(--muted);font-size:11px;white-space:nowrap}
td.c-ch{width:1%;white-space:nowrap;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
td.c-fl{width:1%;white-space:nowrap;text-align:right;padding-right:14px}
.bdg{display:inline-flex;align-items:center;gap:3px;padding:1px 6px;border-radius:5px;font-size:10.5px;
  font-weight:600;margin-left:5px;vertical-align:1px}
.bdg.t{background:#e6f7f2;color:#0a7360;border:1px solid #bfe9dd}
.bdg.o{background:#fdf3e3;color:#8a5406;border:1px solid #f6e0bd}
.bdg.c{background:#eaf2fe;color:#0b57a4;border:1px solid #cfe0fa}
.chev{color:#c2ccd9;font-size:15px;line-height:1}
.kind{display:inline-block;margin-left:6px;padding:1px 5px;border-radius:5px;font-size:10px;
  font-family:var(--sans);font-weight:600;background:#f1f0fb;color:#5b56b8;border:1px solid #e2e0f7;vertical-align:1.5px}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}

/* ---------- 抽屉 ---------- */
.backdrop{position:fixed;inset:0;background:rgba(19,26,36,.32);opacity:0;pointer-events:none;
  transition:.22s;z-index:40;backdrop-filter:blur(2px)}
.backdrop.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,94vw);background:var(--panel);
  border-left:1px solid var(--line);box-shadow:-24px 0 60px -20px rgba(16,32,64,.35);
  transform:translateX(102%);transition:transform .26s cubic-bezier(.32,.72,.28,1);
  z-index:41;display:flex;flex-direction:column}
.drawer.on{transform:none}
.dw-head{padding:16px 20px 13px;border-bottom:1px solid var(--line);position:relative;flex-shrink:0}
.dw-head .row1{display:flex;align-items:center;gap:10px;padding-right:34px;flex-wrap:wrap}
.dw-head h2{margin:0;font-family:var(--mono);font-size:19px;font-weight:650;letter-spacing:-.3px;color:#0b57a4}
.dw-head .sum{margin:7px 0 0;color:var(--text2);font-size:13px}
.dw-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.xbtn{position:absolute;top:14px;right:16px;width:28px;height:28px;border:1px solid var(--line);
  border-radius:8px;background:var(--panel);color:var(--muted);cursor:pointer;font-size:14px;line-height:1;
  display:grid;place-items:center;transition:.13s}
.xbtn:hover{background:var(--panel2);color:var(--text)}
.tabs{display:flex;gap:3px;padding:9px 16px 0;border-bottom:1px solid var(--line);flex-shrink:0;background:var(--panel)}
.tabs button{padding:7px 13px 9px;border:0;background:transparent;font:inherit;font-size:13px;color:var(--muted);
  cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:.13s;border-radius:6px 6px 0 0}
.tabs button:hover{color:var(--text);background:var(--panel2)}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.dw-body{flex:1;overflow-y:auto;padding:17px 20px 60px}
.sec{margin-bottom:20px}
.sec:last-child{margin-bottom:0}
.sec>h4{margin:0 0 8px;font-size:11px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;
  color:var(--faint);display:flex;align-items:center;gap:7px}
.sec>h4:after{content:"";flex:1;height:1px;background:var(--line2)}
.prose{color:var(--text2);font-size:13.5px;line-height:1.75}
.prose code{background:#eef3f9;border:1px solid #e4ebf4;border-radius:5px;padding:.5px 5px;color:#0b57a4;font-size:.9em}
.synbox code{background:#fff;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:#0b4f96;font-size:.93em}
.prose strong{color:var(--text);font-weight:650}
.synbox{border:1px solid var(--line);border-radius:9px;background:var(--panel2);overflow:hidden}
.synbox pre{margin:0;padding:11px 13px;font-family:var(--mono);font-size:12.5px;color:#0b4f96;
  white-space:pre-wrap;word-break:break-word;line-height:1.65}
.opts{display:flex;flex-direction:column;gap:1px;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.opt{display:grid;grid-template-columns:auto 1fr;gap:11px;padding:8px 12px;background:var(--panel);align-items:baseline}
.opt+.opt{border-top:1px solid var(--line2)}
.opt .f{font-family:var(--mono);font-size:12px;font-weight:650;color:#8a5406;background:#fdf6e9;
  border:1px solid #f4e3c4;border-radius:5px;padding:1.5px 7px;white-space:nowrap}
.opt .d{color:var(--text2);font-size:12.5px;line-height:1.6}
.opt .d code{background:#eef3f9;border:1px solid #e4ebf4;border-radius:4px;padding:0 4px;color:#0b57a4}
.codebox{border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:9px;background:var(--panel2)}
.codebar{display:flex;align-items:center;gap:8px;padding:5px 8px 5px 11px;background:var(--panel2);
  border-bottom:1px solid var(--line)}
.codebar .ttl{font-size:11px;color:var(--muted);font-family:var(--mono);flex:1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{padding:3px 9px;border:1px solid #d6dfe9;border-radius:6px;background:#fff;
  color:var(--text2);font:inherit;font-size:11.5px;cursor:pointer;transition:.13s;white-space:nowrap;
  box-shadow:0 1px 1px rgba(16,32,64,.04)}
.mini:hover{border-color:var(--accent-line);color:var(--accent);background:var(--accent-bg)}
.mini.on{background:var(--text);border-color:var(--text);color:#fff}
.codebox pre{margin:0;padding:11px 13px;font-family:var(--mono);font-size:12.5px;line-height:1.7;
  color:var(--text);overflow-x:auto;white-space:pre}
.codebox pre .cm{color:#93a1b3}
.codebox pre .hl{color:#0b57a4;font-weight:600}
.cmds .codebox pre{white-space:pre-wrap;word-break:break-all}

/* ---------- 终端 ---------- */
.term{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--term-bg);
  box-shadow:0 1px 2px rgba(16,32,64,.04)}
.term-bar{display:flex;align-items:center;gap:7px;padding:7px 9px;background:var(--panel2);
  border-bottom:1px solid var(--line)}
.term-bar .dots{display:flex;gap:5px;margin-right:3px}
.term-bar .dots i{width:9px;height:9px;border-radius:50%;background:#dfe5ec;display:block}
.term-bar .dots i:nth-child(1){background:#f0b8b3}
.term-bar .dots i:nth-child(2){background:#f4dda6}
.term-bar .dots i:nth-child(3){background:#b6ddc4}
.term-bar .ttl{font-family:var(--mono);font-size:11.5px;color:var(--muted);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;flex:1}
.term-body{margin:0;padding:13px 14px;font-family:var(--mono);font-size:12.5px;line-height:1.75;
  color:var(--term-text);min-height:120px;max-height:440px;overflow:auto;white-space:pre-wrap;
  word-break:break-all;background:var(--term-bg)}
.term-body .ln{display:block;min-height:1.75em}
.term-body .pr{color:var(--term-prompt);font-weight:600}
.term-body .pt{color:var(--term-path);font-weight:600}
.term-body .c{color:#141c26;font-weight:600}
.term-body .o{color:var(--term-text)}
.term-body .m{color:var(--term-cmt)}
.term-body .e{color:var(--term-err)}
.term-body .cursor{display:inline-block;width:7.5px;height:14px;background:var(--term-prompt);
  vertical-align:-2px;animation:bl 1s steps(2,start) infinite}
@keyframes bl{to{visibility:hidden}}
.term-note{margin:9px 0 0;font-size:11.5px;color:var(--faint)}

.relchips{display:flex;flex-wrap:wrap;gap:6px}
.relchips button{padding:3.5px 10px;border:1px solid var(--line);border-radius:999px;background:var(--panel);
  font-family:var(--mono);font-size:11.5px;color:var(--text2);cursor:pointer;transition:.13s}
.relchips button:hover{border-color:var(--accent-line);background:var(--accent-bg);color:var(--accent)}
.tipbox{border-left:3px solid #f0c36d;background:#fffbf2;border-radius:0 9px 9px 0;
  padding:10px 13px;color:#6b4c0e;font-size:13px;line-height:1.72}
.tipbox+.tipbox{margin-top:8px}
.tipbox code{background:#fdf3dd;border:1px solid #f2e0b8;border-radius:4px;padding:0 4px;color:#8a5406}
.tipbox strong{color:#5a3d05}
.warnbox{border-left:3px solid #e79a9a;background:#fff6f6;border-radius:0 9px 9px 0;
  padding:10px 13px;color:#8a2735;font-size:13px;line-height:1.72}
.empty2{color:var(--faint);font-size:13px;padding:6px 0}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,18px);background:var(--text);color:#fff;
  padding:8px 16px;border-radius:9px;font-size:12.5px;opacity:0;pointer-events:none;transition:.2s;z-index:60}
.toast.on{opacity:1;transform:translate(-50%,0)}
.foot{padding:0 20px 40px;color:var(--faint);font-size:11.5px;line-height:1.9}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.stats{display:none}}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand">
      <div class="logo">&gt;_</div>
      <div>
        <h1>Linux 命令速查表</h1>
        <p>《Linux 命令行大全（第2版）》新手精编 · 点击任意命令看用法与运行效果</p>
      </div>
    </div>
    <div class="searchwrap">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
        stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" placeholder="搜命令、作用或分类，如 grep / 压缩 / 权限" autocomplete="off" spellcheck="false">
      <div class="kbd-hint"><span>/</span></div>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <aside class="side" id="side"></aside>

  <main class="main" id="main">
    <div class="toolbar">
      <button class="chip on" data-f="all">全部</button>
      <button class="chip" data-f="core">附录 A 核心命令</button>
      <button class="chip" data-f="route">3 小时上手路线</button>
      <button class="chip" data-f="demo">有终端演示</button>
      <button class="chip" data-f="opts">有选项表</button>
      <span style="width:1px;height:20px;background:var(--line);margin:0 3px"></span>
      <select class="sel" id="sortby">
        <option value="ch">按章节顺序</option>
        <option value="az">按命令名 A→Z</option>
        <option value="cat">按用途分类</option>
      </select>
      <div class="count" id="count"></div>
    </div>
    <div class="tblwrap">
      <table>
        <thead><tr>
          <th>命令</th><th>一句话作用</th><th>用途</th><th>详解</th><th style="text-align:right;padding-right:18px">补充</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="empty" id="empty" style="display:none">没有匹配的命令，换个关键词试试。</div>
      <div class="foot" id="foot"></div>
    </div>
  </main>
</div>

<div class="backdrop" id="bd"></div>
<aside class="drawer" id="drawer"></aside>

<script>

\n| `-A, --almost-all`     | 与 `-a` 选项类似，但不列出 `.`（当前工作目录）和 `..`（父目录）                                  |\n| `-d, --directory`      | 通常，如果指定了目录，`ls` 命令会列出该目录中的内容而非目录本身。将此选项与 `-l` 选项结合使用，可查看目录的详细信息，而不是其中的内容 |\n| `-F, --classify`       | 该选项会在每个列出的名称后面加上类型指示符。例如，如果是目录名，则在其后加上一个 `/`                             |\n| `-h, --human-readable` | 在长格式的输出结果中，不再以字节（B）为单位，而是以人类可读的形式（human-readable）显示文件大小                  |\n| `-l`                   | 以长格式显示输出结果                                                               |\n| `-r, --reverse`        | 以降序显示输出结果。通常情况下，`ls` 命令按照字母升序显示输出结果                                      |\n| `-S`                   | 按照文件大小排序输出结果                                                             |\n| `-t`                   | 按照修改日期排序输出结果                                                             |\n\n表 3-2 其中一个文件的不同字段及其含义\n\n| 字段                 | 含义                                                                                                                          |\n| ------------------ | --------------------------------------------------------------------------------------------------------------------------- |\n| `-rw-r--r--`       | 文件访问权限。第一个字符指明了文件类型。其中，开头的连字符（`-`）表示普通文件，`d` 表示目录。接下来的 3 个字符表示文件属主的访问权限，后续的 3 个字符表示文件属组的访问权限，最后 3 个字符表示其他人的访问权限。详细解释参见第 9 章 |\n| `1`                | 文件的硬链接数量。参见 3.4 节和 3.5 节                                                                                                    |\n| `root`             | 文件属主                                                                                                                        |\n| `root`             | 文件属组                                                                                                                        |\n| `32059`            | 文件大小（字节数）                                                                                                                   |\n| `2017-04-03 11:05` | 文件最后的修改日期和时间                                                                                                                |\n| `oo-cd-cover.odf`  | 文件名                                                                                                                         |\n\n表 3-3 `less` 命令\n\n| 命令                 | 操作         |\n| ------------------ | ---------- |\n| 上翻页键（Page Up）或 `b` | 后翻一页       |\n| 下翻页键（Page Down）或空格 | 前翻一页       |\n| 上方向键               | 向后一行       |\n| 下方向键               | 向前一行       |\n| `G`                | 移动到文本文件末尾  |\n| `1G` 或 `g`         | 移动到文本文件开头  |\n| `/characters`      | 向前搜索指定的字符串 |\n| `n`                | 重复上一次搜索    |\n| `h`                | 显示帮助信息     |\n| `q`                | 退出 less 命令 |\n\n表 3-4 Linux 系统中的目录\n\n| 目录               | 注释                                                                                                                                                                     |\n| ---------------- | ---------------------------------------------------------------------------------------------------------------------------------------------------------------------- |\n| `/`              | 根目录，所有目录皆源于此                                                                                                                                                           |\n| `/bin`           | 包含系统引导和执行所必需的二进制可执行文件（程序）                                                                                                                                              |\n| `/boot`          | 包含 Linux 内核、初始化 RAM 磁盘镜像（供引导期间所需的驱动程序使用），以及引导装载器。值得注意的文件包括用于配置引导装载器的 `/boot/grub/grub.conf`（或者 `menu.lst`）和 Linux 内核的 `/boot/vmlinuz`（或者类似的文件）                         |\n| `/dev`           | 包含设备节点的特殊目录。\"万物皆文件\"同样适用于设备。Linux 内核在其中维护着能够识别的全部设备                                                                                                                     |\n| `/etc`           | 包含系统范围的所有配置文件，另外还包含一组用于在引导期间启动各个系统服务的 Shell 脚本。该目录中的所有文件都应该是可读的文本文件。其中绝对不能错过的有：`/etc/crontab`（定义了何时执行自动化作业）、`/etc/fstab`（指定了存储设备及其关联的挂载点）、`/etc/passwd`（包含了系统中所有的用户信息） |\n| `/home`          | 在正常配置中，每个用户在 `/home` 中都有各自的目录。普通用户仅对自己的主目录中的文件有写权限。这一限制可以保护系统免遭用户错误行为的破坏                                                                                               |\n| `/lib`           | 包含系统核心程序用到的共享库文件。类似于 Windows 中的动态链接库（DLL）                                                                                                                              |\n| `/lost+found`    | 每个采用 Linux 文件系统（例如 ext3）格式化过的分区或设备都会包含该目录。它用于文件系统损坏时的部分恢复。除非系统发生了严重问题，否则这个目录总是空的                                                                                       |\n| `/media`         | 在现代 Linux 系统中，`/media` 目录包含各种可移动存储设备（例如 USB 设备、CD-ROM 等）的挂载点，这些设备在插入时会自动挂载                                                                                             |\n| `/mnt`           | 在先前的 Linux 系统中，`/mnt` 目录包含手动挂载的各种可移动存储设备的挂载点                                                                                                                           |\n| `/opt`           | 用于安装\"可选\"软件，主要存放系统中可能安装的商业软件                                                                                                                                            |\n| `/proc`          | 这是一个特殊目录。它并非存在于硬盘上的真实文件系统，而是由 Linux 内核维护的虚拟文件系统。该目录中包含的文件就像是内核的窥视孔。这些文件都是可读的，你可以从中了解到内核是如何管理计算机的                                                                       |\n| `/root`          | 超级用户的主目录                                                                                                                                                               |\n| `/sbin`          | 包含\"系统\"二进制可执行文件。这些文件负责执行重要的系统任务，通常保留给超级用户使用                                                                                                                             |\n| `/tmp`           | 用于保存各种程序生成的临时文件。有些配置会使该目录在每次系统重新引导时都被清空                                                                                                                                |\n| `/usr`           | `/usr` 可能是 Linux 系统中最大的目录树。其中包含了普通用户用到的所有程序和支持文件                                                                                                                       |\n| `/usr/bin`       | 包含了 Linux 发行版安装的程序，其数量有几千                                                                                                                                              |\n| `/usr/lib`       | `/usr/bin` 中的程序要用到的共享库                                                                                                                                                 |\n| `/usr/local`     | 包含的程序并非 Linux 发行版自带的，但是计划在系统范围内使用。通过源代码编译生成的程序通常安装在 `/usr/local/bin`。在刚安装好的 Linux 系统中，该目录树存在，但却是空的，直到超级用户向其中添加内容                                                       |\n| `/usr/sbin`      | 包含更多系统管理工具                                                                                                                                                             |\n| `/usr/share`     | 包含 `/usr/bin` 中的程序用到的共享数据。其中包括默认的配置文件、图标、桌面背景、声音文件等                                                                                                                    |\n| `/usr/share/doc` | 系统中安装的大部分软件包自带文档。在该目录中，文档文件是按照软件包来分类组织的                                                                                                                                |\n| `/var`           | 除 `/tmp` 和 `/home` 目录之外，到目前位置看到的目录都是相对静态的；也就是说，目录不怎么发生变化。那些可能会改变的数据保存在 `/var` 目录树中。各种数据库、假脱机文件、用户邮件等都在其中                                                               |\n| `/var/log`       | 包含日志文件、各种系统活动记录。这些文件非常重要，应该被随时监控。其中较有用的是 `/var/log/messages` 和 `/var/log/syslog`。注意，出于安全考虑，在有些系统中，只有超级用户才能查看日志文件                                                       |\n\n**本章要点速记**：\n\n1. 命令的通用形式是 `command -options arguments`；短选项用 `-`，长选项用 `--`，短选项可以串写（`-lt`），选项区分大小写。\n2. `ls -l` 长格式从左到右依次是：权限、硬链接数、属主、属组、大小、修改时间、文件名；权限串第一个字符是 `-` 表示普通文件、`d` 表示目录。\n3. 文件名不保证能反映内容，用 `file` 判断；Linux 世界里\"万物皆文件\"。\n4. `less` 用来翻阅文本文件，`q` 退出；误看了非文本文件导致乱码，用 `reset` 救场。\n5. 目录树有固定分工：`/etc` 放配置、`/home` 放各用户主目录、`/bin`、`/usr/bin` 放程序、`/var/log` 放日志。\n6. 名字以 `l` 开头的条目是符号链接，它让一个文件可以被多个名称引用，方便版本升级切换。\n\n---\n\n---","tips":["more 程序只允许向前翻页，less 可以前后翻页，另外还具有很多其他特性。\n\n**本章重要表格**：\n\n表 3-1 常用的 `ls` 命令选项\n\n| 选项                     | 描述                                                                       |\n| ---------------------- | ------------------------------------------------------------------------ |\n| `-a, --all`            | 列出所有文件，包括以点号开头的文件在内，这种文件通常不会被列出（隐藏文件）                                    |\n| `-A, --almost-all`     | 与 `-a` 选项类似，但不列出 `.`（当前工作目录）和 `..`（父目录）                                  |\n| `-d, --directory`      | 通常，如果指定了目录，`ls` 命令会列出该目录中的内容而非目录本身。将此选项与 `-l` 选项结合使用，可查看目录的详细信息，而不是其中的内容 |\n| `-F, --classify`       | 该选项会在每个列出的名称后面加上类型指示符。例如，如果是目录名，则在其后加上一个 `/`                             |\n| `-h, --human-readable` | 在长格式的输出结果中，不再以字节（B）为单位，而是以人类可读的形式（human-readable）显示文件大小                  |\n| `-l`                   | 以长格式显示输出结果                                                               |\n| `-r, --reverse`        | 以降序显示输出结果。通常情况下，`ls` 命令按照字母升序显示输出结果                                      |\n| `-S`                   | 按照文件大小排序输出结果                                                             |\n| `-t`                   | 按照修改日期排序输出结果                                                             |\n\n表 3-2 其中一个文件的不同字段及其含义\n\n| 字段                 | 含义                                                                                                                          |\n| ------------------ | --------------------------------------------------------------------------------------------------------------------------- |\n| `-rw-r--r--`       | 文件访问权限。第一个字符指明了文件类型。其中，开头的连字符（`-`）表示普通文件，`d` 表示目录。接下来的 3 个字符表示文件属主的访问权限，后续的 3 个字符表示文件属组的访问权限，最后 3 个字符表示其他人的访问权限。详细解释参见第 9 章 |\n| `1`                | 文件的硬链接数量。参见 3.4 节和 3.5 节                                                                                                    |\n| `root`             | 文件属主                                             |\n| `/sbin`          | 包含\"系统\"二进制可执行文件。这些文件负责执行重要的系统任务，通常保留给超级用户使用                                                                                                                             |\n| `/tmp`           | 用于保存各种程序生成的临时文件。有些配置会使该目录在每次系统重新引导时都被清空                                                                                                                                |\n| `/usr`           | `/usr` 可能是 Linux 系统中最大的目录树。其中包含了普通用户用到的所有程序和支持文件                                                                                                                       |\n| `/usr/bin`       | 包含了 Linux 发行版安装的程序，其数量有几千                                                                                                                                              |\n| `/usr/lib`       | `/usr/bin` 中的程序要用到的共享库                                                                                                                                                 |\n| `/usr/local`     | 包含的程序并非 Linux 发行版自带的，但是计划在系统范围内使用。通过源代码编译生成的程序通常安装在 `/usr/local/bin`。在刚安装好的 Linux 系统中，该目录树存在，但却是空的，直到超级用户向其中添加内容                                                       |\n| `/usr/sbin`      | 包含更多系统管理工具                                                                                                                                                             |\n| `/usr/share`     | 包含 `/usr/bin` 中的程序用到的共享数据。其中包括默认的配置文件、图标、桌面背景、声音文件等                                                                                                                    |\n| `/usr/share/doc` | 系统中安装的大部分软件包自带文档。在该目录中，文档文件是按照软件包来分类组织的                                                                                                                                |\n| `/var`           | 除 `/tmp` 和 `/home` 目录之外，到目前位置看到的目录都是相对静态的；也就是说，目录不怎么发生变化。那些可能会改变的数据保存在 `/var` 目录树中。各种数据库、假脱机文件、用户邮件等都在其中                                                               |\n| `/var/log`       | 包含日志文件、各种系统活动记录。这些文件非常重要，应该被随时监控。其中较有用的是 `/var/log/messages` 和 `/var/log/syslog`。注意，出于安全考虑，在有些系统中，只有超级用户才能查看日志文件                                                       |\n\n**本章要点速记**：\n\n1. 命令的通用形式是 `command -options arguments`；短选项用 `-`，长选项用 `--`，短选项可以串写（`-lt`），选项区分大小写。\n2. `ls -l` 长格式从左到右依次是：权限、硬链接数、属主、属组、大小、修改时间、文件名；权限串第一个字符是 `-` 表示普通文件、`d` 表示目录。\n3. 文件名不保证能反映内容，用 `file` 判断；Linux 世界里\"万物皆文件\"。\n4. `less` 用来翻阅文本文件，`q` 退出；误看了非文本文件导致乱码，用 `reset` 救场。\n5. 目录树有固定分工：`/etc` 放配置、`/home` 放各用户主目录、`/bin`、`/usr/bin` 放程序、`/var/log` 放日志。\n6. 名字以 `l` 开头的条目是符号链接，它让一个文件可以被多个名称引用，方便版本升级切换。\n\n---\n\n---"],"relTips":[],"demo":[["cmd","more /etc/passwd"],["cmt","# 只能向前翻页（按空格），到末尾会自动退出；不如 less 好用"]],"multi":false},{"id":11,"key":"reset","cmd":"reset","plain":"reset","desc":"让混乱的终端恢复正常","descShort":"让混乱的终端恢复正常","detail":"如果不小心用 less 查看了非文本文件，终端窗口中会充斥着混乱的字符，此时输入 `reset` 命令可以恢复正常。","chapter":"第3章","cno":3,"chapterTitle":"探索 Linux 系统","chapters":["第3章"],"part":"一·学习 Shell","partNo":1,"cats":["① 导航与查看目录"],"core":true,"idxChapters":"第3章","kind":"cmd","syntax":"reset","syntaxNote":"","options":[],"optTitle":"","examples":["  reset"],"tip":"这是原文\"按图索骥\"专栏里的提醒，专门用于误看二进制文件之后的救场。","tips":["这是原文\"按图索骥\"专栏里的提醒，专门用于误看二进制文件之后的救场。"],"relTips":[],"demo":[["cmd","cat /bin/bash"],["err","        �ELF\u0002\u0001\u0001        @@  8\n…终端被二进制内容搅乱了，屏幕全是乱码…"],["cmd","reset"],["cmt","# 终端恢复正常（实在不行还可以试 stty sane）"]],"multi":false},{"id":12,"key":"cp","cmd":"cp","plain":"cp","desc":"复制文件和目录","descShort":"复制文件和目录","detail":"复制文件。本章用它给 `.bashrc` 做备份。","chapter":"第4章","cno":4,"chapterTitle":"操作文件和目录","chapters":["第4章","第11章"],"part":"一·学习 Shell","partNo":1,"cats":["② 文件与目录操作"],"core":true,"idxChapters":"第4章、第11章","kind":"cmd","syntax":"两种用法——\n  - `cp item1 item2`：将单个文件或目录 `item1` 复制到文件或目录 `item2`\n  - `cp item... directory`：将多个文件或目录 `item` 复制到目录 `directory` 中","syntaxNote":"","options":[{"flag":"cp item1 item2","desc":"将单个文件或目录 `item1` 复制到文件或目录 `item2`"},{"flag":"cp item... directory","desc":"将多个文件或目录 `item` 复制到目录 `directory` 中"},{"flag":"-a, --archive","desc":"复制文件和目录及其包括所有权与权限在内的所有属性。在通常情况下，副本采用执行复制操作的用户的默认属性。我们会在第 9 章讨论文件所有权"},{"flag":"-i, --interactive","desc":"在覆盖已有文件之前，提示用户确认。如果未指定该选项，`cp` 命令会悄无声息地（也就是不发出任何警告）覆盖文件"},{"flag":"-r, --recursive","desc":"递归复制目录及其内容。在复制目录时，要用到该选项（或者 `-a` 选项）"},{"flag":"-u, --update","desc":"在将文件从一个目录复制到目标目录时，只复制目标目录中不存在或比目标目录中现有文件更新的文件。该选项在复制大批量文件时很实用，因为它能够跳过那些不必复制的文件"},{"flag":"-v, --verbose","desc":"在进行复制时显示相关信息"}],"optTitle":"","examples":["  cp -u *.html destination        # 本章开头展示\"复杂任务很简单\"的例子\n\n  cp file1 file2                  # 复制为 file2；若 file2 已存在则用 file1 内容覆盖，不存在则创建\n  cp -i file1 file2               # 同上，但 file2 存在时覆盖前会提示\n  cp file1 file2 dir1             # 把 file1、file2 复制到目录 dir1（dir1 必须事先存在）\n  cp dir1/* dir2                  # 用通配符把 dir1 中所有文件复制到 dir2（dir2 必须事先存在）\n  cp -r dir1 dir2                 # 递归复制目录\n\n  # 实战演练\n  cp /etc/passwd .                # 把 /etc/passwd 复制到当前工作目录（末尾的 . 是当前目录的便捷写法）\n  cp -v /etc/passwd .             # 显示 '/etc/passwd' -\u003e './passwd'\n  cp -i /etc/passwd .             # 提示 cp: overwrite './passwd'?","  cp .bashrc .bashrc.bak"],"tip":"不加 `-i` 时 `cp` 会悄无声息地覆盖同名文件，它假定用户知道自己正在做什么。在覆盖提示后输入 `y` 会使文件被覆盖，其他字符（如 `n`）会使 `cp` 命令保留同名文件。","tips":["不加 `-i` 时 `cp` 会悄无声息地覆盖同名文件，它假定用户知道自己正在做什么。在覆盖提示后输入 `y` 会使文件被覆盖，其他字符（如 `n`）会使 `cp` 命令保留同名文件。","**`cp` 命令会悄无声息地覆盖已有的同名文件。** 备份文件用什么名称并不重要，挑一个通俗易懂的就行，`.bak`、`.sav`、`.old`、`.orig` 都是常见的备份文件扩展名。"],"relTips":[],"demo":[["cmd","cp file1 file2"],["cmt","# 复制成 file2；file2 已存在则被静默覆盖"],["cmd","cp -i file1 file2"],["out","cp: overwrite 'file2'? y"],["cmd","cp file1 file2 dir1"],["cmd","cp -r dir1 dir2"],["cmt","# 复制目录必须加 -r 或 -a"],["cmd","cp -v /etc/passwd ."],["out","'/etc/passwd' -\u003e './passwd'"],["cmd","cp -u *.html destination"],["cmt","# 只复制目标里不存在、或更新的文件"]],"multi":true},{"id":13,"key":"ln","cmd":"ln","plain":"ln","desc":"创建硬链接和符号链接","descShort":"创建硬链接和符号链接","detail":"创建硬链接或符号链接。","chapter":"第4章","cno":4,"chapterTitle":"操作文件和目录","chapters":["第4章"],"part":"一·学习 Shell","partNo":1,"cats":["② 文件与目录操作"],"core":true,"idxChapters":"第4章","kind":"cmd","syntax":"- 创建硬链接：`ln file link`\n  - 创建符号链接：`ln -s item link`（`item` 可以是文件或目录）","syntaxNote":"","options":[],"optTitle":"","examples":["  # 硬链接\n  ln fun fun-hard\n  ln fun dir1/fun-hard\n  ln fun dir2/fun-hard\n\n  # 符号链接\n  ln -s fun fun-sym\n  ln -s ../fun dir1/fun-sym        # 用相对路径\n  ln -s ../fun dir2/fun-sym\n  ln -s /home/me/playground/fun dir1/fun-sym   # 用绝对路径\n  ln -s dir1 dir1-sym              # 符号链接也能引用目录"],"tip":"硬链接是最初 UNIX 创建链接的方式，默认情况下每个文件只有一个硬链接，由其为文件赋予名称；创建硬链接即为文件额外创建了一个目录项。用 `ls -li` 可以看 i 节点号来确认两个名称是不是同一个文件（见下面实战说明）。创建符号链接时，相当于用文本描述目标文件相对于符号链接的位置——`ls -l dir1` 会显示 `fun-sym -\u003e ../fun`，而且符号链接文件的大小是 6，这是字符串 `../fun` 的长度，而非它所指向的文件的大小。\n\n**实战演练中关于 i 节点的一个要点**：`ln fun fun-hard` 等命令创建了文件 `fun` 的 4 个\"示例\"后，`ls -l` 中 `fun` 和 `fun-hard` 条目的第 2 个字段都是 4，这是文件当前的硬链接数量（文件至少有一个硬链接，因为文件名是通过硬链接创建的）。`ls` 本身看不出 `fun` 和 `fun-hard` 是同一个文件（只能看出大小相同），要用 `ls -li` 看第 1 个字段的 i 节点号——两者 i 节点号相同，坐实是同一个文件：\n\n\n\n**本章重要表格**：\n\n表 4-1 通配符及其含义\n\n| 通配符             | 含义                              |\n| --------------- | ------------------------------- |\n| `*`             | 匹配任意多个字符                        |\n| `?`             | 匹配任意单个字符                        |\n| `[characters]`  | 匹配属于字符集合 `characters` 中的任意单个字符  |\n| `[!characters]` | 匹配不属于字符集合 `characters` 中的任意单个字符 |\n| `[[:class:]]`   | 匹配属于字符类 `class` 中的任意单个字符        |\n\n表 4-2 常用的字符类\n\n| 字符类         | 含义                         |\n| ----------- | -------------------------- |\n| `[:alnum:]` | 匹配任意单个字母数字（alphanumeric）字符 |\n| `[:alpha:]` | 匹配任意单个字母                   |\n| `[:digit:]` | 匹配任意单个数字                   |\n| `[:lower:]` | 匹配任意单个小写字母                 |\n| `[:upper:]` | 匹配任意单个大写字母                 |\n\n表 4-3 通配符示例\n\n| 模式                       | 匹配                                                                                        |\n| ------------------------ | ----------------------------------------------------------------------------------------- |\n| `*`                      | 所有文件（`*` 并不能匹配以点号开头的文件（隐藏文件）。如果想匹配此类文件，可以使用模式 `.[!.]*`，例如 `ls -d .[!.]*` 或 `echo .[!.]*`） |\n| `g*`                     | 以 `g` 开头的任意文件                                                                             |\n| `b*.txt`                 | 以 `b` 开头，扩展名为 `.txt` 的文件                                                                  |\n| `Data???`                | 以 `Data` 开头并紧接 3 个字符的文件                                                                   |\n| `[abc]*`                 | 以 `a`、`b`、`c` 中任意字符开头的文件                                                                  |\n| `BACKUP.[0-9][0-9][0-9]` | 以 `BACKUP.` 开头并紧接 3 个数字的文件                                                                |\n| `[[:upper:]]*`           | 以单个大写字母开头的文件                                                                              |\n| `[![:digit:]]*`          | 不以数字开头的文件                                                                                 |\n| `*[[:lower:]123]`        | 以小写字母或 1、2、3 中任意数字结尾的文件                                                                   |\n\n表 4-4 `cp` 命令常用选项\n\n| 选项                  | 含义                                                                             |\n| ------------------- | ------------------------------------------------------------------------------ |\n| `-a, --archive`     | 复制文件和目录及其包括所有权与权限在内的所有属性。在通常情况下，副本采用执行复制操作的用户的默认属性。我们会在第 9 章讨论文件所有权            |\n| `-i, --interactive` | 在覆盖已有文件之前，提示用户确认。如果未指定该选项，`cp` 命令会悄无声息地（也就是不发出任何警告）覆盖文件                        |\n| `-r, --recursive`   | 递归复制目录及其内容。在复制目录时，要用到该选项（或者 `-a` 选项）                                           |\n| `-u, --update`      | 在将文件从一个目录复制到目标目录时，只复制目标目录中不存在或比目标目录中现有文件更新的文件。该选项在复制大批量文件时很实用，因为它能够跳过那些不必复制的文件 |\n| `-v, --verbose`     | 在进行复制时显示相关信息                                                                   |\n\n表 4-5 `cp` 命令示例\n\n| 命令                    | 结果                                                                                                 |\n| --------------------- | -------------------------------------------------------------------------------------------------- |\n| `cp file1 file2`      | 将文件 file1 复制为文件 file2。如果文件 file2 存在，使用文件 file1 的内容将其覆盖。如果文件 file2 不存在，则创建文件 file2                  |\n| `cp -i file1 file2`   | 和前一个命令一样，除了当文件 file2 存在时，在覆盖之前会提示用户                                                                |\n| `cp file1 file2 dir1` | 将文件 file1 和文件 file2 复制到目录 dir1。该目录必须事先存在                                                           |\n| `cp dir1/* dir2`      | 使用通配符，将目录 dir1 中所有的文件复制到目录 dir2。目录 dir2 必须事先存在                                                     |\n| `cp -r dir1 dir2`     | 将目录 dir1 的内容复制到目录 dir2。如果目录 dir2 不存在，则先创建该目录，再复制目录 dir1 的内容。如果目录 dir2 已存在，目录 dir1 及其内容会被复制到目录 dir2 |\n\n表 4-6 `mv` 命令选项\n\n| 选项                  | 含义                                            |\n| ------------------- | --------------------------------------------- |\n| `-i, --interactive` | 在覆盖已有文件之前，提示用户确认。如果未指定该选项，`mv` 命令会悄无声息地覆盖文件   |\n| `-u, --update`      | 在将文件从一个目录移动到目标目录时，只移动目标目录中不存在或比目标目录中现有文件更新的文件 |\n| `-v, --verbose`     | 在进行移动时显示相关信息                                  |\n\n表 4-7 `mv` 命令示例\n\n| 命令                    | 结果                                                                                                       |\n| --------------------- | -------------------------------------------------------------------------------------------------------- |\n| `mv file1 file2`      | 将文件 file1 移动到文件 file2。如果文件 file2 存在，使用文件 file1 的内容将其覆盖。如果文件 file2 不存在，则创建文件 file2。不管是哪种情况，文件 file1 都不再存在 |\n| `mv -i file1 file2`   | 和前一个命令一样，除了当文件 file2 存在时，在覆盖之前会提示用户                                                                      |\n| `mv file1 file2 dir1` | 将文件 file1 和文件 file2 移动到目录 dir1。该目录必须事先存在                                                                 |\n| `mv dir1 dir2`        | 如果目录 dir2 不存在，则先创建该目录，再将目录 dir1 及其内容移动到目录 dir2，然后删除目录 dir1。如果目录 dir2 已存在，将目录 dir1 及其内容移动到目录 dir2         |\n\ 目录","chapters":["第4章","第23章"],"part":"一·学习 Shell","partNo":1,"cats":["② 文件与目录操作"],"core":true,"idxChapters":"第4章、第23章","kind":"cmd","syntax":"`rm item...`，其中 `item` 可以是一个或多个文件/目录。","syntaxNote":"","options":[{"flag":"-i, --interactive","desc":"在删除已有文件之前，提示用户确认。如果未指定该选项，`rm` 命令会悄无声息地删除文件"},{"flag":"-r, --recursive","desc":"递归删除目录。这意味着如果被删除的目录中还有子目录，也会一并将其删除。要想删除目录，必须指定该选项"},{"flag":"-f, --force","desc":"忽略不存在的文件，不提示。该选项会屏蔽掉 `--interactive` 选项"},{"flag":"-v, --verbose","desc":"在执行删除操作时显示相关信息"}],"optTitle":"","examples":["  rm file1          # 悄无声息地删除文件 file1\n  rm -i file1       # 同上，但删除前提示用户确认\n  rm -r file1 dir1  # 删除文件 file1 和目录 dir1 及其内容\n  rm -rf file1 dir1 # 同上，但当 file1 或 dir1 不存在时，rm 仍会悄无声息地继续执行\n\n  # 实战演练\n  rm fun-hard       # 删除一个硬链接\n  rm -i fun         # 提示 rm: remove regular file 'fun'?\n  rm fun-sym dir1-sym\n  cd\n  rm -r playground  # 递归删除整个 playground 目录及其内容","  [me@linuxbox diction-1.11]$ rm getopt.o"],"tip":"**类 UNIX 系统（如 Linux）并没有还原删除命令。** 使用 `rm` 删除的文件或目录，就再也找不回来了。Linux 假定你是聪明人，知道自己在做什么。**尤其要小心通配符**：想删除目录中所有 HTML 文件时输入 `rm *.html` 没问题，但如果在 `*` 和 `.html` 之间多加了一个空格（`rm * .html`），`rm` 会删除目录中的所有文件，然后提示找不到名为 `.html` 的文件。实用窍门：只要在使用 `rm` 时用到了通配符，除仔细检查输入内容之外，还要先使用 `ls` 测试一下通配符，这样就能事先知道要删除哪些文件；然后按上方向键调出先前的命令，把 `ls` 换成 `rm`。","tips":["**类 UNIX 系统（如 Linux）并没有还原删除命令。** 使用 `rm` 删除的文件或目录，就再也找不回来了。Linux 假定你是聪明人，知道自己在做什么。**尤其要小心通配符**：想删除目录中所有 HTML 文件时输入 `rm *.html` 没问题，但如果在 `*` 和 `.html` 之间多加了一个空格（`rm * .html`），`rm` 会删除目录中的所有文件，然后提示找不到名为 `.html` 的文件。实用窍门：只要在使用 `rm` 时用到了通配符，除仔细检查输入内容之外，还要先使用 `ls` 测试一下通配符，这样就能事先知道要删除哪些文件；然后按上方向键调出先前的命令，把 `ls` 换成 `rm`。"],"relTips":[],"demo":[["cmd","ls"],["out","dir1  dir2  fun  fun-hard  notes.txt"],["cmt","# 先 ls 验证通配符结果，再换成 rm"],["cmd","rm notes.txt"],["cmt","# 静默删除，没有回收站"],["cmd","rm -i fun"],["out","rm: remove regular file 'fun'? y"],["cmd","rm -r dir1"],["cmt","# 删除目录必须带 -r"],["cmd","rm -rf file1 dir1"],["cmt","# 强制递归；文件不存在也不报错。危险！"],["err","rm: cannot remove 'notes.txt': No such file or directory"]],"multi":true},{"id":17,"key":"--help","cmd":"--help","plain":"--help","desc":"显示用法信息（选项）","descShort":"显示用法信息（选项）","detail":"很多程序都支持 `--help` 选项，该选项可以显示命令所支持的语法和选项的相关描述。","chapter":"第5章","cno":5,"chapterTitle":"和命令打交道","chapters":["第5章"],"part":"一·学习 Shell","partNo":1,"cats":["㉓ 其他卡片（书中项目脚本与专题）"],"core":false,"idxChapters":"","kind":"cmd","syntax":"命令 --help","syntaxNote":"","options":[],"optTitle":"","examples":["  mkdir --help\n  # Usage: mkdir [OPTION] DIRECTORY...\n  # Create the DIRECTORY(ies), if they do not already exist.\n  #\n  #   -Z, --context=CONTEXT (SELinux) set security context to CONTEXT\n  # Mandatory arguments to long options are mandatory for short options too.\n  #   -m, --mode=MODE   set file mode (as in chmod), not a=rwx - umask\n  #   -p, --parents     no error if existing, make parent directories as needed\n  #   -v, --verbose     print a message for each created directory\n  #       --help        display this help and exit\n  #       --version     output version information and exit\n  # Report bugs to \u003cbug-coreutils@gnu.org\u003e."],"tip":"部分程序可能不支持 `--help` 选项，不过可以先试一试——这通常会产生一条错误消息，在其中也可以发现同样的用法信息。","tips":["部分程序可能不支持 `--help` 选项，不过可以先试一试——这通常会产生一条错误消息，在其中也可以发现同样的用法信息。"],"relTips":[],"demo":[["cmd","mkdir --help"],["cmt","# Usage: mkdir [OPTION] DIRECTORY..."],["cmt","# Create the DIRECTORY(ies), if they do not already exist."],["cmt","# "],["cmt","# -Z, --context=CONTEXT (SELinux) set security context to CONTEXT"],["cmt","# Mandatory arguments to long options are mandatory for short options too."],["cmt","# -m, --mode=MODE   set file mode (as in chmod), not a=rwx - umask"],["cmt","# -p, --parents     no error if existing, make parent directories as needed"],["cmt","# -v, --verbose     print a message for each created directory"],["cmt","# --help        display this help and exit"],["cmt","# --version     output version information and exit"],["cmt","# Report bugs to \u003cbug-coreutils@gnu.org\u003e."]],"multi":false},{"id":18,"key":"alias","cmd":"alias","plain":"alias","desc":"创建自己的命令","descShort":"创建自己的命令","detail":"在已有命令的基础上创建自己的命令。","chapter":"第5章","cno":5,"chapterTitle":"和命令打交道","chapters":["第5章","第11章"],"part":"一·学习 Shell","partNo":1,"cats":["⑩ 帮助与命令查找"],"core":true,"idxChapters":"第5章、第11章","kind":"cmd","syntax":"`alias name='string'`（`alias` 之后指定别名，紧接着不允许出现空白字符就是等号，然后是单引号引用的字符串）","syntaxNote":"","options":[],"optTitle":"","examples":["  # 先用分号把三条命令串在一行\n  cd /usr; ls; cd -\n  # bin games include lib local sbin share src\n  # /home/me\n\n  # 检查名称是否被占用\n  type test        # test is a shell builtin\n  type foo         # bash: type: foo: not found\n\n  # 创建别名\n  alias foo='cd /usr; ls; cd -'\n  foo\n  # bin games include lib local sbin share src\n  # /home/me\n\n  # 查看别名\n  type foo         # foo is aliased to 'cd /usr; ls; cd -'\n\n  # 列出全部别名（Fedora 系统默认定义的一些别名）\n  alias\n  # alias l.='ls -d .* --color=tty'\n  # alias ll='ls -l --color=tty'\n  # alias ls='ls --color=tty'","  alias\n  # alias l.='ls -d .* --color=tty'\n  # alias ll='ls -l --color=tty'\n  # alias ls='ls --color=tty'\n  # alias vi='vim'\n  # alias which='alias | /usr/bin/which --tty-only --read-alias --show-dot --show-tilde'\n\n  alias ll='ls -l --color=auto'      # 创建名为 ll 的新命令，长格式显示目录条目\n  alias l.='ls -d .* --color=auto'   # 创建名为 l. 的新命令，显示以点号开头的所有目录条目"],"tip":"等号前后不允许出现空白字符（空格符、制表符、换行符都属于空白字符）。定义好的别名可以出现在 Shell 允许出现命令的任何地方。用已有命令名做别名并不少见，目的是为常见命令添加惯用选项（如 ls 加颜色）。在命令行定义别名有一个小问题：当 Shell 会话结束时，这些别名也会随之消失。","tips":["等号前后不允许出现空白字符（空格符、制表符、换行符都属于空白字符）。定义好的别名可以出现在 Shell 允许出现命令的任何地方。用已有命令名做别名并不少见，目的是为常见命令添加惯用选项（如 ls 加颜色）。在命令行定义别名有一个小问题：当 Shell 会话结束时，这些别名也会随之消失。","别名属于\"程序化数据\"，**无法使用 `set` 命令和 `printenv` 命令显示**。"],"relTips":[],"demo":[["cmd","alias"],["out","alias l.='ls -d .* --color=auto'\nalias ll='ls -l --color=auto'\nalias ls='ls --color=auto'"],["cmd","alias foo='cd /usr; ls; cd -'"],["cmd","foo"],["out","bin  games  include  lib  local  sbin  share\n/home/me"],["cmd","unalias foo"],["cmd","unalias -a"],["cmt","# 命令行定义的别名关掉终端就没了，想永久保留要写进 ~/.bashrc"]],"multi":true},{"id":19,"key":"apropos","cmd":"apropos","plain":"apropos","desc":"显示适合的命令清单","descShort":"显示适合的命令清单","detail":"根据关键字在手册页列表中搜索可能的匹配项。","chapter":"第5章","cno":5,"chapterTitle":"和命令打交道","chapters":["第5章"],"part":"一·学习 Shell","partNo":1,"cats":["⑩ 帮助与命令查找"],"core":true,"idxChapters":"第5章","kind":"cmd","syntax":"apropos 关键字","syntaxNote":"","options":[],"optTitle":"","examples":["  apropos partition\n  # addpart (8)    - simple wrapper around the \"add partition\" ioctl\n  # all-swaps (7)  - event signalling that all swap partitions have been ac...\n  # cfdisk (8)     - display or manipulate disk partition table\n  # cgdisk (8)     - Curses-based GUID partition table (GPT) manipulator\n  # delpart (8)    - simple wrapper around the \"del partition\" ioctl\n  # fdisk (8)      - manipulate disk partition table\n  # fixparts (8)   - MBR partition table repair utility\n  # gdisk (8)      - Interactive GUID partition table (GPT) manipulator\n  # mpartition (1) - partition an MSDOS hard disk\n  # partprobe (8)  - inform the OS of partition table changes\n  # partx (8)      - tell the Linux kernel about the presence and numbering...\n  # resizepart (8) - simple wrapper around the \"resize partition\" ioctl\n  # sfdisk (8)     - partition table manipulator for Linux\n  # sgdisk (8)     - Command-line GUID partition table (GPT) manipulator fo.."],"tip":"输出结果中每行的第一个字段是手册页的名称，第二个字段是相应的节。这种方法比较粗糙，但有时倒也管用。注意，`man` 命令的 `-k` 选项和 `apropos` 命令具有相同的功能。","tips":["输出结果中每行的第一个字段是手册页的名称，第二个字段是相应的节。这种方法比较粗糙，但有时倒也管用。注意，`man` 命令的 `-k` 选项和 `apropos` 命令具有相同的功能。"],"relTips":[],"demo":[["cmd","apropos floppy"],["out","fdformat (8)         - low-level format a floppy disk\nmkfs.msdos (8)       - create an MS-DOS filesystem"],["cmd","man -k floppy"],["cmt","# -k 和 apropos 功能相同"]],"multi":false},{"id":20,"key":"gzip","cmd":"gzip","plain":"gzip","desc":"压缩程序","descShort":"压缩程序","detail":"原文只在说明文档文件时提到 `.gz` 扩展名表明文件经过 gzip 压缩，并提到 gzip 软件包中带有 `zless`。","chapter":"第5章","cno":5,"chapterTitle":"归档与备份","chapters":["第5章","第18章"],"part":"三·常见任务与工具","partNo":3,"cats":["⑯ 压缩、归档与备份"],"core":true,"idxChapters":"第5章、第18章","kind":"cmd","syntax":"gzip [选项] 文件","syntaxNote":"","options":[{"flag":"-c, --stdout, --to-stdout","desc":"将输出结果写入标准输出，保留原文件。"},{"flag":"-d, --decompress, --uncompress","desc":"解压缩。利用它可以把 gzip 当作 gunzip 使用。"},{"flag":"-f, --force","desc":"强制压缩，哪怕原文件的压缩文件已经存在。"},{"flag":"-h, --help","desc":"显示用法信息。"},{"flag":"-l, --list","desc":"列出压缩文件的压缩统计信息。"},{"flag":"-r, --recursive","desc":"如果命令行参数是目录，则递归压缩目录中的文件。"},{"flag":"-t, --test","desc":"测试压缩文件的完整性。"},{"flag":"-v, --verbose","desc":"在压缩时显示详细信息。"},{"flag":"-number","desc":"设置压缩级别。number 是 1（速度最快、压缩级别最低）～9（最慢、压缩级别最高）的整数；1 和 9 也可分别用 `--fast` 和 `--best` 表示。默认值是 6。"}],"optTitle":"","examples":["  ls -l /etc \u003e foo.txt\n  gzip foo.txt\n  gzip -tv foo.txt.gz\n  gzip -d foo.txt.gz\n  ls -l /etc | gzip \u003e foo.txt.gz"],"tip":"压缩文件的权限和时间戳与原文件相同；解压后压缩文件被原文件替代，文件权限和时间戳也一并保留。","tips":["压缩文件的权限和时间戳与原文件相同；解压后压缩文件被原文件替代，文件权限和时间戳也一并保留。"],"relTips":[],"demo":[["cmd","ls -l notes.txt"],["out","-rw-r--r-- 1 me me 480000 Feb  2 16:45 notes.txt"],["cmd","gzip notes.txt"],["cmd","ls -l notes*"],["out","-rw-r--r-- 1 me me 98240 Feb  2 16:45 notes.txt.gz"],["cmt","# 原文件被替换成 .gz，体积缩到约 1/5"],["cmd","gzip -d notes.txt.gz"],["cmd","gzip -c notes.txt \u003e notes.txt.gz"],["cmt","# -c 保留原文件，只把结果写到标准输出"]],"multi":true},{"id":21,"key":"help","cmd":"help","plain":"help","desc":"获取 Shell 内建命令的帮助信息","descShort":"获取 Shell 内建命令的帮助信息","detail":"Bash 自带的帮助功能，可用于所有 Shell 内建命令。","chapter":"第5章","cno":5,"chapterTitle":"和命令打交道","chapters":["第5章"],"part":"一·学习 Shell","partNo":1,"cats":["⑩ 帮助与命令查找"],"core":true,"idxChapters":"第5章","kind":"cmd","syntax":"help 内建命令名","syntaxNote":"","options":[],"optTitle":"","examples":["  help cd\n  # cd: cd [-L|[-P [-e]] [-@]] [dir]\n  #     Change the shell working directory.\n  #     ...（原文完整展示了 cd 的帮助文本，包括 -L、-P、-e、-@ 各选项说明）"],"tip":"`cd` 的帮助文档简洁明了，但绝对算不上教程——其中还提到了不少尚未提及的内容。","tips":["`cd` 的帮助文档简洁明了，但绝对算不上教程——其中还提到了不少尚未提及的内容。"],"relTips":[],"demo":[["cmd","help cd"],["out","cd: cd [-L|[-P [-e]] [-@]] [dir]\n    Change the shell working directory."],["cmd","help -d cd"],["out","cd - Change the shell working directory."],["cmt","# -d 只显示一行简述"]],"multi":false},{"id":22,"key":"info","cmd":"info","plain":"info","desc":"显示程序的 info 条目","descShort":"显示程序的 info 条目","detail":"GNU 项目为自家程序提供的手册页替代品，用 `info` 阅读器显示，内容含超链接，和网页颇为相像。","chapter":"第5章","cno":5,"chapterTitle":"和命令打交道","chapters":["第5章"],"part":"一·学习 Shell","partNo":1,"cats":["⑩ 帮助与命令查找"],"core":true,"idxChapters":"第5章","kind":"cmd","syntax":"`info [程序名称]`（程序名称是可选的）","syntaxNote":"","options":[],"optTitle":"","examples":["  # 查看 ls 的 info 条目（部分输出）\n  # File: coreutils.info, Node: ls invocation, Next: dir invocation, Up: Directory listing\n  # 10.1 'ls': List directory contents\n  # ==================================\n  # The 'ls' program lists information about files (of any type, including\n  # directories). Options and file arguments can be intermixed arbitrarily, as usual.\n  # ...\n\n  # 查看 Coreutils 软件包的菜单页面\n  info coreutils"],"tip":"info 文件按树形结构组织成各个单独的节点，每个节点包含一个主题；超链接可以通过前置的星号来识别，将光标放在超链接上并按 Enter 键即可激活。原文指出，到目前为止讨论过的大部分命令行程序属于 GNU 项目的 Coreutils 软件包，`info coreutils` 会显示一个包含指向 Coreutils 内各个程序的超链接的菜单页面。","tips":["info 文件按树形结构组织成各个单独的节点，每个节点包含一个主题；超链接可以通过前置的星号来识别，将光标放在超链接上并按 Enter 键即可激活。原文指出，到目前为止讨论过的大部分命令行程序属于 GNU 项目的 Coreutils 软件包，`info coreutils` 会显示一个包含指向 Coreutils 内各个程序的超链接的菜单页面。"],"relTips":[],"demo":[["cmd","info coreutils"],["out","* Menu:\n* Introduction::\n* Common options::\n* File permissions::\n…"],["cmt","# 树形节点结构，光标放星号链接上按 Enter 跳转，q 退出"]],"multi":false},{"id":23,"key":"man","cmd":"man","plain":"man","desc":"显示命令的手册页","descShort":"显示命令的手册页","detail":"大多数用于命令行的程序会提供一份叫作手册（manual）或手册页（man page）的正式文档，`man` 这个特殊的分页程序可以浏览这种文档。","chapter":"第5章","cno":5,"chapterTitle":"和命令打交道","chapters":["第5章"],"part":"一·学习 Shell","partNo":1,"cats":["⑩ 帮助与命令查找"],"core":true,"idxChapters":"第5章","kind":"cmd","syntax":"- `man program`（`program` 是待浏览的手册页对应的命令名称）\n  - `man section search_term`（指定章节号查阅）","syntaxNote":"","options":[],"optTitle":"","examples":["  man ls\n\n  # 显示描述 /etc/passwd 文件格式的手册页（第 5 节）\n  man 5 passwd"],"tip":"在大多数 Linux 系统中，`man` 使用 `less` 显示手册页，所以在浏览时熟悉的所有 less 命令都照样管用。手册页通常是难以阅读的参考文档而非学习教程——原文认为其中\"佼佼者\"当属 Bash 的手册页，输出的话密密麻麻超过 80 页，其组织结构绝对让新手感到疑惑；但手册页内容准确、用词简练，事无巨细地涵盖了方方面面。","tips":["在大多数 Linux 系统中，`man` 使用 `less` 显示手册页，所以在浏览时熟悉的所有 less 命令都照样管用。手册页通常是难以阅读的参考文档而非学习教程——原文认为其中\"佼佼者\"当属 Bash 的手册页，输出的话密密麻麻超过 80 页，其组织结构绝对让新手感到疑惑；但手册页内容准确、用词简练，事无巨细地涵盖了方方面面。"],"relTips":[],"demo":[["cmd","man ls"],["out","LS(1)                     User Commands                     LS(1)\n\nNAME\n       ls - list directory contents\n\nSYNOPSIS\n       ls [OPTION]... [FILE]...\n…"],["cmt","# 用 less 显示：空格翻页 /q 退出 /h 帮助"],["cmd","man 5 passwd"],["cmt","# 数字是手册章节号：1 用户命令 5 文件格式 8 系统管理"]],"multi":false},{"id":24,"key":"type","cmd":"type","plain":"type","desc":"显示命令类型","descShort":"显示命令类型","detail":"显示指定的命令属于哪种类型。`type` 命令属于 Shell 内建命令。","chapter":"第5章","cno":5,"chapterTitle":"和命令打交道","chapters":["第5章"],"part":"一·学习 Shell","partNo":1,"cats":["⑩ 帮助与命令查找"],"core":true,"idxChapters":"第5章","kind":"cmd","syntax":"`type command`（`command` 是想要检查的命令名）","syntaxNote":"","options":[],"optTitle":"","examples":["  type type\n  # type is a shell builtin\n\n  type ls\n  # ls is aliased to 'ls --color=tty'\n\n  type cp\n  # cp is /bin/cp\n\n  type test\n  # test is a shell builtin\n\n  type foo\n  # bash: type: foo: not found\n\n  type foo          # 定义别名之后\n  # foo is aliased to 'cd /usr; ls; cd -'\n\n  type foo          # unalias 之后\n  # bash: type: foo: not found"],"tip":"从输出结果中可以看到有 3 种不同的命令（内建、别名、可执行文件路径）。注意 ls（取自 Fedora 系统）实际上是添加了 `--color=tty` 选项的 ls 命令的别名——这就是 ls 输出结果是彩色的原因。检查准备用作别名的名称是否已被占用，就靠 `type`。","tips":["从输出结果中可以看到有 3 种不同的命令（内建、别名、可执行文件路径）。注意 ls（取自 Fedora 系统）实际上是添加了 `--color=tty` 选项的 ls 命令的别名——这就是 ls 输出结果是彩色的原因。检查准备用作别名的名称是否已被占用，就靠 `type`。"],"relTips":[],"demo":[["cmd","type ls"],["out"," ` 只适用于可执行文件，不适用于内建命令或代替实际可执行文件的别名。","输出结果显示已经安装了 GCC。原文提示：你的 Linux 也许提供了一个用于软件开发的**元软件包（meta-package，即软件包集合）**，可以考虑安装它以便编译程序；如果系统没有提供元软件包，就尝试安装 GCC 和 make 软件包，对多数系统这已足够完成本章练习。"],"relTips":[],"demo":[["cmd","which ls"],["out","/bin/ls"],["cmt","# 只对可执行文件有效，内建命令和别名查不到"]],"multi":true},{"id":28,"key":"zless","cmd":"zless","plain":"zless","desc":"查看由 gzip 压缩的文档文件","descShort":"查看由 gzip 压缩的文档文件","detail":"gzip 软件包中一个特殊版本的 less 命令，可以显示由 gzip 压缩的文档文件的内容。","chapter":"第5章","cno":5,"chapterTitle":"和命令打交道","chapters":["第5章"],"part":"一·学习 Shell","partNo":1,"cats":["③ 查看文件内容"],"core":true,"idxChapters":"第5章","kind":"cmd","syntax":"原文未展开","syntaxNote":"","options":[],"optTitle":"","examples":[],"tip":"在 `/usr/share/doc` 中碰到以 `.gz` 扩展名结尾的文档文件，就说明它经过 gzip 压缩，需要用 `zless` 查看。","tips":["在 `/usr/share/doc` 中碰到以 `.gz` 扩展名结尾的文档文件，就说明它经过 gzip 压缩，需要用 `zless` 查看。"],"relTips":[],"demo":[["cmd","zless /usr/share/doc/gzip/README.gz"],["cmt","# 直接翻阅 .gz 压缩的文档，用 less 的按键操作"]],"multi":false},{"id":29,"key":"/dev/null","cmd":"`/dev/null`","plain":"/dev/null","desc":"位桶，用来丢弃不想要的输出","descShort":"位桶，用来丢弃不想要的输出","detail":"系统提供的一种\"丢弃输出\"的解决方法——将输出结果重定向到名为 `/dev/null` 的特殊文件。该文件是一个系统设备，通常称作位桶（bit bucket），能够接收输入结果但不做任何处理。","chapter":"第6章","cno":6,"chapterTitle":"重定向","chapters":["第6章"],"part":"一·学习 Shell","partNo":1,"cats":["⑧ 重定向与管道"],"core":false,"idxChapters":"","kind":"cmd","syntax":"`命令 2\u003e /dev/null` 等（按需要重定向哪个流而定）","syntaxNote":"","options":[],"optTitle":"","examples":["  # 丢弃命令的错误消息\n  ls -l /bin/usr 2\u003e /dev/null"],"tip":"位桶是一个\"古老\"的 UNIX 概念，由于其广泛性，在 UNIX 文化的诸多方面都有它的身影——如果有人说你的评论被送到了 `/dev/null`，现在你应该就知道是什么意思了。\n\n**本章重要表格**：无（原文本章未设表格；重定向操作符的说明见上面对应的操作符卡片）。\n\n**本章要点速记**：\n\n1. 程序把运行结果送 stdout（文件描述符 1）、把状态/错误消息送 stderr（文件描述符 2）、从 stdin（文件描述符 0）取输入；默认它们分别接着屏幕和键盘。\n2. `\u003e` 覆盖写、`\u003e\u003e` 追加写；只写 `\u003e 文件名` 可以新建空文件或清空已有文件。\n3. 错误消息要单独接：`2\u003e 文件`；两者都要接：`\u003e 文件 2\u003e\u00261`（顺序不能颠倒）或较新 Bash 的 `\u0026\u003e 文件` / 追加用 `\u0026\u003e\u003e`。\n4. `|` 连的是\"命令的输出\"到\"另一个命令的输入\"，`\u003e` 连的是\"命令\"到\"文件\"，别把两者混用成 `命令1 \u003e 命令2`。\n5. `tee` 在管道上装\"T 形头\"：既让数据继续往下流，又同时存进文件。\n6. `cat` 不带参数时从键盘读，按 `Ctrl-D`（EOF）结束——这也是它能被 `\u003c` 重定向输入的原因。`sort`、`uniq`、`wc`、`grep`、`head`、`tail` 都是管道里常用的\"过滤器\"。\n7. `tail -f` 用来实时盯日志；`Ctrl-C` 停止。\n\n---","tips":["位桶是一个\"古老\"的 UNIX 概念，由于其广泛性，在 UNIX 文化的诸多方面都有它的身影——如果有人说你的评论被送到了 `/dev/null`，现在你应该就知道是什么意思了。\n\n**本章重要表格**：无（原文本章未设表格；重定向操作符的说明见上面对应的操作符卡片）。\n\n**本章要点速记**：\n\n1. 程序把运行结果送 stdout（文件描述符 1）、把状态/错误消息送 stderr（文件描述符 2）、从 stdin（文件描述符 0）取输入；默认它们分别接着屏幕和键盘。\n2. `\u003e` 覆盖写、`\u003e\u003e` 追加写；只写 `\u003e 文件名` 可以新建空文件或清空已有文件。\n3. 错误消息要单独接：`2\u003e 文件`；两者都要接：`\u003e 文件 2\u003e\u00261`（顺序不能颠倒）或较新 Bash 的 `\u0026\u003e 文件` / 追加用 `\u0026\u003e\u003e`。\n4. `|` 连的是\"命令的输出\"到\"另一个命令的输入\"，`\u003e` 连的是\"命令\"到\"文件\"，别把两者混用成 `命令1 \u003e 命令2`。\n5. `tee` 在管道上装\"T 形头\"：既让数据继续往下流，又同时存进文件。\n6. `cat` 不带参数时从键盘读，按 `Ctrl-D`（EOF）结束——这也是它能被 `\u003c` 重定向输入的原因。`sort`、`uniq`、`wc`、`grep`、`head`、`tail` 都是管道里常用的\"过滤器\"。\n7. `tail -f` 用来实时盯日志；`Ctrl-C` 停止。\n\n---"],"relTips":[],"demo":[["cmt","# 丢弃命令的错误消息"],["cmd","ls -l /bin/usr 2\u003e /dev/null"]],"multi":false},{"id":30,"key":"cat","cmd":"cat","plain":"cat","desc":"拼接文件","descShort":"拼接文件","detail":"`cat` 命令读取一个或多个文件并将其复制到标准输出。在大多数情况下，可以把它等同于 DOS 中的 `type` 命令，能够以不分页的形式显示文件内容；因为能接收多个文件作为参数，所以还可用于将文件拼接在一起。","chapter":"第6章","cno":6,"chapterTitle":"文本处理","chapters":["第6章","第20章"],"part":"三·常见任务与工具","partNo":3,"cats":["③ 查看文件内容"],"core":true,"idxChapters":"第6章、第20章","kind":"cmd","syntax":"cat [选项] [文件...]","syntaxNote":"","options":[{"flag":"-A","desc":"显示文本中的**非输出字符**（如制表符显示为 `^I`、行尾显示为 `$`），常用于检查是否有隐藏控制字符或行尾空格。"},{"flag":"-n","desc":"为文本行加上行号。"},{"flag":"-s","desc":"禁止输出连续的空白行。"}],"optTitle":"","examples":["  # 显示文件内容\n  cat ls-output.txt\n\n  # 拼接分片文件（通配符会按顺序扩展，所以参数排列不会出错）\n  cat movie.mpeg.0* \u003e movie.mpeg\n\n  # 不带参数：从标准输入读取，输入文本后按 Ctrl-D 结束\n  cat\n  # The quick brown fox jumped over the lazy dog.      ← 键盘输入\n  # The quick brown fox jumped over the lazy dog.      ← cat 复制到标准输出\n\n  # 用\"从标准输入复制到标准输出\"的行为创建小文本文件\n  cat \u003e lazy_dog.txt\n  # The quick brown fox jumped over the lazy dog.      ← 输入后按 Ctrl-D\n\n  # 查看刚创建的文件\n  cat lazy_dog.txt\n  # The quick brown fox jumped over the lazy dog.","  # 用 cat 作为简单文字处理器，输入后按 Ctrl-D 结束\n  cat \u003e foo.txt\n      The quick brown fox jumped over the lazy dog.\n  # 查看非输出字符：^I 表示制表符，$ 出现在真正的行尾（说明有结尾空格）\n  cat -A foo.txt\n  # 去掉多余空行并加行号\n  cat -ns foo.txt"],"tip":"`cat -A` 是排查\"从 DOS/Windows 带来的多余回车符\"的常用手段；原文提到，也有 `dos2unix` / `unix2dos` 可以互转，或者干脆删掉多余的回车符（后文的 `tr`/`sed` 就能做）。","tips":["`cat -A` 是排查\"从 DOS/Windows 带来的多余回车符\"的常用手段；原文提到，也有 `dos2unix` / `unix2dos` 可以互转，或者干脆删掉多余的回车符（后文的 `tr`/`sed` 就能做）。","`cat` 常用于显示比较短的文本文件。没有文件名参数时它会一直等着从键盘输入，需要按 `Ctrl-D` 组合键（按住 Ctrl 再按 D）告诉它已经到达标准输入的文件末尾（End Of File，EOF）。"],"relTips":[],"demo":[["cmd","cat notes.txt"],["out","第一行\n第二行\n第三行"],["cmd","cat -n notes.txt"],["out","     1\t第一行\n     2\t第二行\n     3\t第三行"],["cmd","cat file1 file2 \u003e both.txt"],["cmt","# 拼接两个文件"],["cmd","cat"],["cmt","# 不带文件名会一直等键盘输入，按 Ctrl-D 表示 EOF 结束"]],"multi":true},{"id":31,"key":"grep","cmd":"grep","plain":"grep","desc":"输出与模式匹配的行","descShort":"输出与模式匹配的行","detail":"在标准输入或指定文件的行中搜索与正则表达式匹配的内容，默认输出**含有匹配项的行**。","chapter":"第6章","cno":6,"chapterTitle":"正则表达式","chapters":["第6章","第19章"],"part":"三·常见任务与工具","partNo":3,"cats":["⑤ 文本处理（重点）","⑦ 正则表达式"],"core":true,"idxChapters":"第6章、第19章","kind":"cmd","syntax":"grep [选项] 正则表达式 [文件...]","syntaxNote":"","options":[{"flag":"-l","desc":"只输出**包含匹配项的文件名**，不显示匹配行本身（原文示例 `grep -l bzip dirlist*.txt` 只打印 `dirlist-bin.txt`）。原文用小写 l，即\"只列出文件\"。"},{"flag":"-L","desc":"反过来，只输出**不包含匹配项的文件名**。"},{"flag":"-h","desc":"搜索多个文件时不显示文件名前缀，只输出匹配行。"},{"flag":"-i","desc":"匹配时忽略大小写（原文中 `grep -i '^..j.r$'` 同时匹配到 Major 和 major）。"},{"flag":"-E","desc":"使用 **ERE（扩展型正则表达式）**；等价于使用 `egrep`。"},{"flag":"-v","desc":"反向匹配（inverse match），输出**不匹配**的行。"}],"optTitle":"","examples":["  # 在多个文件中搜索文字字符串\n  grep bzip dirlist*.txt\n  # 只列出含匹配项的文件\n  grep -l bzip dirlist*.txt\n  # 只列出不含匹配项的文件\n  grep -L bzip dirlist*.txt\n  # 点号匹配任意一个字符（故 zip 本身不匹配，因为长度不够）\n  grep -h '.zip' dirlist*.txt\n  # 锚点：行首 / 行尾 / 整行\n  grep -h '^zip' dirlist*.txt\n  grep -h 'zip$' dirlist*.txt\n  grep -h '^zip$' dirlist*.txt\n  # 填字游戏助手：第三个字母 j、最后一个字母 r 的 5 字母单词\n  grep -i '^..j.r$' /usr/share/dict/words\n  # 方括号集合 / 排除\n  grep -h '[bg]zip'  dirlist*.txt\n  grep -h '[^bg]zip' dirlist*.txt\n  # 字符范围\n  grep -h '^[A-Z]' dirlist*.txt\n  grep -h '^[A-Za-z0-9]' dirlist*.txt\n  grep -h '[-AZ]' dirlist*.txt\n  # 多选结构（需 -E）\n  echo \"AAA\" | grep -E 'AAA|BBB'\n  echo \"AAA\" | grep -E 'AAA|BBB|CCC'\n  grep -Eh '^(bz|gz|zip)' dirlist*.txt\n  grep -Eh '^bz|gz|zip'   dirlist*.txt\n  # 反向匹配：列出不匹配的电话号码\n  grep -Ev '^\\([0-9]{3}\\) [0-9]{3}-[0-9]{4}$' phonelist.txt","  # 从程序列表里找出名称中包含 zip 的所有文件\n  ls /bin /usr/bin | sort | uniq | grep zip\n  # bunzip2\n  # bzip2\n  # gunzip\n  # gzip\n  # unzip\n  # zip\n  # zipcloak\n  # zipgrep\n  # zipinfo\n  # zipnote\n  # zipsplit\n\n  ls /usr/bin | tee ls.txt | grep zip"],"tip":"- 含元字符的正则表达式**必须加引号**，否则可能被 Shell 扩展或把 `|` 解释成管道。\n  - `grep` 是**按行**匹配：只要行内含匹配串就输出整行。\n  - 原文未在本章展开 `-c`、`-n`、`-F` 等选项，需要时请查阅手册页。","tips":["- 含元字符的正则表达式**必须加引号**，否则可能被 Shell 扩展或把 `|` 解释成管道。\n  - `grep` 是**按行**匹配：只要行内含匹配串就输出整行。\n  - 原文未在本章展开 `-c`、`-n`、`-F` 等选项，需要时请查阅手册页。","`grep` 能够匹配非常复杂的模式，不过原文目前只关注简单的文本匹配；第 19 章会讲到被称为\"正则表达式\"（regular expression）的高级模式。"],"relTips":[],"demo":[["cmd","grep root /etc/passwd"],["out","root:x:0:0:root:/root:/bin/bash"],["cmd","ls /bin | grep zip"],["out","bunzip2\nbzip2\nbzip2recover\ngunzip\ngzip\nunzip\nzip\nzipcloak\nzipgrep\nzipinfo\nzipnote\nzipsplit"],["cmd","grep -i 'linux' notes.txt"],["cmt","# -i 忽略大小写"],["cmd","grep -v '^#' /etc/ssh/sshd_config"],["cmt","# -v 反向选择，去掉注释行"],["cmd","grep -n 'error' app.log"],["out","42:error: cannot open config\n117:error: timeout"],["cmd","grep -l 'main' *.c"],["cmt","# 只列出含匹配的文件名"],["cmd","grep -E '[0-9]{3}-[0-9]{4}' phone.txt"],["out","(555)-1234\n555-9876"]],"multi":true},{"id":32,"key":"head","cmd":"head","plain":"head","desc":"输出文件的开头部分","descShort":"输出文件的开头部分","detail":"输出文件的开头部分（默认前 10 行）。","chapter":"第6章","cno":6,"chapterTitle":"重定向","chapters":["第6章"],"part":"一·学习 Shell","partNo":1,"cats":["③ 查看文件内容"],"core":true,"idxChapters":"第6章","kind":"cmd","syntax":"head [选项] filename","syntaxNote":"","options":[{"flag":"-n","desc":"调整输出的行数"}],"optTitle":"","examples":["  head -n 5 ls-output.txt\n  # total 343496\n  # -rwxr-xr-x 1 root root    31316 2017-12-05 08:58 [\n  # -rwxr-xr-x 1 root root     8240 2017-12-09 13:39 411toppm\n  # -rwxr-xr-x 1 root root   111276 2017-11-26 14:27 a2p\n  # -rwxr-xr-x 1 root root    25368 2016-10-06 20:16 a52dec"],"tip":"`head` 和 `tail` 默认分别输出前 10 行和后 10 行，行数可以用 `-n` 调整；两个命令都可以用在管道中。","tips":["`head` 和 `tail` 默认分别输出前 10 行和后 10 行，行数可以用 `-n` 调整；两个命令都可以用在管道中。"],"relTips":[],"demo":[["cmd","head /etc/passwd"],["out","root:x:0:0:root:/root:/bin/bash\ndaemon:x:1:1:daemon:/usr/sbin:/usr/sbin/nologin\nbin:x:2:2:bin:/bin:/usr/sbin/nologin\n…（默认前 10 行）"],["cmd","head -n 3 /etc/passwd"],["out","root:x:0:0:root:/root:/bin/bash\ndaemon:x:1:1:daemon:/usr/sbin:/usr/sbin/nologin\nbin:x:2:2:bin:/bin:/usr/sbin/nologin"]],"multi":false},{"id":33,"key":"sort","cmd":"sort","plain":"sort","desc":"排序文本行","descShort":"排序文本行","detail":"对文本行排序（原文把它作为管道中的\"过滤器\"来举例）。原文章首对它的描述是\"排序文本行\"。","chapter":"第6章","cno":6,"chapterTitle":"文本处理","chapters":["第6章","第20章"],"part":"三·常见任务与工具","partNo":3,"cats":["⑤ 文本处理（重点）"],"core":true,"idxChapters":"第6章、第20章","kind":"cmd","syntax":"sort [选项] [文件...]","syntaxNote":"","options":[{"flag":"-b, --ignore-leading-blanks","desc":"忽略每行开头的空白字符，从第一个非空白字符开始排序。"},{"flag":"-f, --ignore-case","desc":"排序时不区分大小写。"},{"flag":"-n, --numeric-sort","desc":"按数值排序，而非按字母表顺序。"},{"flag":"-r, --reverse","desc":"降序排序。"},{"flag":"-k, --key=field1[,field2]","desc":"按指定关键字字段（或字段范围）排序，而非整行。"},{"flag":"-m, --merge","desc":"把各参数视为**已预排序**的文件，只做合并、不再额外排序。"},{"flag":"-o, --output=file","desc":"把排序结果写入 `file` 而不是标准输出。"},{"flag":"-t, --field-separator=char","desc":"定义字段分隔符（默认由空格或制表符分隔）。"}],"optTitle":"","examples":["  # 基本排序（输入 c b a，Ctrl-D 结束）\n  sort \u003e foo.txt\n  # 合并多个文件为一个有序文件\n  sort file1.txt file2.txt file3.txt \u003e final_sorted_list.txt\n  # 按数值降序显示 du 结果的前 10 行（找最占空间的文件）\n  du -s /usr/share/* | sort -nr | head\n  # 按第 5 个字段（文件大小）数值降序排序 ls -l 输出\n  ls -l /usr/bin | sort -nrk 5 | head\n  # 多关键字排序：字段 1 按字母、字段 2 按数值\n  sort --key=1,1 --key=2n distros.txt     # 等价的短选项：sort -k 1,1 -k 2n\n  # 用字段偏移在字段内部定义关键字，把 月/日/年 按时间排序\n  sort -k 3.7nbr -k 3.1nbr -k 3.4nbr distros.txt\n  # 用 -t 指定冒号作为分隔符，按第 7 字段排序 /etc/passwd\n  sort -t ':' -k 7 /etc/passwd | head","  # 合并 /bin 和 /usr/bin 的可执行文件列表、排序并分页查看\n  ls /bin /usr/bin | sort | less"],"tip":"- 默认情况下字段由空白字符（空格、制表符）分隔，**排序时分隔符也包含在字段中**。例如 `William Shotts` 被看作两个字段：William、Shotts。\n  - `-k` 若未指定范围，关键字会从指定字段**一直延续到行尾**；要限定在单个字段可用 `1,1` 这种\"从字段 1 到字段 1\"的写法。\n  - 选项字母可以放在关键字说明符**末尾**，指明该关键字的排序方式，取值与全局选项相同：`b`（忽略开头空白）、`n`（数值）、`r`（降序）等。\n  - `-k 3.7` 表示\"从第 3 个字段的第 7 个字符开始\"，用字段偏移可把关键字切进字段内部（如从 `12/07/2006` 中分别切出年、月、日）。原文用 `-b` 禁止日期字段开头的空格，避免不同数量的空格影响排序。","tips":["- 默认情况下字段由空白字符（空格、制表符）分隔，**排序时分隔符也包含在字段中**。例如 `William Shotts` 被看作两个字段：William、Shotts。\n  - `-k` 若未指定范围，关键字会从指定字段**一直延续到行尾**；要限定在单个字段可用 `1,1` 这种\"从字段 1 到字段 1\"的写法。\n  - 选项字母可以放在关键字说明符**末尾**，指明该关键字的排序方式，取值与全局选项相同：`b`（忽略开头空白）、`n`（数值）、`r`（降序）等。\n  - `-k 3.7` 表示\"从第 3 个字段的第 7 个字符开始\"，用字段偏移可把关键字切进字段内部（如从 `12/07/2006` 中分别切出年、月、日）。原文用 `-b` 禁止日期字段开头的空格，避免不同数量的空格影响排序。","`ls` 指定两个目录时会输出两个各自排序的列表，在管道中加入 `sort` 就能把它们合并成一个有序列表。"],"relTips":[],"demo":[["cmd","sort names.txt"],["out","Alice\nBob\nbob\ncarol"],["cmd","sort -f names.txt"],["cmt","# -f 忽略大小写"],["cmd","sort -n numbers.txt"],["out","2\n10\n100"],["cmd","du -s /usr/share/* | sort -nr | head -5"],["out","318224\t/usr/share/doc\n146868\t/usr/share/icons\n118012\t/usr/share/locale"],["cmt","# -n 数字序 -r 倒序，排序之王炸组合"]],"multi":true},{"id":34,"key":"tail","cmd":"tail","plain":"tail","desc":"输出文件的结尾部分","descShort":"输出文件的结尾部分","detail":"输出文件的结尾部分（默认后 10 行）。","chapter":"第6章","cno":6,"chapterTitle":"重定向","chapters":["第6章"],"part":"一·学习 Shell","partNo":1,"cats":["③ 查看文件内容"],"core":true,"idxChapters":"第6章","kind":"cmd","syntax":"tail [选项] filename","syntaxNote":"","options":[{"flag":"-n","desc":"调整输出的行数"},{"flag":"-f","desc":"持续观察该文件，一旦添加了新行，立即显示在屏幕中（适合同步观察日志被写入的过程）"}],"optTitle":"","examples":["  tail -n 5 ls-output.txt\n  # -rwxr-xr-x 1 root root     5234 2017-06-27 10:56 znew\n  # -rwxr-xr-x 1 root root      691 2015-09-10 04:21 zonetab2pot.py\n  # -rw-r--r-- 1 root root      930 2017-11-01 12:23 zonetab2pot.pyc\n  # -rw-r--r-- 1 root root      930 2017-11-01 12:23 zonetab2pot.pyo\n  # lrwxrwxrwx 1 root root        6 2016-01-31 05:22 zsoelim -\u003e soelim\n\n  ls /usr/bin | tail -n 5\n  # znew\n  # zonetab2pot.py\n  # zonetab2pot.pyc\n  # zonetab2pot.pyo\n  # zsoelim\n\n  tail -f /var/log/messages\n  # Feb 8 13:40:05 twin4 dhclient: DHCPACK from 192.168.1.1\n  # ..."],"tip":"`tail -f` 会持续观察文件，这个过程直到按 `Ctrl-C` 组合键后停止。查看 `/var/log` 中的 messages 文件时，如果该文件不存在则改用 `/var/log/syslog`；因为 `/var/log/messages` 可能包含安全信息，在一些发行版中需要超级用户权限才能执行该操作。","tips":["`tail -f` 会持续观察文件，这个过程直到按 `Ctrl-C` 组合键后停止。查看 `/var/log` 中的 messages 文件时，如果该文件不存在则改用 `/var/log/syslog`；因为 `/var/log/messages` 可能包含安全信息，在一些发行版中需要超级用户权限才能执行该操作。"],"relTips":[],"demo":[["cmd","tail -n 3 /etc/passwd"],["out","me:x:1000:1000:me,,,:/home/me:/bin/bash\nsshd:x:121:65534::/run/sshd:/usr/sbin/nologin\nnobody:x:65534:65534:nobody:/nonexistent:/usr/sbin/nologin"],["cmd","tail -f /var/log/syslog"],["out","Feb  2 15:40:01 host CRON[3241]: (root) CMD (command -v debian-sa1 …)\n…持续输出新日志，按 Ctrl-C 停止"]],"multi":false},{"id":35,"key":"tee","cmd":"tee","plain":"tee","desc":"读取标准输入并将输出结果写入标准输出和文件","descShort":"读取标准输入并将输出结果写入标准输出和文件","detail":"为了和管道的比喻保持一致，Linux 提供了一个名为 `tee` 的命令，可以在管道上安装一个\"T 形头\"。`tee` 从标准输入读取内容，然后将其复制到标准输出（允许数据沿着管道继续向下流动）和其他文件中。捕获管道处理过程中的某个中间阶段的数据会很有用。","chapter":"第6章","cno":6,"chapterTitle":"重定向","chapters":["第6章"],"part":"一·学习 Shell","partNo":1,"cats":["⑧ 重定向与管道"],"core":true,"idxChapters":"第6章","kind":"cmd","syntax":"... | tee 文件名 | ...","syntaxNote":"","options":[],"optTitle":"","examples":["  # 在 grep 过滤之前加入 tee，把整个目录列表保存到 ls.txt\n  ls /usr/bin | tee ls.txt | grep zip\n  # bunzip2\n  # bzip2\n  # gunzip\n  # gzip\n  # unzip\n  # zip\n  # zipcloak\n  # zipgrep\n  # zipinfo\n  # zipnote\n  # zipsplit"],"tip":"","tips":[],"relTips":[],"demo":[["cmt","# 在 grep 过滤之前加入 tee，把整个目录列表保存到 ls.txt"],["cmd","ls /usr/bin | tee ls.txt | grep zip"],["cmt","# bunzip2"],["cmt","# bzip2"],["cmt","# gunzip"],["cmt","# gzip"],["cmt","# unzip"],["cmt","# zip"],["cmt","# zipcloak"],["cmt","# zipgrep"],["cmt","# zipinfo"],["cmt","# zipnote"],["cmt","# zipsplit"]],"multi":false},{"id":36,"key":"uniq","cmd":"uniq","plain":"uniq","desc":"报告或忽略重复行","descShort":"报告或忽略重复行","detail":"从标准输入或单个文件名参数中获取有序的数据列表（详见 uniq 命令的手册页），默认删除所有重复行。","chapter":"第6章","cno":6,"chapterTitle":"文本处理","chapters":["第6章","第20章"],"part":"三·常见任务与工具","partNo":3,"cats":["⑤ 文本处理（重点）"],"core":true,"idxChapters":"第6章、第20章","kind":"cmd","syntax":"uniq [选项] [文件]","syntaxNote":"","options":[{"flag":"-c, --count","desc":"输出重复行，并在行前加上该行重复出现的次数。"},{"flag":"-d, --repeated","desc":"只输出重复行，不包括非重复行。"},{"flag":"-f n, --skip-fields=n","desc":"忽略每行前 n 个字段（字段以空白字符分隔；与 `sort` 不同，`uniq` 没有设置其他字段分隔符的选项）。"},{"flag":"-i, --ignore-case","desc":"对比行内容时忽略大小写。"},{"flag":"-s n, --skip-chars=n","desc":"跳过（忽略）每行开始的前 n 个字符。"},{"flag":"-u, --unique","desc":"只输出不重复的行。"}],"optTitle":"","examples":["  # 删除排序后列表中的所有重复行\n  ls /bin /usr/bin | sort | uniq | less\n\n  # 只看重复的行\n  ls /bin /usr/bin | sort | uniq -d | less","  # 不排序时重复行删不掉\n  uniq foo.txt\n  # 先排序再删重复\n  sort foo.txt | uniq\n  # 统计每行重复次数\n  sort foo.txt | uniq -c"],"tip":"`uniq` **只能删除连续的重复行**，所以必须先 `sort`。原文\"窍门\"还指出：GNU 版 `sort` 支持 `-u` 选项，同样能删除有序输出中的重复行。","tips":["`uniq` **只能删除连续的重复行**，所以必须先 `sort`。原文\"窍门\"还指出：GNU 版 `sort` 支持 `-u` 选项，同样能删除有序输出中的重复行。","`uniq` 命令通常与 `sort` 命令配合使用。"],"relTips":[],"demo":[["cmd","cat letters.txt"],["out","a\na\nb\nc\nc\nc"],["cmd","uniq letters.txt"],["out","a\  /bin/usr 并不存在"],["cmd","ls -l /bin/usr \u003e ls-output.txt"],["cmt","# ls: cannot access /bin/usr: No such file or directory   ← 错误消息仍在屏幕上"],["cmd","ls -l ls-output.txt"],["cmt","# -rw-rw-r-- 1 me   me   0 2018-02-01 15:08 ls-output.txt  ← 文件被截断为 0"],["gap",""],["cmt","# 只用重定向操作符（不加命令），可以截断现有文件或创建新的空文件"],["cmd","\u003e ls-output.txt"]],"multi":false},{"id":46,"key":"echo","cmd":"echo","plain":"echo","desc":"显示文本，也是观察扩展效果的\"实验工具\"","descShort":"显示文本，也是观察扩展效果的\"实验工具\"","detail":"把参数原样（或经扩展后）输出到屏幕。本章大量用它来验证每种扩展的结果。","chapter":"第7章","cno":7,"chapterTitle":"\"Shell 眼\"看世界：扩展与引用","chapters":["第7章","第11章","第24章"],"part":"一·学习 Shell","partNo":1,"cats":["⑬ 环境与变量"],"core":true,"idxChapters":"第7章、第11章、第24章","kind":"cmd","syntax":"echo [选项] 字符串...","syntaxNote":"","options":[{"flag":"-e","desc":"解释（interprets）转义序列，例如 `\\a`、`\\n`。"}],"optTitle":"","examples":["  echo *\n  echo .*\n  echo .[!.]*\n  echo ~                 # 输出：/home/me\n  echo ~foo              # 输出：/home/foo（系统中存在用户 foo 时）\n  echo $((2 + 2))        # 输出：4\n  echo $USER             # 输出：me\n  echo $SUER             # 输出空行（变量名拼错不报错，只是扩展为空字符串）\n  echo $(ls)\n  echo this is a      test          # 输出：this is a test\n  echo The total is $100.00         # 输出：The total is 00.00\n  echo \"this is a      test\"        # 输出：this is a      test\n  echo \"$USER $((2+2)) $(cal)\"\n  sleep 10; echo -e \"Time's up\\a\"\n  sleep 10; echo \"Time's up\" $'\\a'","  echo $HOME\n  # /home/me","  echo 'Hello World!'"],"tip":"遇到其他扩展时，如果模式输错就不会发生扩展，`echo` 会原封不动地显示错误的模式；但**参数扩展例外**——变量名拼错仍会扩展，只是结果为空的字符串（原文示例 `echo $SUER` 无输出）。","tips":["遇到其他扩展时，如果模式输错就不会发生扩展，`echo` 会原封不动地显示错误的模式；但**参数扩展例外**——变量名拼错仍会扩展，只是结果为空的字符串（原文示例 `echo $SUER` 无输出）。","脚本最后一行就是一个带有字符串参数的 `echo` 命令。"],"relTips":[],"demo":[["cmd","echo hello world"],["out","hello world"],["cmd","echo $((2 + 2))"],["out","4"],["cmd","echo {1..5}"],["out","1 2 3 4 5"],["cmd","echo Front-{A,B,C}-Back"],["out","Front-A-Back Front-B-Back Front-C-Back"],["cmd","echo \"$(cal)\""],["out","       |\n\n**本章要点速记**：\n\n1. 扩展是 Shell 在执行命令前做的\"文字替换\"，共 6 类：路径名、浪纹线 `~`、算术 `$(( ))`、花括号 `{a,b}`、参数 `$VAR`、命令替换 `$( )`。\n2. 引用的强弱顺序：不加引号（全部扩展）\u003e 双引号（只剩 `$`、`\\`、`` ` `` 三类扩展）\u003e 单引号（全部禁止）。\n3. 双引号解决的核心问题是**单词分割**——尤其是文件名里的空格。\n4. 算术扩展只支持整数，`/` 是整除，`%` 求余。\n5. 花括号扩展最实用的场景是批量创建文件名/目录名，如 `mkdir {2007..2009}-{01..12}`。\n6. 参数扩展是唯一\"拼错也不报错、直接变空字符串\"的扩展；`$100.00` 会被吃掉变量的部分。\n\n---\n\n---","tips":["ASCII 编码方案中的前 32 个字符用于向电传打字机之类的设备传送命令；其中制表符、退格符、换行符、回车符比较常用，另一些则很少使用。\n\n**本章重要表格**：\n\n表 7-1 算术操作符\n\n| 操作符  | 含义                                |\n| ---- | --------------------------------- |\n| `+`  | 加法                                |\n| `-`  | 减法                                |\n| `*`  | 乘法                                |\n| `/`  | 除法（因为算术扩展仅支持整数算术运算，所以除法的结果也只能是整数） |\n| `%`  | 求模，就是\"求余数\"                        |\n| `**` | 求幂                                |\n\n表 7-2 反斜线转义序列\n\n| 转义序列 | 含义                                              |\n| ---- | ----------------------------------------------- |\n| `\\a` | 响铃（使计算机发出蜂鸣声）                                   |\n| `\\b` | 退格符                                             |\n| `\\n` | 新行（newline）符；在类 UNIX 系统中，该转义序列会产生换行符（line feed） |\n| `\\r` | 回车符                                             |\n| `\\t` | 制表符                                             |\n\n**本章要点速记**：\n\n1. 扩展是 Shell 在执行命令前做的\"文字替换\"，共 6 类：路径名、浪纹线 `~`、算术 `$(( ))`、花括号 `{a,b}`、参数 `$VAR`、命令替换 `$( )`。\n2. 引用的强弱顺序：不加引号（全部扩展）\u003e 双引号（只剩 `$`、`\\`、`` ` `` 三类扩展）\u003e 单引号（全部禁止）。\n3. 双引号解决的核心问题是**单词分割**——尤其是文件名里的空格。\n4. 算术扩展只支持整数，`/` 是整除，`%` 求余。\n5. 花括号扩展最实用的场景是批量创建文件名/目录名，如 `mkdir {2007..2009}-{01..12}`。\n6. 参数扩展是唯一\"拼错也不报错、直接变空字符串\"的扩展；`$100.00` 会被吃掉变量的部分。\n\n---\n\n---"],"relTips":[],"demo":[["cmd","echo -e \"Time's up\\a\""],["cmd","echo \"Time's up\" $'\\a'"]],"multi":false},{"id":53,"key":"$( )","cmd":"命令替换 `$( )`（旧式写法：反引号）","plain":"命令替换 $( )（旧式写法：反引号）","desc":"","descShort":"","detail":"用命令的输出结果作为扩展结果。","chapter":"第7章","cno":7,"chapterTitle":"\"Shell 眼\"看 -- | ----------------------------------------------- |\n| `Alt-$` | 显示可能的补全结果。在多数系统中，你也可以通过按两次 Tab 键实现相同的效果，后者要容易得多 |\n| `Alt-*` | 插入所有可能的补全结果。当你想使用多个结果的时候，该组合键就能派上用场了            |\n\n表 8-5 用于操作命令历史记录的组合键\n\n| 组合键      | 操作                                                     |\n| -------- | ------------------------------------------------------ |\n| `Ctrl-P` | 移动到上一条历史记录。等同于使用上方向键                                   |\n| `Ctrl-N` | 移动到下一条历史记录。等同于使用下方向键                                   |\n| `Alt-\u003c`  | 移动到历史记录列表开头（顶部）                                        |\n| `Alt-\u003e`  | 移动到历史记录列表结尾（底部），也就是当前命令行                               |\n| `Ctrl-R` | 反向增量搜索。从当前命令行开始向上增量搜索历史记录列表                            |\n| `Alt-P`  | 非增量反向搜索。在这种类型的搜索中，先输入待搜索的字符串，然后按 Enter 键               |\n| `Alt-N`  | 非增量向前查找                                                |\n| `Ctrl-O` | 执行历史记录列表中的当前命令并移动到下一条命令。如果你想重复执行历史记录列表中的一系列命令，该组合键非常方便 |\n\n表 8-6 历史扩展命令\n\n| 序列         | 操作                               |\n| ---------- | -------------------------------- |\n| `!!`       | 重复上一个命令。这可能要比先后按上方向键和 Enter 键更容易 |\n| `!number`  | 重复命令历史记录列表中第 number 个命令          |\n| `!string`  | 重复以 string 开头的最后一个命令             |\n| `!?string` | 重复包含 string 的最后一个命令              |\n\n增量搜索（`Ctrl-R`）的操作流程（原文描述，整理如下）：\n\n| 操作                    | 效果                                     |\n| --------------------- | -------------------------------------- |\n| 按 `Ctrl-R` 后输入搜索内容    | 开始反向增量搜索，提示符变为 `(reverse-i-search)'':` |\n| 再按 `Ctrl-R`           | 查找下一个匹配项（向\"上\"搜索历史记录）                   |\n| 按 `Enter`             | 直接执行匹配到的命令                             |\n| 按 `Ctrl-J`            | 将该匹配项从历史记录中复制到当前命令行，可继续编辑              |\n| 按 `Ctrl-G` 或 `Ctrl-C` | 退出搜索                                   |\n\n**本章要点速记**：\n\n1. Bash 的命令行编辑能力来自 **Readline** 库，完整快捷键列表在 Bash 手册页的 `READLINE` 一节。\n2. 场景速查：移动用 `Ctrl-A/E/F/B`、`Alt-F/B`；改错用 `Ctrl-D/T`、`Alt-T/L/U`；剪切粘贴用 `Ctrl-K/U/Y`、`Alt-D/BackSpace`；搜历史用 `Ctrl-R`。\n3. `Alt-$` 显示可能的补全结果（等价于连按两次 T | 可由文件属主读取、写入的普通文件。属组可以读取该文件，其他用户也可以读取该文件                 |\n| `-rwxr-xr-x` | 可由文件属主读取、写入、执行的普通文件。属组和其他用户可以读取、执行该文件                   |\n| `-rw-rw----` | 可由文件属主和属组读取、写入的普通文件                                     |\n| `lrwxrwxrwx` | 符号链接。所有符号链接的权限都是\"虚设\"（dummy）的。真正的权限是由符号链接指向的文件决定的        |\n| `drwxrwx---` | 目录。属主和属组可以进入该目录并在其中创建、重命名、删除文件                          |\n| `drwxr-x---` | 目录。属主可以进入该目录并在其中创建、重命名、删除文件。属组可以进入该目录，但不能在其中创建、重命名、删除文件 |\n\n表 9-4 以二进制形式和八进制形式表示的文件模式\n\n| 八进制形式 | 二进制形式 | 文件模式  |\n| ----- | ----- | ----- |\n| 0     | 000   | `---` |\n| 1     | 001   | `--x` |\n| 2     | 010   | `-w-` |\n| 3     | 011   | `-wx` |\n| 4     | 100   | `r--` |\n| 5     | 101   | `r-x` |\n| 6     | 110   | `rw-` |\n| 7     | 111   | `rwx` |\n\n表 9-5 符号表示法（指定要影响的对象）\n\n| 符号  | 含义                              |\n| --- | ------------------------------- |\n| `u` | user 的缩写，代表的是文件或目录的属主           |\n| `g` | group 的缩写，代表的是属组                |\n| `o` | other 的缩写，代表的是其他用户              |\n| `a` | all 的缩写，效果等同于 `u`、`g`、`o` 三者的组合 |\n\n操作符补充：`+` 表示添加权限，`−` 表示去除权限，`=` 表示只赋予指定权限、同时去除其他所有的权限。如果没有指定字符，则使用 all。\n\n表 9-6 符号表示法示例\n\n| 表示法         | 含义                                             |\n| ----------- | ---------------------------------------------- |\n| `u+x`       | 为属主添加执行权限                                      |\n| `u-x`       | 去除属主的执行权限                                      |\n| `+x`        | 为属主、属组、其他用户添加执行权限。等同于 `a+x`                    |\n| `o-rw`      | 去除其他用户的读写权限                                    |\n| `go=rw`     | 为属组和其他用户设置读写权限。如果属组或其他用户先前已经设置过执行权限，则将其去除      |\n| `u+x,go=rx` | 为属主添加执行权限，为属组和其他用户添加读权限和执行权限。设置多组权限时，彼此之间用逗号分隔 |\n\n表 9-7 `chown` 命令的第一个参数示例\n\n| 参数          | 结果                                       |\n| ----------- | ---------------------------------------- |\n| `bob`       | 将文件所有权由当前属主更改为用户 bob                     |\n| `bob:users` | 将文件所有权由当前属主更改为用户 bob，将文件属组更改为 users 组    |\n| `:admins`   | 将文件属组更改为 admins 组。文件属主不变                 |\n| `bob:`      | 将文件所有权由当前属主更改为用户 bob，将文件属组更改为用户 bob 的登录组 |\n\n特殊权限补充（原文文字说明，未做成编号表格）：\n\n| 特殊权限        | 八进制  | 作用                                                                                                                                                                       |\n| ----------- | ---- | ------------------------------------------------------------------------------------------------------------------------------------------------------------------------ |\n| setuid 位    | 4000 | 应用于可执行文件时，会将**有效用户 ID**（effective user ID）从真实用户 ID 更改为程序属主的有效用户 ID。当普通用户执行 setuid root 程序时，该程序将以超级用户的权限执行，可访问普通用户通常被禁止访问的文件和目录。这显然会带来安全隐患，因此允许设置 setuid 位的程序数量必须控制在最小范围内 |\n| setgid 位    | 2000 | 类似 setuid，会将**有效组 ID** 从真实用户的真实组 ID 更改为文件属主的有效组 ID。**如果对目录设置 setgid 位，那么在该目录下新创建的文件将由该目录的属组所有**，而非文件创建者的属组所有——这在共享目录中非常有用                                                |\n| 粘滞（sticky）位 | 1000 | 来自\"远古\"UNIX 的遗留产物，用于将可执行文件标记为\"不可交换\"。Linux 会忽略文件上设置的粘滞位；**如果对目录设置了粘滞位，则能够阻止用户删除或者重命名其中的文件**，除非用户是该目录的属主、或者是文件的属主、又或者是超级用户。粘滞位常用来控制对共享目录（如 `/tmp`）的访问                       |\n\n**本章要点速记**：\n\n1. `ls -l` 前 10 个字符：第 1 位是文件类型（`-` `d` `l` `c` `b`），后 9 位是\"属主/属组/其他\"各 3 位的 `rwx` 权限模式。\n2. `r`=4、`w`=2、`x`=1，三个八进制数位（如 `600`、`775`）就能描述完整模式。\n3. `chmod` 有两种写法：八进制（`chmod 600 file`）和符号（`chmod u+x,go=rx file`）；符号写法的优势是可以只改动某一类用户的权限。\n4. `umask` 是\"去除权限\"的掩码——掩码里为 1 的位，对应权限被去掉；默认常为 `0002` 或 `0022`，且只对当前 Shell 会话有效。\n5. 特殊权限：setuid（4000）、setgid（2000）、sticky（1000）；对**目录**设置 setgid 能让内部新建文件继承目录属组，这是共享目录的标准做法。\n6. `su` 起新 Shell 且加载对方环境（所以命令要加引号），`sudo` 不起新 Shell、不加载对方环境、只输自己的密码；`chown`/`chgrp` 需要超级用户权限，`passwd` 普通用户改自己、超级用户改别人。\n\n---\n\n---","tips":["`passwd` 命令会尝试强制使用\"强\"密码——太短的密码、与旧密码过于相似的密码、字典中的单词，以及太容易被猜到的密码都会被拒绝使用。\n\n**本章重要表格**：\n\n表 9-1 文件类型（`ls -l` 属性的第 1 个字符）\n\n| 属性  | 文件类型                                                            |\n| --- | --------------------------------------------------------------- |\n| `-` | 普通文件                                                            |\n| `d` | 目录
