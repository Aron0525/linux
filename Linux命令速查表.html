"++","arith-loop","bc","declare -u","loan-calc","time","+","基本参数扩展","(( foo = 5 ))","expr1?expr2:expr3","除法与求模"]},{"chapter":"第35章","title":"数组","part":"四·Shell 脚本","partNo":4,"n":12,"keys":["${!array[*]}","${#arr[@]}","${arr[*]}","+=","declare -a","hours","name=(value1 value2 ...)","name[subscript]=value","关联数组","创建数组","数组排序","数组赋空值与不带索引的引用"]},{"chapter":"第36章","title":"其他命令","part":"四·Shell 脚本","partNo":4,"n":11,"keys":["array-2","mkfifo","trap","wait","临时文件命名","使用具名管道","分组命令 / 子 Shell 用于重定向","{ command1; command2; ... }","分组命令 vs 子 Shell","( command1; command2; ... )","\u003c(list)"]}],"stats":{"cards":343,"records":306,"cats":23,"core":142,"demos":290,"opts":74,"tips":287,"chapters":36},"tips":[{"ch":"第 1 章","text":"结束终端会话的方法不止一种——关闭终端仿真器窗口、输入 `exit`、按 `Ctrl-D` 组合键均可。"},{"ch":"第 2 章","text":"初次登录或启动终端时当前工作目录就是用户主目录；普通用户只有在自己主目录中才有写文件的权限。"},{"ch":"第 2 章","text":"以点号开头的文件是隐藏文件，不加 `-a` 看不到。"},{"ch":"第 2 章","text":"相对路径与绝对路径\"殊途同归\"，该用哪种？——当然是字数少的那种。两种表示法描述的是目标在文件系统树中的相对位置：`.` 是当前工作目录，`..` 是父目录。"},{"ch":"第 3 章","text":"在 Linux 中，命令选项和文件名一样区分大小写。"},{"ch":"第 3 章","text":"Linux 系统并不要求文件名必须反映文件的内容，所以看到 `picture.jpg` 不要想当然——用 `file` 确认。原文还指出，类 UNIX 系统中存在\"万物皆文件\"的普遍观念。"},{"ch":"第 3 章","text":"运行 less 之后就能查看文件内容，如果内容多于一页可以前后翻看；按 `Q` 键可退出 less 命令。在大多数 Linux 系统中，`man` 命令也使用 less 显示手册页，所以熟悉的所有 less 命令都照样管用。"},{"ch":"第 3 章","text":"这是原文\"按图索骥\"专栏里的提醒，专门用于误看二进制文件之后的救场。"},{"ch":"第 3 章","text":"more 程序只允许向前翻页，less 可以前后翻页，另外还具有很多其他特性。"},{"ch":"第 4 章","text":"`mkdir` 命令能接收多个参数，允许在一个命令中创建两个目录。"},{"ch":"第 4 章","text":"不加 `-i` 时 `cp` 会悄无声息地覆盖同名文件，它假定用户知道自己正在做什么。在覆盖提示后输入 `y` 会使文件被覆盖，其他字符（如 `n`）会使 `cp` 命令保留同名文件。"},{"ch":"第 4 章","text":"`mv dir1 dir2` 的结果取决于 dir2 是否存在——如果目录 `dir2` 不存在，则先创建该目录，再将目录 `dir1` 及其内容移动到目录 `dir2`，然后删除目录 `dir1`；如果目录 `dir2` 已存在，则将目录 `dir1` 及其内容移动到目录 `dir2`。"},{"ch":"第 4 章","text":"**类 UNIX 系统（如 Linux）并没有还原删除命令。** 使用 `rm` 删除的文件或目录，就再也找不回来了。Linux 假定你是聪明人，知道自己在做什么。**尤其要小心通配符**：想删除目录中所有 HTML 文件时输入 `rm *.html` 没问题，但如果在 `*` 和 `.html` 之间多加了一个空格（`rm * .html`），`rm` 会删除目录中的所有文件，然后提示找不到名为 `.html` 的文件。实用窍门：只要在使用 `rm` 时用到了通配符，除仔细检查输入内容之外，还要先使用 `ls` 测试一下通配符，这样就能事先知道要删除哪些文件；然后按上方向键调出先前的命令，把 `ls` 换成 `rm`。"},{"ch":"第 4 章","text":"硬链接是最初 UNIX 创建链接的方式，默认情况下每个文件只有一个硬链接，由其为文件赋予名称；创建硬链接即为文件额外创建了一个目录项。用 `ls -li` 可以看 i 节点号来确认两个名称是不是同一个文件（见下面实战说明）。创建符号链接时，相当于用文本描述目标文件相对于符号链接的位置——`ls -l dir1` 会显示 `fun-sym -\u003e ../fun`，而且符号链接文件的大小是 6，这是字符串 `../fun` 的长度，而非它所指向的文件的大小。"},{"ch":"第 5 章","text":"从输出结果中可以看到有 3 种不同的命令（内建、别名、可执行文件路径）。注意 ls（取自 Fedora 系统）实际上是添加了 `--color=tty` 选项的 ls 命令的别名——这就是 ls 输出结果是彩色的原因。检查准备用作别名的名称是否已被占用，就靠 `type`。"},{"ch":"第 5 章","text":"`which` 只适用于可执行文件，不适用于内建命令或代替实际可执行文件的别名。"},{"ch":"第 5 章","text":"`cd` 的帮助文档简洁明了，但绝对算不上教程——其中还提到了不少尚未提及的内容。"},{"ch":"第 5 章","text":"部分程序可能不支持 `--help` 选项，不过可以先试一试——这通常会产生一条错误消息，在其中也可以发现同样的用法信息。"},{"ch":"第 5 章","text":"在大多数 Linux 系统中，`man` 使用 `less` 显示手册页，所以在浏览时熟悉的所有 less 命令都照样管用。手册页通常是难以阅读的参考文档而非学习教程——原文认为其中\"佼佼者\"当属 Bash 的手册页，输出的话密密麻麻超过 80 页，其组织结构绝对让新手感到疑惑；但手册页内容准确、用词简练，事无巨细地涵盖了方方面面。"},{"ch":"第 5 章","text":"输出结果中每行的第一个字段是手册页的名称，第二个字段是相应的节。这种方法比较粗糙，但有时倒也管用。注意，`man` 命令的 `-k` 选项和 `apropos` 命令具有相同的功能。"},{"ch":"第 5 章","text":"info 文件按树形结构组织成各个单独的节点，每个节点包含一个主题；超链接可以通过前置的星号来识别，将光标放在超链接上并按 Enter 键即可激活。原文指出，到目前为止讨论过的大部分命令行程序属于 GNU 项目的 Coreutils 软件包，`info coreutils` 会显示一个包含指向 Coreutils 内各个程序的超链接的菜单页面。"},{"ch":"第 5 章","text":"等号前后不允许出现空白字符（空格符、制表符、换行符都属于空白字符）。定义好的别名可以出现在 Shell 允许出现命令的任何地方。用已有命令名做别名并不少见，目的是为常见命令添加惯用选项（如 ls 加颜色）。在命令行定义别名有一个小问题：当 Shell 会话结束时，这些别名也会随之消失。"},{"ch":"第 5 章","text":"在 `/usr/share/doc` 中碰到以 `.gz` 扩展名结尾的文档文件，就说明它经过 gzip 压缩，需要用 `zless` 查看。"},{"ch":"第 6 章","text":"`cat` 常用于显示比较短的文本文件。没有文件名参数时它会一直等着从键盘输入，需要按 `Ctrl-D` 组合键（按住 Ctrl 再按 D）告诉它已经到达标准输入的文件末尾（End Of File，EOF）。"},{"ch":"第 6 章","text":"`ls` 指定两个目录时会输出两个各自排序的列表，在管道中加入 `sort` 就能把它们合并成一个有序列表。"},{"ch":"第 6 章","text":"`uniq` 命令通常与 `sort` 命令配合使用。"},{"ch":"第 6 章","text":"输出 3 个数字，分别是行数、单词数、字节数；把 `wc -l` 加入管道能方便地完成统计工作。"},{"ch":"第 6 章","text":"`grep` 能够匹配非常复杂的模式，不过原文目前只关注简单的文本匹配；第 19 章会讲到被称为\"正则表达式\"（regular expression）的高级模式。"},{"ch":"第 6 章","text":"`head` 和 `tail` 默认分别输出前 10 行和后 10 行，行数可以用 `-n` 调整；两个命令都可以用在管道中。"},{"ch":"第 6 章","text":"`tail -f` 会持续观察文件，这个过程直到按 `Ctrl-C` 组合键后停止。查看 `/var/log` 中的 messages 文件时，如果该文件不存在则改用 `/var/log/syslog`；因为 `/var/log/messages` 可能包含安全信息，在一些发行版中需要超级用户权限才能执行该操作。"},{"ch":"第 6 章","text":"`\u003e` 会**完全重写**目标文件。如果只重定向了标准输出而未重定向标准错误，错误消息照旧出现在屏幕上。它也提供一个小技巧：只用不带任何命令的 `\u003e 文件名`，就可以截断现有文件或者创建一个新的空文件。"},{"ch":"第 6 章","text":"重复执行相同的命令 3 次，输出文件也相应地扩大了 3 倍。如果指定的文件不存在，则像操作符 `\u003e` 一样新建该文件。"},{"ch":"第 6 章","text":"文件描述符 2 紧靠在重定向操作符之前，将标准错误重定向到目标文件。"},{"ch":"第 6 章","text":"**顺序非常重要**——标准错误的重定向操作必须在标准输出重定向之后执行，否则无法奏效。`\u003els-output.txt 2\u003e\u00261` 会把标准错误也重定向到 ls-output.txt；而如果改变顺序写成 `2\u003e\u00261 \u003els-output.txt`，标准错误会被重定向到屏幕。这个传统方法适用于旧版 Shell。"},{"ch":"第 6 章","text":"需要较新版本的 Bash 支持。"},{"ch":"第 6 章","text":"结果和传递文件参数一模一样。相较于传递文件参数，重定向标准输入并未显得特别有用，这里只表明可以使用文件作为标准输入而已。"},{"ch":"第 6 章","text":"与 `\u003e` 的区别——重定向操作符将命令与文件连接在一起，管道操作符则把一个命令的输出结果与另一个命令的输入连接在一起。别尝试 `command1 \u003e command2` 这种写法，有时候结果会很糟糕（原文举了 `ls \u003e less` 覆盖掉 less 程序的真实事故）。"},{"ch":"第 6 章","text":"位桶是一个\"古老\"的 UNIX 概念，由于其广泛性，在 UNIX 文化的诸多方面都有它的身影——如果有人说你的评论被送到了 `/dev/null`，现在你应该就知道是什么意思了。"},{"ch":"第 7 章","text":"遇到其他扩展时，如果模式输错就不会发生扩展，`echo` 会原封不动地显示错误的模式；但**参数扩展例外**——变量名拼错仍会扩展，只是结果为空的字符串（原文示例 `echo $SUER` 无输出）。"},{"ch":"第 7 章","text":"这个例子里整个**管道**的输出结果变成了 `file` 命令的参数列表——说明命令替换并不仅限于简单命令。"},{"ch":"第 7 章","text":"`.*` 会把 `.`（当前目录）和 `..`（父目录）也扩出来，可能产生错误结果；以多个点号开头的文件无法用 `.[!.]*` 显示。"},{"ch":"第 7 章","text":"算术表达式中的空格没有特别意义；圆括号可用于分组多个表达式；**仅支持整数，不能是小数**，所以除法的结果也只能是整数。第 34 章会更为详细地讨论算术扩展。"},{"ch":"第 7 章","text":"常见用途是**创建文件或目录列表**。原文示例把照片按\"年份-月份\"组织：先 `mkdir Photos`、`cd Photos`，再 `mkdir {2007..2009}-{01..12}`，得到 `2007-01` 到 `2009-12` 共 36 个目录（这些名称按数字格式排列，因此会按年代顺序排序）。"},{"ch":"第 7 章","text":"**参数扩展与其他扩展不同——变量名拼错不会\"不扩展\"，而是照样扩展为一个空字符串**。例如 `echo $SUER`（把 USER 拼错）结果是一行空白。"},{"ch":"第 7 章","text":"配合双引号使用时行为不同——`echo $(cal)` 产生 38 个参数（挤成一行），`echo \"$(cal)\"` 只产生 1 个参数（保留空格与换行）。"},{"ch":"第 7 章","text":"双引号最常见的用途就是**处理文件名中包含空白字符的情况**，阻止单词分割。"},{"ch":"第 7 章","text":"在单引号中，**反斜线不具备特殊含义**，和普通字符无异。"},{"ch":"第 7 章","text":"文件名中出现的特殊字符（包括 `$`、`!`、`\u0026`、空格符）可能对 Shell 具有特殊含义，可用转义功能消除。如果要加入反斜线本身，可以使用 `\\\\` 将其转义。注意在单引号中反斜线无特殊含义。"},{"ch":"第 7 章","text":"ASCII 编码方案中的前 32 个字符用于向电传打字机之类的设备传送命令；其中制表符、退格符、换行符、回车符比较常用，另一些则很少使用。"},{"ch":"第 8 章","text":"默认保存最近 500 个命令（多数发行版设为 1000）。"},{"ch":"第 8 章","text":"并非所有发行版都默认包含 Shell 函数。"},{"ch":"第 9 章","text":"不同发行版的 uid/gid 起始编号不同（Fedora 500、Ubuntu 1000）。"},{"ch":"第 9 章","text":"八进制和二进制之间的映射不太方便记忆，但常用的也就 7（rwx）、6（rw-）、5（r-x）、4（r--）、0（---）这几个。更多细节和选项参见 `chmod` 命令的手册页。"},{"ch":"第 9 章","text":"如果没有指定用户，那么假定其为超级用户。提示符末尾字符是 `#` 而不是 `$`，表明该 Shell 拥有超级用户权限。"},{"ch":"第 9 章","text":"与 `su` 的重要区别是——`sudo` **不需要启动新 Shell，也不用加载其他用户的环境**，所以使用 `sudo` 时**无须引用命令**（可以通过指定不同的选项来改变这种行为）。另外，在大多数配置中，第一次使用 `sudo` 之后，`sudo` 在超时之前会\"信任\"你几分钟，因此短时间内再次使用不会再次提示密码。"},{"ch":"第 9 章","text":"`chown` 根据第一个参数的形式决定改属主、改属组还是两者都改（见表 9-7）。虽然在较旧的 UNIX 版本中 `chown` 只能改属主、得用单独的 `chgrp` 改属组，但现代的 `chown` 两者都能改。"},{"ch":"第 9 章","text":"在较旧的 UNIX 版本中，`chown` 只能更改文件属主，但不能更改文件属组，为此得使用单独的 `chgrp` 命令。"},{"ch":"第 9 章","text":"`passwd` 命令会尝试强制使用\"强\"密码——太短的密码、与旧密码过于相似的密码、字典中的单词，以及太容易被猜到的密码都会被拒绝使用。"},{"ch":"第 10 章","text":"Linux 的 `ps` 命令能够模拟多种不同 UNIX 实现 `ps` 命令的行为方式。因为系统中运行着大量进程，所以 `ps` 命令产生的进程列表会特别长，将输出通过管道传给 `less` 可以便于查看；有些选项的组合也会产生不短的输出行，将终端仿真器的窗口最大化也是个好主意。"},{"ch":"第 10 章","text":"`top` 这个名称源自该命令可用于查看系统中\"位居前列\"（top）的那些进程。主流的桌面环境都提供了能够显示类似于 `top` 命令输出的图形化程序（和 Windows 的任务管理器差不多），但 `top` 命令要比这些图形化程序更好——不仅运行速度更快，在资源消耗方面也要少得多。"},{"ch":"第 10 章","text":"如果你的系统中没有 `xlogo` 程序，可以试着用 `gedit` 或 `kwrite` 代替。在某些系统中，`xlogo` 程序可能会输出警告消息，不过可以放心忽略。"},{"ch":"第 10 章","text":"结果显示有一个编号为 1 的作业，目前处于运行状态，对应的命令是 `xlogo \u0026`。"},{"ch":"第 10 章","text":"`fg` 命令后面加上百分号和作业号（称为作业参数）。**如果只有一个后台作业，作业参数可选。** 返回前台后按 `Ctrl-C` 组合键就可以终止程序。"},{"ch":"第 10 章","text":"和 `fg` 命令一样，如果只有一个作业，`bg` 命令可以不指定作业参数。如果通过命令行启动图形化程序的时候忘记在结尾添加 `\u0026`，那么将其从前台移入后台就显得非常方便了。"},{"ch":"第 10 章","text":"和文件一样，**进程也有属主，你必须是进程的属主（或者作为超级用户）才能使用 `kill` 命令向其发送信号**。发送 HUP 信号后，我们可能需要多按几次 Enter 键才能看到 Shell 的输出消息。"},{"ch":"第 10 章","text":"和 `kill` 命令一样，**你必须拥有超级用户权限才能向不属于你的进程发送信号**。"},{"ch":"第 10 章","text":"一旦执行了 `shutdown` 命令，就会向所有登录用户\"广播\"一条消息，警告他们即将发生的事件。"},{"ch":"第 11 章","text":"别名无法用 `printenv` 显示。"},{"ch":"第 11 章","text":"不同于 `printenv`，`set` 命令的输出结果是按照**字母顺序**排列的。"},{"ch":"第 11 章","text":"别名属于\"程序化数据\"，**无法使用 `set` 命令和 `printenv` 命令显示**。"},{"ch":"第 11 章","text":"这是\"环境变量\"与\"Shell 变量\"的分水岭——只有 `export` 出去的变量才会被子进程看到（`.bash_profile` 里的 `export PATH` 就是为此）。"},{"ch":"第 11 章","text":"`source` 是对**当前** Shell 生效，不需要新开会话。"},{"ch":"第 11 章","text":"**`cp` 命令会悄无声息地覆盖已有的同名文件。** 备份文件用什么名称并不重要，挑一个通俗易懂的就行，`.bak`、`.sav`、`.old`、`.orig` 都是常见的备份文件扩展名。"},{"ch":"第 11 章","text":"屏幕显示内容分为 3 个部分——顶部的标题、中间的可编辑文本和底部的命令菜单。使用下方向键或者下翻页键可以将光标移动到文件的末尾。"},{"ch":"第 12 章","text":"先不要输入任何内容！Vi 启动时处于命令模式，几乎每个按键都是命令。"},{"ch":"第 12 章","text":"如果由于某些原因 Vi 未能退出（通常是因为修改了文件但没有保存），可以加上叹号 `:q!`，告诉 Vi 强行退出。"},{"ch":"第 12 章","text":"用在\"改了文件但不想保存\"的时候。"},{"ch":"第 12 章","text":"**虽然该命令会将文件以新名称保存，但并不更改编辑中的原文件名**——用户继续编辑的文件还是 `foo.txt`，而不是 `foo1.txt`。"},{"ch":"第 12 章","text":"与 `:wq` 效果相同，只是按键方式不同。"},{"ch":"第 12 章","text":"原文件名不会丢失，只是新加入一个缓冲区。"},{"ch":"第 12 章","text":"**Vi 要求必须先保存对当前文件做出的修改之后才能切换到其他文件**。如果要放弃对文件的修改并强制 Vi 切换到另一个文件，可以在命令后添加感叹号（`!`）。"},{"ch":"第 12 章","text":"`:bn`（buffer next）和 `:bp`（buffer previous）也是更改缓冲区的另一种方法。"},{"ch":"第 12 章","text":"记住按 `Esc` 键能够退出插入模式。"},{"ch":"第 12 章","text":"**标准的 Vi 仅支持单级撤销。Vim 支持多级撤销。** 原文示例中\"连续输入 3 次 `u`，撤销删除操作\"正是因为 Vim 支持多级撤销。"},{"ch":"第 12 章","text":"Vi 无法用\"删除行尾字符\"的方式合并行，所以提供了专门的 `J` 命令。"},{"ch":"第 12 章","text":"`d` 命令\"剪切\"的内容也放进同一个粘贴缓冲区，所以 `dd` 配合 `p` 可以用来移动整行。"},{"ch":"第 12 章","text":"Vi 也能够使用正则表达式（见第 19 章）。"},{"ch":"第 12 章","text":"`%` 只是\"从第一行到最后一行\"的便捷写法，也可以写作 `1,5`（文件长度为 5 行时）或者 `1,$`；**如果未指定行范围，则仅对当前行执行操作**。不加 `g` 则仅替换每行搜索到的第一个字符串。"},{"ch":"第 12 章","text":"不同的 Linux 发行版自带的 Vim 也不尽相同，有些默认安装的是最小版本的 Vim，仅支持有限的 Vim 特性集。"},{"ch":"第 13 章","text":"如果你的系统上的显示结果和示例中的不一样，也不用担心。"},{"ch":"第 13 章","text":"把提示符设置为空会让人感到困惑。响铃可能会让人厌烦，但如果需要提醒、尤其是在执行耗时命令的时候，这反倒会很方便；有些系统禁止了响铃这个\"特性\"。原文表格里 `PS1` 的含义是\"提示字符串 1 的缩写，其中定义了 Shell 提示符的内容，该变量的可定制性很强\"。"},{"ch":"第 13 章","text":"原文特别点出——**背景色不支持粗体属性**。恢复颜色用 `\\033[0m`（对文本和背景均有效）。"},{"ch":"第 13 章","text":"这个提示符的实现代码看起来挺\"吓人\"，但可以逐段拆解（见表 13-5）。"},{"ch":"第 14 章","text":"原文提示\"`dpkg` 并没有像 RPM 那样特定的软件包更新选项\"，更新软件包时仍用 `dpkg -i` 安装新版本文件。"},{"ch":"第 14 章","text":"原文特别提示——用低层 RPM 安装不会解决依赖性问题；\"如果 RPM 发现有缺失的依赖，RPM 会显示错误消息并退出\"。"},{"ch":"第 15 章","text":"原文要求练习时注意真实设备名，不要照抄书里的名称。"},{"ch":"第 15 章","text":"正在被某个用户或进程使用的设备无法卸载，会报 `umount: /mnt/cdrom: device is busy`。最常见的坑是**工作目录正停在该挂载点里**；先把工作目录换到别处再卸载。"},{"ch":"第 15 章","text":"改动先保存在内存中，输入 `w` 才写入设备；不想修改就输入 `q` 退出（不写入任何改动）。原文说那些吓人的警告信息\"放心忽略即可\"。原文强调分区前要先把设备卸载。"},{"ch":"第 15 章","text":"命令会输出大量信息；示例输出末尾提到该文件系统会每隔一定挂载次数或天数自动检查，可用 `tune2fs -c` 或 `-i` 覆盖（原文仅在 mkfs 输出信息中提及 `tune2fs`）。"},{"ch":"第 15 章","text":"应先把设备卸载再检查；对于类 UNIX 文件系统，修复后的文件会存放在各文件系统根目录下的 `lost+found` 目录中。`/etc/fstab` 每行末尾数字对应检查优先级，`0` 表示不用例行检查；原文示例中根文件系统首先检查，然后是 home 和 boot。如今除非硬件问题（如硬盘故障），文件系统很少损坏；多数系统若在引导阶段检测到损坏会停下来，指导用户运行 `fsck`。"},{"ch":"第 15 章","text":"原文用一整段警告——`dd` 功能非常强大，其名称虽取自\"data definition\"，但有时被戏称为\"destroy disk\"（摧毁磁盘），因为用户常不小心写错 `if` 或 `of`。**按 Enter 键之前，一定要检查一遍 `if` 和 `of`。** 另外，dd 读取 CD 制作 ISO 的方法同样适用于数据 DVD，但**不适用于音频 CD**（音频 CD 不通过文件系统存储），可考虑对其使用 `cdrdao`。"},{"ch":"第 15 章","text":"原文说明 `genisoimage` 与 `wodim` 是 `cdtools` 项目分叉后的替代品（分别替代 `mkisofs`、`cdrecord`）。"},{"ch":"第 15 章","text":"可刻录 CD 在重新刻录之前需要先擦除或清空。"},{"ch":"第 15 章","text":"校验和通过复杂数学运算得到，**即便文件内容只改变某一个位，结果也会大不相同**。下载后应自己算出校验和，与发行方提供的比对。核实光盘时要\"只计算光盘中包含该 ISO 映像文件数据的那部分\"，因为光盘总以 2KB 块为单位写入；以整盘刻录模式制作的 CD-R/CD-RW 可用 `md5sum /dev/cdrom` 直接检查，许多介质（如 DVD）则需精确计算块数量（原文给出的 DVD 示例结合了 `dd bs=2048 count=...` 和 `stat -c \"%s\"`）。"},{"ch":"第 16 章","text":"ping 启动后按默认间隔（**默认 1s**）持续发送分组，需按 `Ctrl-C` 中断。原文两条提示：多数网络设备（含 Linux 主机）可配置为不响应 ICMP ECHO_REQUEST，这往往出于安全考虑以迷惑攻击者；防火墙通常也会阻塞 ICMP 流量。一次成功的 ping 表明接口卡、布线、路由、网关等各组成部分整体工作良好，正常网络显示 0% 丢包率。"},{"ch":"第 16 章","text":"没有提供标识信息的路由器（因路由器配置、网络拥塞、防火墙等原因）会用星号表示（如第 2 跳那样）。"},{"ch":"第 16 章","text":"进行网络诊断时，重要的是在每个网络接口信息第一行中寻找 **UP** 字样（表示接口已启用），并查看第 3 行的 **inet** 字段中是否存在有效 IP 地址。若系统采用 DHCP，该字段中的有效 IP 地址则能证明 DHCP 工作正常。原文指出 `ip` 命令选项很多，完整选项见手册页。"},{"ch":"第 16 章","text":"原文对路由表的解释——以 0 结尾的 IP 地址指代网络而非单独主机，代表该网络中的任意主机；`Gateway` 字段中的星号表明不需要设置网关；目的地为 `default` 的行指明目的地未在路由表中指明的流量该去哪里。原文说 netstat 选项很多，这里只讲了几个，完整选项见手册页。"},{"ch":"第 16 章","text":"FTP 以明文发送用户名和密码，因此网上几乎都是匿名服务器，允许用用户名 `anonymous` 和无意义密码登录。在 `ftp\u003e` 提示符处输入 `help` 会显示所支持的命令列表。原文评价\"虽然笨拙，但它的确管用\"。"},{"ch":"第 16 章","text":"原文提示这些特性都清晰地写在\"其质量优秀的手册页\"中。"},{"ch":"第 16 章","text":"第一次连接时会出现\"无法认证远程主机\"的提示（因为 ssh 之前从未接触过该主机），要接受远程主机凭证就输入 `yes`；随后会提示输入密码。远程 Shell 会话持续到在远程提示符输入 `exit` 为止。若本地账号与远程账号不一致，可在主机名前加用户名（`bob@remote-sys`）。**关于单引号**：`ssh remote-sys 'ls *' \u003e dirlist.txt` 用单引号是为了**不让本地主机做路径名扩展**，而在远程主机上扩展；若想把输出重定向到远程主机文件，就把重定向操作符和文件名一起放进单引号。"},{"ch":"第 16 章","text":"与 `cp` 的主要差别在于源路径或目的地路径前可以加上**远程主机名和冒号**。与 ssh 一样，若远程账号与本地账号不一致，需在远程主机名前加用户名。"},{"ch":"第 16 章","text":"相较于 ftp 的一个重要优势是**不需要远程主机运行 FTP 服务器，只要有 SSH 服务器就够了**——任何能接受 SSH 客户端连接的远程主机都可当作 FTP 服务器使用。原文窍门：许多图形文件管理器（GNOME 或 KDE）可在地址栏输入以 `sftp://` 开头的 URI 操作远程文件。"},{"ch":"第 17 章","text":"数据库不持续更新，新文件查不到；切换超级用户手动运行 `updatedb` 可解决。"},{"ch":"第 17 章","text":"手动执行需要超级用户权限。"},{"ch":"第 17 章","text":"`find` 不会排序查找结果。使用通配符模式时要放入双引号以免 Shell 做路径名扩展（如 `-name \"*.JPG\"`）。"},{"ch":"第 17 章","text":"命令参数数量不是没有限制的，可能出现命令长度超出 Shell 接受能力的情况；此时 `xargs` 会用系统支持的最大参数数量执行命令，然后重复此过程直至处理完所有参数。"},{"ch":"第 17 章","text":"用 `touch` 后再 `stat`，会发现文件的时间更新了。"},{"ch":"第 18 章","text":"压缩文件的权限和时间戳与原文件相同；解压后压缩文件被原文件替代，文件权限和时间戳也一并保留。"},{"ch":"第 18 章","text":"原文窍门——还有一个 `zless` 程序，其功能等同于上面的管道操作符。"},{"ch":"第 18 章","text":"用法和 gzip 基本上差不多——\"gzip 怎么用，bzip2 就怎么用\"。bzip2 另配有用于恢复受损 `.bz2` 文件的 `bzip2recover` 程序。"},{"ch":"第 18 章","text":"① 提取后属主可能变成执行提取的用户（除非用超级用户）。② 默认使用相对路径、去掉最前面的正斜线，提取时相对于当前工作目录，因此要恢复原位需先切换到 `/` 目录。③ 提取单个文件时结尾加 `pathname`，路径名必须和归档中保存的**相对路径名一模一样**，多个路径名也可。④ 把 `-` 指定为文件名时，按其位置代表标准输入或标准输出（这一惯例也被其他许多程序采用）。⑤ 经过 gzip 压缩的 tar 归档惯例用 `.tgz`，有时也用 `.tar.gz`；bzip2 压缩的归档用 `.tbz`。"},{"ch":"第 18 章","text":"zip 会自动添加扩展名 `.zip`，但为了清晰最好明确写出。创建时它会显示一系列消息（`adding: ... (stored 0%)`），行尾数值表示压缩率；zip 用两种方式加入文件——只存储不压缩、或压缩存储。**与 tar 相反**，若指定的归档已存在，zip 会**更新**而不是替换它。命令结尾的 `-` 被解释为\"使用标准输入作为输入文件\"。原文指出 zip/unzip 的主要用途是与 Windows 交换文件，Linux 中的首选还是 tar + gzip。"},{"ch":"第 18 章","text":"如果提取的文件与现有文件冲突，unzip 会提示用户是否替换（`replace ...? [y]es, [n]o, [A]ll, [N]one, [r]ename:`）。**unzip 不接受标准输入**，这就使 zip 和 unzip 不能像 tar 那样配合进行网络文件复制。"},{"ch":"第 18 章","text":"① 源目录名后加 `/` 只会复制目录**内容**而非目录本身（相当于 `source/*`，但会包括隐藏文件）。② 远程复制有两种方法——用 rsync + 远程 Shell（如 ssh，需加 `--rsh=ssh` 并在目标路径前加主机名），或使用作为守护进程运行的 rsync 服务器（URI 含协议 `rsync://`、主机名和路径）。③ 可用别名简化备份命令（原文示例 `alias backup='sudo rsync -av --delete /etc /home /usr/local /media/BigDisk/backup'`，加入 `.bashrc`）。"},{"ch":"第 19 章","text":"- 含元字符的正则表达式**必须加引号**，否则可能被 Shell 扩展或把 `|` 解释成管道。"},{"ch":"第 19 章","text":"`find` 与 `grep` 有重要区别——`grep` 只要行中有匹配串就输出该行，而 `find` 要求路径名**严格匹配整个正则表达式**。正因如此，例子在两端用了 `.*` 来匹配 0 个或多个字符，中间用排除型方括号表达式列出可接受的路径名字符，从而揪出含内嵌空格等不规范字符的路径名。原文用的排除集合为 `[-_./0-9a-zA-Z]`。"},{"ch":"第 19 章","text":"借助多选结构，可一次搜索包含 bin/bz、bin/gz 或 bin/zip 的路径名。"},{"ch":"第 19 章","text":"Less 会高亮标出匹配项，因此很容易一眼分辨出格式错误的号码。Vim 只支持 BRE，很多在 ERE 中被当成元字符的字符在 BRE 中是文字字符，**必须用反斜线转义才被当作元字符**。是否高亮取决于 Vim 配置；原文提醒，某些发行版（如 Ubuntu）默认提供的是精简版 Vim，可能需要用软件包管理器安装更完整的版本。"},{"ch":"第 19 章","text":"用它在压缩手册页中查找哪些程序带正则表达式功能，可以看出正则表达式应用之广。"},{"ch":"第 19 章","text":"把 `export LANG=POSIX` 写进 `.bashrc` 可以永久生效；但原文明确提醒，这样做会让系统使用美式英语（更准确说是 ASCII）作为字符集，**应三思而后行**。"},{"ch":"第 20 章","text":"`cat -A` 是排查\"从 DOS/Windows 带来的多余回车符\"的常用手段；原文提到，也有 `dos2unix` / `unix2dos` 可以互转，或者干脆删掉多余的回车符（后文的 `tr`/`sed` 就能做）。"},{"ch":"第 20 章","text":"- 默认情况下字段由空白字符（空格、制表符）分隔，**排序时分隔符也包含在字段中**。例如 `William Shotts` 被看作两个字段：William、Shotts。"},{"ch":"第 20 章","text":"`uniq` **只能删除连续的重复行**，所以必须先 `sort`。原文\"窍门\"还指出：GNU 版 `sort` 支持 `-u` 选项，同样能删除有序输出中的重复行。"},{"ch":"第 20 章","text":"`cut` 提取文本的方式\"相当死板\"，适合处理其他程序产生的规整文件，而不适合直接处理用户输入。对制表符分隔的文件，最好用 `-f` 提取字段而不是 `-c` 提取字符——因为每行字符数通常不一致，难以计算字符位置。原文还介绍了 `expand`（把制表符换成相应数量的空格，便于用 `cut -c`）和 `unexpand`（用制表符替换空格）："},{"ch":"第 20 章","text":"排列顺序由 `paste` 的**参数顺序**决定。"},{"ch":"第 20 章","text":"**两个文件必须依据关键字字段排好序**，`join` 才能正常工作。默认 `join` 用空白字符作输入字段分隔符、单个空格作输出字段分隔符；可用选项修改（详见手册页）。"},{"ch":"第 20 章","text":"`comm` 输出 3 列——第 1 列是第一个文件独有的行，第 2 列是第二个文件独有的行，第 3 列是两文件共有的行。"},{"ch":"第 20 章","text":"默认格式每组变动前有\"范围 操作 范围\"形式的**变动命令**（见下表 20-4），这种格式主要用于 POSIX 合规与向后兼容，不如上下文格式、合并格式常用。合并格式与上下文格式最明显的区别是**去除了重复的上下文行**。"},{"ch":"第 20 章","text":"**无需指定目标文件**——采用合并格式的 diff 文件已在文件头部包含了目标文件名。原文强调 `diff`/`patch` 的两个优势：diff 文件比整个源代码树小得多；diff 文件简洁地描述了改动，便于审阅。它同样适用于配置文件或其他文本。"},{"ch":"第 20 章","text":"大多数情况下两个字符集合长度应相同，但**第一个集合可以更长**。`-s` 挤压时，重复字符必须是**连续的**，否则不会有挤压效果。`tr` 只对标准输入操作、结果送到标准输出。"},{"ch":"第 20 章","text":"- sed 命令以**单字母**开头；替换命令是 `s`，其后紧跟\"查找—替换\"字符串，之间用分隔符（惯例是正斜线，但可用命令之后的任意字符）。自由选择分隔符能提高可读性（如处理含 `/` 的日期时可改用别的分隔符）。"},{"ch":"第 20 章","text":"检查模式下顶部高亮显示疑似拼错的单词，中间给出编号 0～9 的拼写建议和操作清单，底部是接受选择的提示符。**除非用 `--dont-backup` 事先告知，否则 aspell 会创建以原文件名加扩展名 `.bak` 的备份文件**。默认情况下，aspell 会忽略文本中的 URL 和电子邮件地址。"},{"ch":"第 21 章","text":"`nl` 支持**逻辑页（logical pages）**，能把编号重置，指定起始编号和编号格式；逻辑页又分为页眉、正文、页脚三部分，每部分可重置行号或设置不同样式。若指定多个文件参数，`nl` 会把它们视为**单个文本流**。默认情况下，`nl` 只对属于逻辑页**正文**部分的文本流进行行编号。"},{"ch":"第 21 章","text":"不加 `-s` 时，折行**不考虑单词边界**，会把单词从中间截断。"},{"ch":"第 21 章","text":"默认情况下空行、单词间空格、缩进都会保留；具有不同缩进的连续输入行**不会**被连接；制表符在输入时扩展、并在输出中出现。因此 `fmt -w 50` 会保留第一行缩进导致输出难看，加 `-c` 即可纠正。使用 `-p` 时，相邻的注释行会被连接，而空行和不以指定内容开头的行则保留。`fmt` 倾向于在**句末**断行，并尽量避免在句子首词之后或末词之前断行。"},{"ch":"第 21 章","text":"这里把页面定义为长 15 行、宽 65 列；`pr` 会生成包含**文件修改时间、文件名、页码**的默认页眉。第 22 章还会讲到更多控制页码布局的选项。"},{"ch":"第 21 章","text":"与本章其他命令不同，`printf` **不适用于管道（不接受标准输入）**，也较少直接在命令行使用（多用于脚本），但它应用范围很广。格式化字符串里可以包含普通文本、转义序列（如 `\\n`、`\\t`）以及以 `%` 开头的**转换说明**。"},{"ch":"第 21 章","text":"手册页是经 gzip 压缩的文本文件，位于 `/usr/share/man` 目录，由 groff 用 `mandoc` 宏软件包渲染。原文\"窍门\"：UNIX 系统常用 `format2format` 形式命名格式转换程序，可用 `ls /usr/bin/*[[:alpha:]]2[[:alpha:]]*` 找出它们，也可搜索名为 `formattoformat` 的程序（安装 TEX 可查看 `texlive` 软件包与 LyX 编辑器）。"},{"ch":"第 21 章","text":"`.TS` 和 `.TE` 请求分别作为表格的开始与结束；`.TS` 之后的行定义表格全局属性（本例为内容水平居中并用框线环绕），其余部分定义每行布局。原文特别提醒：**要确保 `Name`、`Version`、`Released` 三个单词之间用制表符分隔，绝不能用空格符**。"},{"ch":"第 22 章","text":"原文强调，改用与默认不同的字号/页宽时，**必须同步调整 `pr` 的选项**来适应新的页面大小（例如示例中把列数改成 `-4`、宽度改成 `-w 90`、长度改成 `-l 88`）。"},{"ch":"第 22 章","text":"待打印内容会被发送至系统的默认打印机；不指定 `-P` 时就用默认打印机。原文还提示：很多 Linux 发行版允许定义一台把文件输出为 PDF 的「打印机」而不是物理打印机，这对练习打印命令很方便，需要检查打印机配置程序是否提供该功能（有些发行版要额外安装如 `cups-pdf` 的软件包）。"},{"ch":"第 22 章","text":"原文指出，该管道用比默认规格更小的字体生成了 4 列列表；每英寸增加的字符数使一页纸能容纳更多列。"},{"ch":"第 22 章","text":"默认打印布局是「双幅」（two-up）格式，即一张纸上打印两页内容，并会自动添加漂亮的页眉和页脚，对应原文图 22-1。另外原文提示：还有另一种把文本转成 PostScript 的输出格式化工具叫 **enscript**，可执行很多与 `a2ps` 相同的格式化和打印操作，但它**只接受文本输入**。"},{"ch":"第 22 章","text":"`-a` 显示的是**打印队列接受打印作业的能力，并非物理打印机的状态**。示例中可看出 `printer` 是默认打印机，并且是一台通过互联网打印协议（IPP）连接在 print-server 上的网络打印机。"},{"ch":"第 22 章","text":"未指定打印机（使用 `-P` 选项）时，显示系统默认打印机的打印队列状态。"},{"ch":"第 22 章","text":"与 `cancel` 基本功能一样，但在支持的选项方面略有不同。"},{"ch":"第 22 章","text":"`cancel 603` 中的 603 是上一节 `lp` 输出里给出的作业号（`request id is printer-603`）。"},{"ch":"第 22 章","text":"原文说明 `^H`（Ctrl-H）代表退格符，用于产生粗体效果；类似地也能看到退格符/下画线序列形成的下画线效果。"},{"ch":"第 23 章","text":"输出结果显示已经安装了 GCC。原文提示：你的 Linux 也许提供了一个用于软件开发的**元软件包（meta-package，即软件包集合）**，可以考虑安装它以便编译程序；如果系统没有提供元软件包，就尝试安装 GCC 和 make 软件包，对多数系统这已足够完成本章练习。"},{"ch":"第 23 章","text":"原文注释说明，编译源代码时我们就是源代码的「维护人员」，将其存放在 `~/src` 目录中；系统自行安装的源代码一般位于 `/usr/src`，而面向多用户使用的源代码通常位于 `/usr/local/src`。"},{"ch":"第 23 章","text":"连接到 FTP 站点后可查看可用的 `.tar` 文件列表并从中挑选**最新版本**下载。原文也说明还有其他下载源代码的方法，例如 GNU 项目还支持使用 HTTPS 下载。"},{"ch":"第 23 章","text":"原文提到一条源代码压缩标准——解压 `.tar` 文件时会创建一个包含源代码树的目录，命名形式为 `project-x.xx`（项目名称加版本号），这便于安装同一程序的不同版本。**但在解压之前最好先检查源代码树的布局结构**：有些项目不会创建目录，而是把所有文件直接放进当前工作目录，这会把井然有序的 `src` 目录弄得一团糟，因此建议先用 `tar tzvf tarfile | head` 检查。"},{"ch":"第 23 章","text":"源代码文件就是普通的文本；makefile 也只是普通的文本文件，所以可以用 `less` 查看其内容。"},{"ch":"第 23 章","text":"**必须加 `./`**——因为 `configure` 并没有存放在 Shell 惯常查找程序的目录中，加 `./` 是明确告知 Shell 该程序位于当前工作目录中。执行过程中会输出大量测试与配置消息，**重要的是没有出现错误消息**；如果有错误，则配置失败，并且不会生成可执行文件，直到纠正所有错误。"},{"ch":"第 23 章","text":"所有目标文件都已存在时，`make` 会判定无须任何操作（`make: Nothing to be done for 'all'.`）；删除 `getopt.o` 后，`make` 会重新构建 `getopt.o` 并**重新链接** `diction` 和 `style`，因为两者依赖丢失的目标文件。`make` 坚持目标文件要比其依赖文件新，所以用 `touch` 更新源码后 `make` 会重新构建；执行过后目标文件就比依赖文件更新了。`make` 的用途并不局限于编译源代码，还可用于所有需要维护目标及其依赖关系的任务。"},{"ch":"第 23 章","text":"安装目录一般是 `/usr/local/bin`，这是本地构建软件的传统安装位置；但普通用户对它没有写入权限，**必须切换成超级用户才能进行安装**（所以用 `sudo`）。"},{"ch":"第 23 章","text":"`touch` 之后 `ls -l` 会看到该文件时间变成当前时刻，`make` 随即重建受影响的文件。"},{"ch":"第 23 章","text":"原文总结为「使用 3 个简单的命令（`./configure`、`make`、`make install`）来构建源代码软件包」；构建过程中如果 `configure` 或 `make` 报错，必须先纠正错误才能得到可执行文件。"},{"ch":"第 24 章","text":"脚本的第一行看起来似乎是注释（因为以 `#` 开头），但 `#!` 序列是特殊构件。**所有的 Shell 脚本都应该将其作为第一行。** 另外，Vim 的语法高亮特性要求所编辑的文件必须含有 shebang，以表明这是一个 Shell 脚本文件。"},{"ch":"第 24 章","text":"原文说明，尽管很少会在命令行中这样使用注释，但这个规则确实可行。"},{"ch":"第 24 章","text":"脚本最后一行就是一个带有字符串参数的 `echo` 命令。"},{"ch":"第 24 章","text":"**脚本必须具有读取权限才能执行。**"},{"ch":"第 24 章","text":"**要想执行脚本，必须在脚本名称之前指定路径**。如果不这么做："},{"ch":"第 24 章","text":"如果脚本位于列表中的任何一个目录，问题就迎刃而解了。注意列表中的第一个目录 `/home/me/bin`——大多数 Linux 发行版会在 `PATH` 中加入用户主目录下的 `bin` 目录。"},{"ch":"第 24 章","text":"原文补充，对于 Ubuntu（以及多数基于 Debian 的系统），在执行用户的 `.bashrc` 文件时如果 `~/bin` 目录已存在，则自动将其加入 `PATH`；在 Ubuntu 中创建好 `~/bin` 后注销再重新登录，一切就都妥当了。"},{"ch":"第 24 章","text":"改动会在**每个新的终端会话**中生效。"},{"ch":"第 24 章","text":"**为了减少输入，在命令行上输入选项时短选项更为可取；但是在编写脚本时，长选项可以增强可读性。**"},{"ch":"第 24 章","text":"该技术也适用于命令行，不过很少会用到，原因在于其不便于输入和编辑。**脚本和命令行的一个区别是：脚本可以使用制表符来实现缩进，而命令行却无法实现，因为按 Tab 键会激活自动补齐功能。**"},{"ch":"第 24 章","text":"把这些命令（**不包括开头的冒号**）加入你的 `~/.vimrc` 文件，就能使改动永久有效。"},{"ch":"第 25 章","text":"使用变量不需要声明，Shell 会自动创建。例如 `foo=\"yes\"` 后 `echo $foo` 输出 `yes`，而 `echo $fool`（拼错名字）会扩展为空字符串 `echo`，什么都输出不了。由此「一定要加倍注意自己的拼写」。"},{"ch":"第 25 章","text":"变量名拼错时，Shell 会「很乐意创建该变量」并设默认空值，于是 `echo $fool` 完成参数扩展后的结果就是 `echo`。同理 `cp $foo $fool` 会报："},{"ch":"第 25 章","text":"失败的原因是 Shell 把 `mv` 命令的第二个参数解释为一个新变量（内容为空）。加上花括号后，Shell 就不会再认为末尾的 `1` 属于变量名的一部分了。"},{"ch":"第 25 章","text":"原文提醒把变量和命令替换置于**双引号**内，以限制 Shell 对其进行单词分割。"},{"ch":"第 25 章","text":"Shell 会阻止之后对 `TITLE` 的赋值操作。**这个特性很少被使用，只有在非常正式的脚本中才会看到它**；同理，用 `-i` 强制整数也很少见。"},{"ch":"第 25 章","text":"`here document` 和 `echo` 大同小异，只不过**在默认情况下，here document 中的单引号和双引号不具备特殊含义**——Shell 并没有理会引号，只是将其作为普通字符对待，这使在 here document 中能够随意嵌入引号，对 HTML 报告程序非常方便。"},{"ch":"第 25 章","text":"**该特性多少存在一些问题，因为很多文本编辑器（以及程序员自身）偏好在脚本中使用空格符来代替制表符实现缩进效果**——用空格缩进时 `\u003c\u003c-` 不会生效。"},{"ch":"第 25 章","text":"这种做法在命令行中也管用，此时每行开头会出现 `\u003e` 提示符（保存在变量 `PS2` 中）。"},{"ch":"第 25 章","text":"程序执行时 HTML 文档内容会出现在显示器上，这是因为脚本中的 `echo` 命令会把输出发送至标准输出。另外，也可以直接在浏览器里用地址 `file:///home/username/foo.html` 查看保存好的 HTML 文件。"},{"ch":"第 26 章","text":"Shell 读取脚本时会**跳过函数定义部分**，从主程序起点开始执行；调用 `step2` 时控制权转移到函数体，执行完 `return` 后回到调用之后的下一行。**函数定义必须出现在调用之前**，否则调用会被当作外部程序名称。"},{"ch":"第 26 章","text":"**这两种形式都是等价的，可以交换使用**。"},{"ch":"第 26 章","text":"执行结果里出现几个空行却不清楚原因时，最好的办法是在函数里加反馈信息（原文演示把空函数改成 `echo \"Function report_uptime executed.\"` 之类），就能看出这 3 个函数实际上都执行了。"},{"ch":"第 26 章","text":"两个函数中对局部变量 `foo` 的赋值也不影响函数外定义的 `foo`。该特性有助于阻止程序各部分相互干扰，并使函数可移植。"},{"ch":"第 26 章","text":"`$(uptime)` 两边的 `\u003cpre\u003e` 标签用于**保留该命令的格式**。`report_home_space` 用 `du -sh /home/*` 并非完整解决方案：尽管在某些系统（如 Ubuntu）中可行，但在其他系统中不管用，原因在于很多系统设置了主目录权限，避免所有用户都能读取其中的内容（这种安全措施是合理的）；在这类系统中该函数只能以超级用户权限执行脚本才能正常工作，**一种更好的解决方案是让脚本能够根据用户权限调整自己的行为**（留待第 27 章讨论）。"},{"ch":"第 26 章","text":"如前述，该方案在多用户系统上可能因主目录权限而失效，需要超级用户权限或按权限调整行为。"},{"ch":"第 26 章","text":"**任何只要能写进脚本的内容，Shell 函数都支持**；而别名受限于其所支持的命令类型和 Shell 特性。"},{"ch":"第 27 章","text":"`if` 之后若是命令列表，**只有最后一个命令的退出状态起作用**——`false; true` 整体算成功，`true; false` 整体算失败。嵌套判断时需要层层的 `fi` 收尾（见本章文件表达式示例脚本）。"},{"ch":"第 27 章","text":"示例中第二次执行 `ls` 指定了不存在的目录，产生错误，`$?` 为 2 表明命令出错。有些命令用不同的退出状态值供诊断错误，不少命令失败时只返回 1。"},{"ch":"第 27 章","text":"`test` 使用的所有表达式和操作符都被 Shell 视为命令参数，所以 `\u003c`、`\u003e`、`(`、`)` 等特殊字符**必须引用或转义**。"},{"ch":"第 27 章","text":"要把参数 `$FILE` 用引号括起来，防止参数为空或只含空白字符时操作符被当成普通字符串。另外要注意脚本结尾的 `exit`（见下一条）。"},{"ch":"第 27 章","text":"按照这种方法使用 `exit`，如果 `$FILE` 扩展为一个不存在的文件名时，脚本能够提示失败。**`exit` 命令出现在脚本的最后一行只是一种形式而已**——这样当脚本执行到最后时会以最后执行的命令的退出状态结束。"},{"ch":"第 27 章","text":"**如果想将脚本转换为一个 Shell 函数、使其包含在更大的程序中，可以使用 `return` 命令替代 `exit` 命令**，就能得到想要的效果。"},{"ch":"第 27 章","text":"通过正则表达式可以把 `INT` 的值限制为「只能是以可选的减号起始、后跟一个或多个数字的字符串」，同时也消除了 `INT` 为空值的可能。`==` 的路径名模式匹配能力使 `[[ ]]` 在评估文件和路径名时得以发挥作用。"},{"ch":"第 27 章","text":"这里使用了 `\u003c` 和 `\u003e`，`==` 则用于测试相等性，**这种语法在处理整数时看起来更自然**。由于 `(())` 复合命令是 Shell 语法的一部分而非普通命令，并且只能处理整数，因此它能够**通过名称来识别变量，不需要执行扩展操作**。"},{"ch":"第 27 章","text":"该命令会创建名为 `temp` 的目录，如果创建成功，就把当前工作目录更改为 `temp`——第二个命令仅在 `mkdir` 成功的情况下才会执行。"},{"ch":"第 27 章","text":"第一条命令测试目录 `temp` 是否存在，仅当测试失败时才创建此目录。这种结构**便于在脚本中处理错误**：如果脚本需要目录 `temp` 而该目录又不存在，则脚本返回退出状态值 1 并终止。"},{"ch":"第 27 章","text":"我们对 `id` 命令的**输出结果**进行判断（配合命令替换与 `-eq 0` 比较）。这样就能创建两个不同的 here document：一个用于超级用户，另一个用于用户自己的主目录。"},{"ch":"第 27 章","text":"原文明确指出：`echo` 命令使用了重定向，将错误消息重定向到标准错误，**这是处理错误消息的正确方式**。"},{"ch":"第 28 章","text":"- **别把 `read` 放入管道**。原文明确写道：虽然 `read` 命令通常从标准输入获取输入，但你不能这么做："},{"ch":"第 28 章","text":"原文强调，把变量赋值放在命令之前显然是一种更为简洁的实现方式（相比上面的保存/恢复写法）。"},{"ch":"第 28 章","text":"**这种赋值的效果是临时的**，对环境所做的改动仅限于该命令执行期间有效。原文举例：在例子中 `IFS` 的值被改为 `:`，但只在该次 `read` 期间生效。"},{"ch":"第 28 章","text":"原文点出了它相对管道的优势——不能用下面这种写法，因为管道会创建子 Shell："},{"ch":"第 28 章","text":"原文说明，使用带有 `-n` 选项的 `echo` 命令来显示提示信息，然后使用 `read` 命令将输入赋给变量。"},{"ch":"第 28 章","text":"原文说明该脚本会提示用户进行输入，然后分析确定用户输入的内容；脚本用到了之前学过的概念，其中包括 Shell 函数、`[[]]`、`(())`、`\u0026\u0026`、`if`，还有恰到好处的正则表达式。原文还强调：每次程序接收到输入的时候，都要执行此类检查，以防止非法数据。"},{"ch":"第 28 章","text":"原文指出该脚本在逻辑上分为两部分：第一部分展示菜单并获取用户输入，第二部分识别输入并执行相应的菜单项功能。关于脚本中多处 `exit` 的用法，原文写道：程序中存在多个出口通常不是什么好事（这会导致程序逻辑难以理解），但是在这个脚本中倒没什么问题。"},{"ch":"第 29 章","text":"注意 `while-menu` 脚本中判断条件写在 `do` 之前、使用 `REPLY` 的当前值；这里还沿用了第 28 章的 `[[ \"$REPLY\" =~ ^[0-3]$ ]]` 输入验证。"},{"ch":"第 29 章","text":"原文提示，究竟该用 `while` 还是 `until`，通常取决于哪种循环能够写出比较清晰的测试。"},{"ch":"第 29 章","text":"原文强调，因为循环不会自己结束，所以需要程序员提供某种方式使其在恰当的时刻跳出循环；在该脚本中，如果用户选择了 0，`break` 命令用于退出循环。"},{"ch":"第 29 章","text":"原文说明，为了使脚本执行更加高效，在处理菜单选项的脚本部分的结尾使用了 `continue`；在确认用户选择之后，`continue` 使脚本可以跳过不必要的代码。举例来说，如果确认用户选择了 1，就没必要再测试其他选项了。"},{"ch":"第 29 章","text":"原文写道，“这是一种几乎人人皆知的脚本技术”。因为循环不会自己结束，所以需要程序员提供某种方式使其在恰当的时刻跳出循环。"},{"ch":"第 29 章","text":"原文以 `distros.txt` 文件为例演示。注意重定向写在 `done` 之后，而不是写在 `read` 命令上。"},{"ch":"第 29 章","text":"原文特别警告——**由于管道使循环在子 Shell 中执行，任何在循环内创建或复制的变量在循环结束后都荡然无存，这点儿很重要，一定要记住。**"},{"ch":"第 30 章","text":"原文指出，在有些脚本中，尤其是长脚本，有时候将其中与问题相关的部分隔离出来还是有必要的；**这部分未必就是问题所在，但是往往能帮助我们发现实际原因。**"},{"ch":"第 30 章","text":"原文给出两个刻意的做法——**将信息发送至标准错误**，以便与正常输出结果区分开；另外，**没有对包含消息的代码行进行缩进**，这样在需要删除这些行的时候更容易查找。"},{"ch":"第 30 章","text":"原文说明——启用跟踪后，我们可以查看命令经过扩展之后的执行情况。**行首的加号表示此行是跟踪显示的结果，以区别于一般的输出结果。** 加号是用于跟踪输出的默认字符，是由 Shell 变量 `PS4`（Prompt String 4）设定的。"},{"ch":"第 30 章","text":"原文特别指出——**单引号用于将扩展推迟到真正使用提示符的时候。**"},{"ch":"第 30 章","text":"原文说明——在这个简单的例子中，我们只显示了变量 `number` 的值，并使用注释标记出了额外添加的行，以便于后续的识别和删除。**这项技术在观察脚本中的循环和算术运算行为时尤其有用。**"},{"ch":"第 31 章","text":"- 一个分支里可以写多条命令（如 `0)` 分支先 `echo` 再 `exit`），**多条命令要在最后一个 `;;` 之前写完**；"},{"ch":"第 31 章","text":"原文指出，把 `*)` 作为 `case` 命令最后一个模式是一种不错的做法，可以匹配之前的模式无法匹配到的内容，也就是说，能捕获到所有的“漏网之鱼”。"},{"ch":"第 31 章","text":"有了 `;;\u0026`，`case` 就可以继续测试模式，而不再直接终止。原文中这两个脚本还演示了 `read -n 1 -p \"Type a character \u003e \"` 的用法：只读入 1 个字符（此时输入值进入 `REPLY`），脚本里紧接着单独一行 `echo` 用于输出一个换行。"},{"ch":"第 32 章","text":"原文强调，就算没提供参数值，`$0` 也始终出现在命令行中的第一项，表示执行程序的路径。"},{"ch":"第 32 章","text":"原文以\"注意\"框专门提示这一点：能通过参数扩展访问的位置参数不止 9 个。"},{"ch":"第 32 章","text":"原文用\"通配符 `*` 被扩展成 82 个参数\"的场景说明问题：参数太多时，靠 `shift` 在循环里始终只和 `$1` 打交道，虽然\"有些笨拙\"，但能解决问题。"},{"ch":"第 32 章","text":"原文结论是\"$*\"会把所有参数压成 1 个单词，不保留各参数原本的整体性。"},{"ch":"第 32 章","text":"原文明确说，在 Shell 提供的 4 种获取位置参数列表的方法中，\"到目前为止，`\"$@\"` 适用于大部分情况，因为其保留了每个位置参数的整体性。为了保证安全性，你应该坚持使用这种方法，除非你有令人信服的原因。\""},{"ch":"第 32 章","text":"不用引号时 `${animals[*]}` 与 `${animals[@]}` 效果一样（该说法见第 35 章数组部分的同类演示逻辑）；本章结论是\"$@\"最符合实际意图。"},{"ch":"第 32 章","text":"原文指出，把 `basename \"$0\"` 的结果存进 `PROGNAME` 后，\"就算程序改了名，消息也会自动调整，显示正确的程序名称\"。"},{"ch":"第 32 章","text":"原文提示：`PROGNAME` 变量被改成了 Shell 变量 `FUNCNAME`。`$0` 始终包含的是命令行中第一项（也就是程序名）的完整路径，并不包含 Shell 函数名。另外，函数内用 `return 1` 而脚本用 `exit 1` 是原文写法的区别。"},{"ch":"第 32 章","text":"原文提到，有了这种能力，\"我们便可以编写出很多实用的 Shell 函数，不仅能将其用在脚本中，还能将其应用于 .bashrc 文件\"。"},{"ch":"第 32 章","text":"原文特别提醒 `-f` 的处理方式：\"如果发现有该选项，会再执行一次 `shift`，并将 `-f` 选项的文件名参数移入位置参数 `$1` 中。\""},{"ch":"第 32 章","text":"原文说明：`case` 语句只检查用户选择的是覆盖文件还是退出程序，其他选择会使循环继续执行，再次向用户发出提示信息。如果用户选择覆盖已有文件，执行 `break` 停止循环。"},{"ch":"第 32 章","text":"原文解释，\"这两处测试分别考虑到了输入的路径是否无效（`touch` 会执行失败）以及如果文件已存在，其是否为普通文件\"。"},{"ch":"第 33 章","text":"`for` 在命令行中也可以发挥作用（上面的例子就是直接在命令行跑的）。"},{"ch":"第 33 章","text":"原文提出一个必须注意的坑：\"要注意检查路径名扩展是否的确有匹配，在默认情况下，如果路径名扩展未能匹配到任何文件，则返回通配符本身（在这个例子中，就是 distros*.txt）。\"通过加入文件存在测试，就能忽略失败的扩展。"},{"ch":"第 33 章","text":"\"有一处地方要注意，不同于惯常的实践，我们这次并没有将命令替换 `$(strings \"$1\")` 放入双引号中。这是因为我们正是想要对命令替换的结果进行单词分割，以此得到单词列表。如果加上了双引号，得到的就只是一个包含了文件中所有字符串的单个单词，这可不是我们想要的。\""},{"ch":"第 33 章","text":"原文对比了这次改写：外围的 `while` 循环改成了 `for` 循环；因为忽略了单词列表，循环转而处理位置参数；循环内部原先的变量 `i` 被改成了变量 `j`；末尾的 `shift` 也用不上了。"},{"ch":"第 33 章","text":"原文说明这种形式就其功能而言等价于："},{"ch":"第 34 章","text":"原文指出，变量名前紧跟其他文本时\"花括号就不能少了，否则可能会对 Shell 造成混淆\"。"},{"ch":"第 34 章","text":"这类扩展在处理位置参数缺失以及为参数设置默认值的时候非常方便。"},{"ch":"第 34 章","text":"原文以\"注意\"框提示：\"位置参数和其他特殊参数不能用这种方法复制。\""},{"ch":"第 34 章","text":"原文说\"这项功能仅在一些非常特殊的情况下才会用到\"，并说明\"根据 Bash 文档，这两种扩展形式的效果是一样的\"。"},{"ch":"第 34 章","text":"原文在改进 `longest-word` 时用 `${#j}` 取代了命令替换 `$(echo -n $j | wc -c)` 及其产生的子 Shell，效率提升明显（见下方性能对比卡片）。"},{"ch":"第 34 章","text":"原文强调：如果 `offset` 是负值，\"一定要在前面加一个空格符，以免和 `${parameter:-word}` 扩展混淆\"（即写成 `${foo: -5}` 这种带空格的形式）。"},{"ch":"第 34 章","text":"同类技巧在本书其他脚本中也用到，例如 `j=\"${i#0}\"` 用于删除小时数的前导 0（见第 35 章），以及 `PROGNAME=\"${0##*/}\"` 用于取得去掉路径的文件名（见本章 `loan-calc`）。"},{"ch":"第 34 章","text":"原文指出，\"字符串操作扩展可以取代 `sed` 和 `cut` 等常见命令。有了扩展，就不再需要使用外部程序，从而提高了脚本的效率。\""},{"ch":"第 34 章","text":"原文结论：\"原始版本耗费了 3.618s 扫描文本文件，而使用了参数扩展的新版本只用了 0.06s，效率改善惊人。\""},{"ch":"第 34 章","text":"原文解释了大小写转换的实际用途：用户输入的字符串可能全大写、全小写或大小写混合，我们不愿在数据库里存入各种大小写组合，因此常用方法是规范用户输入——在进行数据库查询之前把输入转换为标准形式（统一转小写或大写），确保以相同的方式对数据库条目进行规范化。"},{"ch":"第 34 章","text":"原文说明：\"尽管脚本使用的是第一个位置参数，但 `parameter` 也可以是字符串、变量或者字符串表达式。\""},{"ch":"第 34 章","text":"原文强调\"Shell 的算术操作仅适用于整数\"，因此除法结果永远是整数（见下方除法与求模卡片）。"},{"ch":"第 34 章","text":"原文说明：\"求模在循环中用得上，它使操作在循环过程中按照特定的间隔执行。\""},{"ch":"第 34 章","text":"原文以\"注意\"框强调 `=` 与 `==` 的区别：\"单个 `=` 执行赋值操作，`foo = 5` 表示'使 foo 等于 5'。而 `==` 用于判断等量关系，`foo == 5` 表示'foo 是否等于 5'。\"原文还说，在 Shell 中情况可能让人有点儿困惑，因为 `test` 命令使用 `=` 判断字符串是否相等，这也正是使用更加现代的复合命令 `[[ ]]` 和 `(( ))` 代替 `test` 的另一个原因。"},{"ch":"第 34 章","text":"原文说这种\"返回后再变\"的行为\"非常奇怪，但却是有意为之的\"；并给出结论：\"对于绝大多数 Shell 应用，前置操作符最为实用。\""},{"ch":"第 34 章","text":"原文给出一条易错点：表达式中的赋值操作并没有那么简单、直接。如果直接赋值，Bash 会报错："},{"ch":"第 34 章","text":"原文解释：最初变量 `finished` 被设置为 0（算术假值），继续执行循环，直到变量不为 0；在循环结尾评估计数变量的值，如果其小于 10（最大迭代次数），增加 1；否则，将 1 赋给变量 `finished`，使之成为算术真值，从而终止循环。"},{"ch":"第 34 章","text":"原文提示\"仔细查看，可以在底部的版权信息之后找到计算结果\"，`-q` 选项可以禁止显示这些版权信息；\"能从标准输入获取输入意味着我们能够使用 here document、here string、管道将脚本传入 bc\"。"},{"ch":"第 34 章","text":"原文解释该例计算了贷款总额为 $135000 的月支付额，贷款期 180 个月（15 年），年利率 7.75%；并提醒\"注意计算结果的精度，这是由 bc 脚本中的特殊变量 `scale` 指定的\"，以及\"bc 脚本编程语言更接近于 C 语言\"。"},{"ch":"第 35 章","text":"原文指出，第二个命令显示了第一个元素的值，\"其中的花括号是为了避免 Shell 试图对数组元素名执行路径名扩展\"。"},{"ch":"第 35 章","text":"原文说明\"通过 `-a` 选项，`declare` 创建了数组 a\"；而关联数组\"必须使用 `declare` 命令的 `-A` 选项创建\"。"},{"ch":"第 35 章","text":"索引从 0 开始，这是本章反复强调的易错点。"},{"ch":"第 35 章","text":"原文说这两种方法分别用于\"多个值\"和\"通过指定各个值的索引，将值赋给特定元素\"。"},{"ch":"第 35 章","text":"原文说明该脚本由 4 部分组成：检查参数是否为目录；把数组所有元素赋值为 0 完成初始化（\"数组在使用之前并不是必须做预处理，但是我们的脚本需要确保所有元素不为空\"）；用 `stat` 采集数据（其中要删掉小时数的前导 0，否则会被当成八进制）；最后分 4 列显示数组内容并输出总文件数。"},{"ch":"第 35 章","text":"原文结论：如果不使用引号，`${animals[*]}` 和 `${animals[@]}` 的效果一样。`*` 表示法会产生一个包含数组全部内容的单词，而 `@` 表示法会产生 3 个长度为 2 个单词的字符串，这正是数组\"真正的\"内容。"},{"ch":"第 35 章","text":"原文强调一个重要差异：\"在为数组元素 100 赋值字符串的时候，Bash 报告该数组只有一个元素。这和有些编程语言的不一样，后者会将未使用的数组元素（元素 0～99）初始化为空并纳入统计范围。在 Bash 中，数组元素仅在被赋值的时候才存在，无论其索引是什么。\""},{"ch":"第 35 章","text":"原文说明：\"该脚本利用命令替换技巧，将原始数组（a）的内容复制到另一个数组（a_sorted）。通过更改命令管道设计，这个技巧可用于多种数组操作。\""},{"ch":"第 35 章","text":"原文提醒两点：此例删除了数组的第 3 个元素（索引为 2），\"记住，数组元素从索引 0 开始，而不是 1！\"；另外\"一定要把数组元素引用起来，以免 Shell 执行路径名扩展\"。"},{"ch":"第 35 章","text":"原文以\"有意思的是\"引出第一个现象：对数组赋空值并不会清空其内容（只是把元素 0 清空了）。"},{"ch":"第 35 章","text":"原文强调：\"和整数索引数组不同，后者只需通过引用就能得以创建，而关联数组必须使用 `declare` 命令的 `-A` 选项创建。访问关联数组元素的方法和整数索引数组大同小异。\""},{"ch":"第 36 章","text":"原文以\"注意\"框强调格式要求：**\"Bash 实现分组命令的方式要求，必须用空格符将花括号与命令分隔开，闭合花括号之前的最后一个命令必须以分号或换行符终止，这一点非常重要。\"**"},{"ch":"第 36 章","text":"原文说明两者\"都能用于管理重定向\"，\"利用这项技术，能让我们少敲键盘\"，\"但两者存在重要差异\"（见上面的核心概念与下方\"分组命令 vs 子 Shell\"）。"},{"ch":"第 36 章","text":"原文指出：\"分组命令或子 Shell 真正的闪光点体现在使用管道的时候。如果要构建命令管道，将多个命令的结果合并成单一流往往更实用。\"示例为 `{ ls -l; echo \"Listing of foo.txt\"; cat foo.txt; } | lpr`——把 3 个命令的输出合并后通过管道传给 `lpr` 的输入，生成报告。"},{"ch":"第 36 章","text":"原文解释：使用 `echo` 查看扩展结果，可以看到子 Shell 的输出结果是由名为 `/dev/fd/63` 的文件提供的。`pro-sub` 脚本中，列表本身是由脚本最后一行生成的，该行将进程替换的输出重定向到循环的标准输入；进程替换管道内的 `tail` 命令清除了目录列表中的第一行。原文还提醒：\"由于管道中的命令总是在子 Shell 中执行的，因此任何对变量赋值的命令都会有此问题。\""},{"ch":"第 36 章","text":"原文指出\"构建字符串来形成命令序列未免也太烦琐了，常见做法是指定 Shell 函数作为命令\"。"},{"ch":"第 36 章","text":"原文提醒：\"注意各个信号处理函数中的 `exit` 命令。如果没有 `exit`，脚本执行完函数后不会停止。\""},{"ch":"第 36 章","text":"原文结论是\"更好的方法是使用 `mktemp` 程序命名和创建临时文件\"。"},{"ch":"第 36 章","text":"原文说明：在这个例子中，子脚本并不复杂，真正的操作是由父脚本执行的；父脚本启动子脚本并将其置入后台，用 `$!` 的值保存子脚本的 PID；随后执行带有子脚本 PID 的 `wait` 命令，\"这使父脚本一直暂停到子脚本退出为止，这时父脚本也随之结束\"。"},{"ch":"第 36 章","text":"原文对脚本逐段解释：第 5 行创建 5 个数组（`files` 以文件名作为索引存放文件名，`file_group`、`file_owner` 同理，`groups`、`owners` 存放属于索引属组/属主的文件数量）；第 7～10 行检查目录名是否有效；第 12～20 行循环遍历目录中的文件；第 22～27 行输出文件列表，\"整个循环都出现在花括号中，因而形成了分组命令。如此一来，就可以将循环的整个输出通过管道传给 `sort` 命令。由于扩展后的数组元素是无序的，所以有必要进行排序\"；第 29～40 行使用 `\"${!array[@]}\"` 参数扩展取索引列表。"},{"ch":"第 36 章","text":"\"因此在大多数情况下，除非脚本需要子 Shell，否则，分组命令是更为可取的选择。分组命令不仅更快，而且需要的内存也更少。\""}],"route":["pwd","ls","cd","file","less","mkdir","cp","mv","rm","ln","type","which","man","apropos","cat","echo","grep","sort","uniq","wc","head","tail","find","xargs","sed","touch","chmod","ps","tar","\u003e","|","2\u003e"]};
const R = DATA.records, ROUTE = new Set(DATA.route);
const $ = s => document.querySelector(s);
const label = r => (r.kind === 'cmd' ? r.key : (r.plain || r.key));
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* 行内 markdown：`code` 与 **bold** */
function md(s){
  let t = esc(s);
  t = t.replace(/`([^`]+)`/g, (m,a)=> '<code>'+a+'</code>');
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  return t;
}
/* 把「`cmd ...`（说明…）」拆成主体与说明两段 */
function synParts(s){
  const m = String(s||'').match(/^(`[^`]*`(?:\s*[，,、\/]\s*`[^`]*`)*)\s*([（(][\s\S]*)$/);
  if(m) return [m[1], m[2]];
  return [s, ''];
}
function hl(s, q){
  let t = md(s);
  if(!q) return t;
  try{
    const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
    return t.replace(/(>|^)([^<]*)/g, (m,p,rest)=> p + rest.replace(re,'<mark>$1</mark>'));
  }catch(e){ return t; }
}
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),1500); }
function copy(text, msg){
  const done = ()=>toast(msg||'已复制');
  if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(text).then(done).catch(()=>fallback()); }
  else fallback();
  function fallback(){
    const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity=0;
    document.body.appendChild(ta); ta.select(); try{document.execCommand('copy'); done();}catch(e){} document.body.removeChild(ta);
  }
}

/* ---------- 状态 ---------- */
let st = { q:'', cat:'', chap:'', part:'', filter:'all', sort:'ch', sel:-1, view:[] };

/* ---------- 侧栏 ---------- */
function buildSide(){
  let h = '';
  h += '<h3>快捷视图</h3><div class="nav">';
  const views = [
    ['all','全部命令','◍',R.length],
    ['core','附录 A 核心命令','★',R.filter(r=>r.core).length],
    ['route','3 小时上手路线','⏱',R.filter(r=>ROUTE.has(r.key)).length],
    ['demo','带终端演示','▶',R.filter(r=>r.demo.length).length],
    ['opts','带选项表','⚙',R.filter(r=>r.options.length).length],
  ];
  views.forEach(([k,label,ic,n])=>{
    h += `<button data-nav="f" data-k="${k}" class="${st.filter===k&&!st.cat&&!st.chap&&!st.part?'on':''}">`
       + `<span class="ic">${ic}</span>${label}<span class="n">${n}</span></button>`;
  });
  h += '</div><div class="divider"></div><h3>用途分类</h3><div class="nav">';
  DATA.cats.forEach(c=>{
    h += `<button data-nav="cat" data-k="${esc(c.name)}" class="${st.cat===c.name?'on':''}">`
       + `<span class="ic">${esc(c.name.slice(0,1))}</span>${esc(c.name.slice(1))}<span class="n">${c.keys.length}</span></button>`;
  });
  h += '</div><div class="divider"></div><h3>按章浏览</h3>';
  const parts = {};
  DATA.chapters.forEach(c=>{ (parts[c.part]=parts[c.part]||[]).push(c); });
  Object.keys(parts).sort().forEach(p=>{
    h += `<div class="chgroup"><span>${esc(p)}</span><div class="nav">`;
    parts[p].forEach(c=>{
      const t = c.chapter.replace(/\s/g,'');
      h += `<button data-nav="chap" data-k="${esc(c.chapter)}" class="${st.chap===c.chapter?'on':''}">`
         + `<span class="ic" style="font-family:var(--mono);font-size:11px">${/第(\d+)章/.exec(t)?.[1]||''}</span>`
         + `${esc(c.title)}<span class="n">${c.n}</span></button>`;
    });
    h += '</div></div>';
  });
  $('#side').innerHTML = h;
}

/* ---------- 过滤 ---------- */
function filtered(){
  const q = st.q.trim().toLowerCase();
  let out = R.filter(r => {
    if(st.filter==='core' && !r.core) return false;
    if(st.filter==='route' && !ROUTE.has(r.key)) return false;
    if(st.filter==='demo' && !r.demo.length) return false;
    if(st.filter==='opts' && !r.options.length) return false;
    if(st.cat && !r.cats.includes(st.cat)) return false;
    if(st.chap && r.chapter!==st.chap) return false;
    if(st.part && r.part!==st.part) return false;
    if(!q) return true;
    return (r.key+' '+label(r)+' '+r.cmd+' '+r.desc+' '+r.descShort+' '+r.chapter+' '+r.chapters.join(' ')
            +' '+r.cats.join(' ')+' '+r.cats.join(' ').replace(/\s/g,'')+' '+r.syntax).toLowerCase().includes(q);
  });
  if(st.sort==='az') out = out.slice().sort((a,b)=>a.key.localeCompare(b.key,'en'));
  else if(st.sort==='cat') out = out.slice().sort((a,b)=>(a.cats[0]||'zz').localeCompare(b.cats[0]||'zz','zh'));
  return out;
}

/* ---------- 列表 ---------- */
function render(){
  const list = filtered();
  st.view = list;
  $('#count').innerHTML = `共 <b>${list.length}</b> 条`;
  $('#empty').style.display = list.length ? 'none':'block';
  const tbody = $('#tbody');
  tbody.innerHTML = list.map(r => {
    const badges =
      (r.demo.length ? '<span class="bdg t">▶ 演示</span>' : '') +
      (r.options.length ? `<span class="bdg o">⚙ ${r.options.length}</span>` : '') +
      (r.core ? '<span class="bdg c">★</span>' : '');
    const cat = r.cats.length ? r.cats[0].slice(1) : (r.chapter?'—':'附录 A');
    const ch = r.chapter ? r.chapter.replace(/\s/g,'').replace('第','第 ').replace('章',' 章') : '—';
    return `<tr data-id="${r.id}" class="${st.sel===r.id?'sel':''}">
      <td class="c-cmd"><code>${hl(label(r), st.q)}</code>${r.kind==='cmd'?'':`<span class="kind">${r.kind==='vi'?'Vi':'语法'}</span>`}</td>
      <td class="c-desc">${hl(r.descShort, st.q)}</td>
      <td class="c-cat"><span class="tag">${esc(cat)}</span></td>
      <td class="c-ch">${ch}</td>
      <td class="c-fl">${badges}<span class="chev" style="margin-left:8px">›</span></td>
    </tr>`;
  }).join('');
  // 侧栏选中态
  document.querySelectorAll('[data-nav]').forEach(b=>{
    const t = b.dataset.nav;
    const on = (t==='f' && st.filter===b.dataset.k && !st.cat && !st.chap && !st.part)
            || (t==='cat' && st.cat===b.dataset.k)
            || (t==='chap' && st.chap===b.dataset.k);
    b.classList.toggle('on', !!on);
  });
  $('#foot').innerHTML = `数据来源：《Linux 命令行大全（第 2 版）》新手精编笔记 —— `
    + `${DATA.stats.cards} 张命令/语法卡片 · ${DATA.stats.cats} 类用途 · ${DATA.stats.tips} 条新手易错提示。`
    + `<br>终端实录用于帮助理解输出格式，实际输出随系统与版本而异。`;
}

/* ---------- 终端播放 ---------- */
const PROMPT = '<span class="pr">me@linuxbox</span><span class="pt">:~$</span> ';
let playToken = 0, speed = 1;
function sleep(ms){ return new Promise(r=>setTimeout(r, ms/speed)); }

async function play(demo, box, token){
  box.innerHTML = '';
  const add = (cls, text, withCursor)=>{
    const d = document.createElement('div');
    d.className = 'ln ' + cls;
    d.innerHTML = text;
    box.appendChild(d);
    box.scrollTop = box.scrollHeight;
    return d;
  };
  const cursor = document.createElement('span'); cursor.className='cursor';
  for(const [t, text] of demo){
    if(token !== playToken) return;
    if(t === 'gap'){ add('o','&nbsp;'); continue; }
    if(t === 'cmd'){
      const line = add('o', PROMPT);
      const span = document.createElement('span'); span.className='c';
      line.appendChild(span); line.appendChild(cursor);
      for(const ch of text){
        if(token !== playToken) return;
        span.textContent += ch;
        box.scrollTop = box.scrollHeight;
        await sleep(ch === ' ' ? 16 : 26);
      }
      cursor.remove();
      await sleep(180);
    } else {
      const cls = t === 'cmt' ? 'm' : (t === 'err' ? 'e' : 'o');
      for(const l of String(text).split('\n')){ add(cls, esc(l) || '&nbsp;'); await sleep(cls==='m'?40:28); }
    }
  }
  const end = add('o', PROMPT); end.appendChild(cursor);
}

function renderTerm(rec){
  const box = $('#tbody_term');
  if(!rec.demo.length){
    box.parentElement.querySelector('.term-body').innerHTML =
      '<span class="m">（这条命令在书中没有可直接演示的输出示例，请看「怎么用」里的原书示例。）</span>';
    return;
  }
  playToken++;
  play(rec.demo, $('#tbody_term'), playToken);
}

/* ---------- 抽屉 ---------- */
function related(rec, n){
  let pool = R.filter(r => r.id!==rec.id && r.cats.length && r.cats.some(c=>rec.cats.includes(c)));
  if(!pool.length) pool = R.filter(r => r.id!==rec.id && r.chapter===rec.chapter);
  return pool.slice(0, n||8);
}

function openDetail(id, keepTab){
  const r = R.find(x=>x.id===id); if(!r) return;
  st.sel = id;
  document.querySelectorAll('#tbody tr').forEach(tr=>tr.classList.toggle('sel', +tr.dataset.id===id));
  const cur = keepTab ? ($('.tabs button.on')?.dataset.tab || 'use') : 'use';

  const tags = [];
  if(r.chapter) tags.push(`<span class="tag">${esc(r.chapter.replace(/\s/g,'')+' '+r.chapterTitle)}</span>`);
  if(r.chapters.length>1) tags.push(`<span class="tag">另见 ${r.chapters.slice(1).map(c=>esc(c.replace(/\s/g,''))).join('、')}</span>`);
  r.cats.forEach(c=>tags.push(`<span class="tag">${esc(c)}</span>`));
  if(r.core) tags.push('<span class="tag" style="background:#eaf2fe;border-color:#cfe0fa;color:#0b57a4">★ 附录 A 收录</span>');
  if(r.demo.length) tags.push('<span class="tag" style="background:#e6f7f2;border-color:#bfe9dd;color:#0a7360">▶ 有终端演示</span>');

  $('#drawer').innerHTML = `
    <div class="dw-head">
      <div class="row1"><h2>${esc(label(r))}</h2>${r.kind==='cmd'?'':`<span class="kind" style="position:static">${r.kind==='vi'?'Vi 按键':'语法操作符'}</span>`}</div>
      <p class="sum">${md(r.desc)}</p>
      <div class="dw-tags">${tags.join('')}</div>
      <button class="xbtn" id="dwclose">✕</button>
    </div>
    <div class="tabs">
      <button data-tab="use" class="${cur==='use'?'on':''}">怎么用</button>
      <button data-tab="term" class="${cur==='term'?'on':''}">运行效果</button>
      <button data-tab="pit" class="${cur==='pit'?'on':''}">新手易错</button>
    </div>
    <div class="dw-body" id="dwbody"></div>`;
  $('#drawer').classList.add('on'); $('#bd').classList.add('on');
  $('#dwclose').onclick = closeDetail;
  $('#drawer').querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
    $('#drawer').querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on', x===b));
    paint(r, b.dataset.tab);
  });
  paint(r, cur);
}

function closeDetail(){
  playToken++;
  $('#drawer').classList.remove('on'); $('#bd').classList.remove('on');
}

function paint(r, tab){
  const b = $('#dwbody');
  if(tab === 'use'){
    let h = '';
    if(r.detail && r.detail !== r.desc) h += `<div class="sec"><h4>作用</h4><div class="prose">${md(r.detail)}</div></div>`;
    if(r.syntax){
      const [sp, sn] = synParts(r.syntax);
      h += `<div class="sec"><h4>基本语法</h4><div class="synbox"><pre>${esc(sp)}</pre></div>`;
      if(sn) h += `<div class="prose" style="margin-top:7px;color:var(--muted);font-size:12.5px">${md(sn)}</div>`;
      h += `</div>`;
    }
    if(r.syntaxNote && r.syntaxNote.trim() && r.syntaxNote.trim() !== r.syntax.trim()){
      h += `<div class="sec"><div class="prose">${md(r.syntaxNote)}</div></div>`;
    }
    const opts = r.options.filter(o=>o.flag.startsWith('-') || /^-/.test(o.flag));
    const uses = r.options.filter(o=>!(o.flag.startsWith('-') || /^-/.test(o.flag)));
    if(opts.length){
      h += `<div class="sec"><h4>常用选项</h4><div class="opts">` + opts.map(o=>
        `<div class="opt"><span class="f">${esc(o.flag)}</span><span class="d">${md(o.desc)}</span></div>`).join('') + `</div></div>`;
    }
    if(uses.length){
      h += `<div class="sec"><h4>用法形式</h4><div class="opts">` + uses.map(o=>
        `<div class="opt"><span class="f">${esc(o.flag)}</span><span class="d">${md(o.desc)}</span></div>`).join('') + `</div></div>`;
    }
    if(r.examples.length){
      h += `<div class="sec"><h4>书中示例</h4><div class="cmds">` + r.examples.map((c,i)=>{
        const body = c.split('\n').map(l=>{
          const t = l.trim();
          if(t.startsWith('#')) return '<span class="cm">'+esc(l)+'</span>';
          return esc(l).replace(/^(\S+)/, '<span class="hl">$1</span>');
        }).join('\n');
        return `<div class="codebox"><div class="codebar"><span class="ttl">示例 ${i+1}</span>`
          + `<button class="mini" data-copy="${encodeURIComponent(c)}">复制</button></div><pre>${body}</pre></div>`;
      }).join('') + `</div></div>`;
    }
    const rel = related(r, 10);
    if(rel.length){
      h += `<div class="sec"><h4>同类命令</h4><div class="relchips">` + rel.map(x=>
        `<button data-goto="${x.id}">${esc(label(x))}</button>`).join('') + `</div></div>`;
    }
    b.innerHTML = h;
  }
  else if(tab === 'term'){
    const has = r.demo.length;
    b.innerHTML = `
      <div class="sec"><h4>模拟终端</h4>
        <div class="term">
          <div class="term-bar">
            <span class="dots"><i></i><i></i><i></i></span>
            <span class="ttl">me@linuxbox:~$ ${esc(label(r))}</span>
            <button class="mini" id="treplay">重播</button>
            <button class="mini" id="tspeed">1× 速度</button>
            <button class="mini" id="tcolor">深色</button>
            <button class="mini" id="tcopy">复制命令</button>
          </div>
          <pre class="term-body" id="tbody_term"></pre>
        </div>
        <p class="term-note">${has
          ? '提示：灰色是以 <code>#</code> 开头的讲解注释；红色为标准错误（stderr）。'
          : '此命令没有合适的输出演示。'}</p>
      </div>`;
    if(has){
      renderTerm(r);
      const speeds=[1,2,4], names=['1×','2×','4×','即时'];
      let si = 0;
      $('#tspeed').onclick = ()=>{
        si = (si + 1) % 4;
        speed = si===3 ? 9999 : speeds[si];
        $('#tspeed').textContent = names[si] + (si===3?'':' 速度');
        playToken++; const tk = ++playToken; play(r.demo, $('#tbody_term'), tk);
      };
      $('#treplay').onclick = ()=>{ playToken++; play(r.demo, $('#tbody_term'), playToken); };
      $('#tcolor').onclick = e=>{
        const root = document.documentElement;
        const dark = root.getAttribute('data-term') === 'dark';
        root.setAttribute('data-term', dark ? 'light':'dark');
        e.target.textContent = dark ? '深色':'浅色';
      };
      $('#tcopy').onclick = ()=>{
        copy(r.demo.filter(d=>d[0]==='cmd').map(d=>'$ '+d[1]).join('\n'), '命令已复制');
      };
    }
  }
  else {
    const items = [];
    if(r.tips.length) items.push(...r.tips);
    if(r.relTips.length) items.push(...r.relTips);
    const uniq = [...new Set(items)];
    let h = '';
    if(uniq.length){
      h += `<div class="sec"><h4>原书提示</h4>` + uniq.map(t=>`<div class="tipbox">${md(t)}</div>`).join('') + `</div>`;
    } else {
      h += `<div class="sec"><h4>原书提示</h4><div class="empty2">这条命令在原书里没有单独的易错提示。</div></div>`;
    }
    h += `<div class="sec"><h4>速记</h4>
      <div class="prose">
        <p><code>${esc(r.key)}</code> 出现在 <strong>${r.chapters.length?r.chapters.map(c=>esc(c.replace(/\s/g,''))).join(' / '):'附录 A 索引'}</strong>${r.idxChapters && r.idxChapters.replace(/\s/g,'') !== r.chapters.join('、').replace(/\s/g,'') ? `（索引标注：${esc(r.idxChapters)}）`:''}。</p>
        ${r.cats.length?`<p>用途分类：${r.cats.map(c=>`<code>${esc(c)}</code>`).join('、')}。</p>`:''}
      </div></div>`;
    b.innerHTML = h;
  }
  b.querySelectorAll('[data-copy]').forEach(btn=>
    btn.onclick = ()=>copy(decodeURIComponent(btn.dataset.copy), '已复制到剪贴板'));
  b.querySelectorAll('[data-goto]').forEach(btn=>
    btn.onclick = ()=>openDetail(+btn.dataset.goto, true));
  b.parentElement.scrollTop = 0;
  b.scrollTop = 0;
}

/* ---------- 事件 ---------- */
$('#tbody').addEventListener('click', e=>{
  const tr = e.target.closest('tr'); if(!tr) return;
  openDetail(+tr.dataset.id);
});
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
  st.filter = c.dataset.f;
  document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on', x===c));
  render();
});
$('#sortby').onchange = e=>{ st.sort = e.target.value; render(); };
$('#side').addEventListener('click', e=>{
  const b = e.target.closest('[data-nav]'); if(!b) return;
  const t = b.dataset.nav;
  if(t==='f'){ st.filter = b.dataset.k; st.cat=''; st.chap=''; st.part='';
    document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on', x.dataset.f===st.filter)); }
  else if(t==='cat'){ st.cat = st.cat===b.dataset.k ? '' : b.dataset.k; st.chap=''; }
  else { st.chap = st.chap===b.dataset.k ? '' : b.dataset.k; st.cat=''; }
  render(); $('#main').scrollTop = 0;
});
$('#bd').onclick = closeDetail;
$('#q').addEventListener('input', e=>{ st.q = e.target.value; render(); });
document.addEventListener('keydown', e=>{
  if(e.key === '/' && document.activeElement !== $('#q')){ e.preventDefault(); $('#q').focus(); return; }
  if(e.key === 'Escape'){
    if($('#drawer').classList.contains('on')) closeDetail();
    else if(document.activeElement === $('#q')){ $('#q').value=''; st.q=''; render(); $('#q').blur(); }
  }
  const open = $('#drawer').classList.contains('on');
  if((e.key === 'ArrowDown' || e.key === 'ArrowUp') && !open){
    if(document.activeElement === $('#q')) return;
    e.preventDefault();
    const list = st.view; if(!list.length) return;
    let i = list.findIndex(r=>r.id===st.sel);
    i = e.key==='ArrowDown' ? Math.min(i+1, list.length-1) : Math.max(i-1, 0);
    if(i<0) i = 0;
    openDetail(list[i].id);
    document.querySelector(`#tbody tr[data-id="${list[i].id}"]`)?.scrollIntoView({block:'nearest'});
  }
  if(e.key === 'Enter' && document.activeElement === $('#q') && st.view.length) openDetail(st.view[0].id);
});

/* ---------- 启动 ---------- */
$('#stats').innerHTML = [
  [DATA.stats.records, '条命令'],
  [DATA.stats.core, '附录 A 核心'],
  [DATA.stats.demos, '有演示'],
  [DATA.stats.cats, '类用途'],
  [DATA.stats.tips, '条易错提示'],
].map(([n,l])=>`<div class="stat"><b>${n}</b><i>${l}</i></div>`).join('');
buildSide();
render();
</script>
</body>
